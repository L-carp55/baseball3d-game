         非封殺の内野ゴロで一律 r.origin へ戻していたため、打った瞬間に自動スタートした
         二塁走者が、捕球のフレームで三塁→二塁へ反転して逆走していた
         （録画20260805_105253で機械確認、OI-140は8/4・OI-238は8/5の同一事象＝退行）。
         塁を0.35以上離れていれば「戻るより進む方が近い」＝踏み切ったとみなす。 */
      const committed = (r.origin>0 && r.p - r.origin >= 0.35);
      let auto = (kind==='outfield')
        ? safeReach(r, f)
        : ((r.origin===0 || isForced(r) || baseOuts()>=2) ? Math.min(4, r.origin+1)
           : (committed ? Math.min(4, r.origin+1) : r.origin));
      if(aheadGoal<4) auto=Math.min(auto, aheadGoal-1);
      const floorBase = (r.origin===0) ? 1
                      : (isForced(r) ? r.origin+1 : Math.max(r.origin, Math.floor(r.p+1e-9)));
      auto=Math.max(auto, floorBase);
      r.safeGoal = auto;                 // 自動で狙う塁（無条件セーフの意味ではない）
      setAutoGoal(r, auto);              // 手動の指示はこの上に足される
      aheadGoal = (auto<4) ? auto : 99;  // 本塁は何人でも入れる
    });
  }
  /* 送球先は「間に合う見込みのある一番先の塁」。
     見込みが無いのに本塁へ投げると走者が必ず刺されてしまい、単打で誰も還れなくなる
     （実際にそうなっていた）。届かないと分かっている塁には投げない。 */
  const decision=decideThrowTarget(f,{kind,flyLead:kind==='fly'?flyLead:undefined,
    manualTarget:(!isPlayerBatting()?manualThrow:null)});
  throwPlay = {
    /* フライを捕った野手の名前。結果表示は「捕った人」で作る。
       表示時にその時点のボール保持者(thrower)を使うと、返球を経た後に
       「右フライ」が「投フライ」に化ける（録画で確認）。 */
    flyBy: kind==='fly' ? f.n : null,
    stage:'transfer', t:0,
    /* 持ち替え時間 = 守備力（捕ってから投げるまでの動作の速さ）＋捕球（握り直しの確実さ）。
       捕球が低いと一定確率で捕り損ね、さらに時間がかかる。 */
    transfer: transferTime(f,transferContextForBattedBall(kind)) + rnd(0,0.10)
              + (Math.random()<A.fumble(f.cat) ? rnd(0.55,1.15) : 0),
    transferContext:transferContextForBattedBall(kind),
    thrower:f, kind, award,
    target:decision.nb, decisionSource:decision.source, decisionSeq:1,
    decisionReason:decision.reason||'', decisionMargin:decision.margin||0, decisionUtility:decision.utility||0,
    decisionExpectedOuts:decision.expectedOuts||0, decisionContinuationProbability:decision.continuationProbability||0,
    relayed:false,
    fieldT: ball.t
  };
  f.possessionContext=throwPlay.transferContext;
  ball.vx=0; ball.vy=0; ball.vz=0; ball.z=4.6;
  ball.x=f.cx; ball.y=f.cy;
  S.phase='throwing';
  if(kind!=='fly') setMsg('','');   // フライは捕球時に出したアウト表示を消さない
}
/* ボールを持っている野手が、塁を離れている走者に触れたらアウト。
   野球では塁上でなくても、塁間にいる走者はタッチされた時点でアウトになる。
   これまで挟殺プレーの中でしか判定していなかったため、
   ボールを持った野手のすぐ横を走者が通り抜けても何も起きなかった。 */
function tagNearbyRunner(holder){
  if(!holder) return null;
  for(const r of runners){
    if(r.out) continue;
    /* 塁に触れていればセーフ。ただし押し出されている走者はその塁の権利を失っているので、
       元の塁の上にいてもタッチでアウトにできる（野球規則5.06(a)(1)）。 */
    const forcedOff = r.origin>0 && isForced(r) && Math.round(r.p)===r.origin;
    if(!forcedOff && Math.abs(r.p-Math.round(r.p))<0.012) continue;
    if(r.p>=4-1e-6) continue;                            // 生還済み
    const q=runnerPos(r);
    if(Math.hypot(holder.cx-q.x, holder.cy-q.z) < 3.0){ markOut(r,'tag'); return r; }
  }
  return null;
}
/* ボールを確保して送球準備へ入った野手は、直前の打球追跡目標を引きずらない。
   はじいた球を拾い直した後などに intercept-replan の古い目標へ走り続けると、
   ボールを手に持ったまま後退しながら送球する。transfer は「足を止めて送球姿勢を作る」段階で、
   自分で塁を踏む step や挟殺で詰める approach は別段階なので、ここでは止めない。 */
function prepareThrowerFootwork(T){
  if(!T || T.stage!=='transfer' || !T.thrower) return false;
  const f=T.thrower;
  setTarget(f,f.cx,f.cy);          // 打球追跡・中継位置などの古い移動目標を破棄
  f.v=0;                           // 送球準備中に旧目標へ惰性移動しない
  const p=throwPoint(T.target);
  const dx=p[0]-f.cx, dy=p[1]-f.cy;
  if(Math.hypot(dx,dy)>0.25) f.face=Math.atan2(dx,dy); // 送球先へ身体を向ける
  return true;
}

function updateThrowPhase(dt){
  const T=throwPlay;
  T.t+=dt;
  /* プレー全体の打ち切り。切り返しの送球が延々と続いて決着しない場面があった
     （三塁走者が本塁と三塁の間を往復し、そのたびに新しい送球が始まって19秒続く）。
     実際の野球でも決着がつかなければ走者は塁に戻って終わる。 */
  S.playClock=(S.playClock||0)+dt;
  /* 挟殺は自前の時間制限(updateRundown の R.t>9)を持っているので、
     プレー全体の打ち切りでは止めない。ここで一律に切っていたため、
     追い込んでいる途中の挟殺が強制的にセーフで終わっていた。
     それでも終わらない時のための最後の歯止めだけ、うんと長い所に残す。 */
  const inRundown = (T.stage==='rundown');
  /* ★2026-08-05修理: 歯止めを時間切れより先に評価する。
     以前は時間切れがこの位置で return していたため、下の「塁間なら閉じない」
     「走塁キーを押している間は閉じない」が一度も評価されずに迂回されていた。
     オーナー指摘の最多系統（塁間で打ち切られる12件・本塁未到達で得点4件・
     送球が空中なのに打ち切り3件）の共通原因。実測でも今日の最長プレーは11.2秒で
     12秒の閾値まで余裕0.8秒しかなかった＝日常的に踏む位置にあった。 */
  const lifecycle=playLifecycleState();
  const flyWait=lifecycle.flyDecision, keyHeld=lifecycle.keyHeld;
  const allSettled=!lifecycle.unsettled, midBase=lifecycle.unsettled, ballLive=lifecycle.liveBall;
  /* watchdogは終了を「要求」するだけで、ライブ送球・塁間走者・操作中の門番を迂回しない。
     閉じられない時はreturnせず、そのフレームの捕球・回収・走塁処理を続ける。 */
  const grace = (midBase || keyHeld || ballLive) ? 8 : 0;
  if(S.playClock > (inRundown?24:12) + grace){
    if(inRundown) return endRundown('セーフ！','#3fd66a');
    if(requestPlayConclusion('watchdog')) return;
  }
  /* 投手へ返すだけになり、走者も全員止まっているなら、そこでプレーは終わり。
     ボールが投手の手に戻るまで待っていたため、走者が一塁に着いて何も起きていないのに
     さらに6秒待たされていた（ポテンヒットで1プレー13秒）。 */
  /* ただしフライ捕球の直後だけは、すぐに閉じない。タッチアップは捕った“後”に走り出すもので、
     ここで即座に打ち切ると、捕球前からSを押していないとタッチアップできなくなる。
     走者がいる時は1.5秒だけ判断の間を置く。 */
  /* flyWait / keyHeld / allSettled は上の時間切れ判定より前で計算済み（2026-08-05修理）。
     走者が塁間にいる間はプレーを閉じない（塁の上に着いていることまで確認する）。
     走塁キーを押している間も閉じない。次の塁を狙おうとしているのに
     プレーを終わらせてしまうと、操作が効かなかったように見える。 */
  if(T.target==='P' && T.stage!=='rundown' && !flyWait && !keyHeld && allSettled){
    /* 終了要求がlive-ball等で拒否された時はreturnしない。ここは物理更新より前なので、
       returnすると同じ球位置・速度のまま毎フレーム再び拒否され、送球が永久に凍結する。 */
    if(requestPlayConclusion('settled-return')) return;
  }
  updateRunners(dt);
  /* moveFielders より先に保球者を固定する。後から止めると1フレームだけ古い
     intercept 目標へ動き、録画上でも後退が残る。 */
  if(T.stage==='transfer') prepareThrowerFootwork(T);
  moveFielders(dt,true);
  /* ボールを持っている野手は誰か。持っている間はいつでもタッチが成立する。 */
  const holder = (T.stage==='transfer'||T.stage==='step'||T.stage==='approach') ? T.thrower
               : (T.stage==='catch') ? T.receiver
               : (T.stage==='rundown' && T.rd && T.rd.sub==='chase') ? T.rd.holder : null;
  if(holder){          // フライ捕球後も、塁を離れている走者にはタッチが成立する
    const tagged = tagNearbyRunner(holder);
    if(tagged){
      if(T.stage==='rundown') return endRundown('タッチアウト！','#95a3b4');
      /* タッチした後もアウトを取れる走者が残っていれば、送球して続ける。
         1つ目のアウトでプレーを終えていたため、続く併殺を毎回捨てていた。 */
      /* 本塁へ向かっている走者がいる限り、プレーは終わっていない。
         打者走者をアウトにした時点で閉じていたため、三塁走者が本塁の手前60%の所にいるのに
         「1点」と確定してプレーが打ち切られていた（録画で確認）。 */
      const nxt=(baseOuts()+countOuts()<3)
        ? decideThrowTarget(holder,{kind:'live',homeIfAdvancing:true}) : null;
      if(nxt && nxt.nb!=='P'){
        T.thrower=holder; setThrowTarget(T,nxt.nb,'post-tag-'+nxt.source); T.stage='transfer'; T.t=0;
        T.stepChecked=false; T.relayed=true;      // 追加の送球（併殺の2つ目）
        setTransferContext(T,holder,'held-ball',0.03);
        return;
      }
      /* 打者走者を一塁到達前にアウトにしたものは、触っていても普通のゴロアウト。
         「二ゴロ → タッチアウト！」と出ていて不自然だった。 */
      if(!(tagged.origin===0 && tagged.p<1-1e-9)){ T.rdText='タッチアウト！'; T.rdColor='#95a3b4'; }
      return requestPlayConclusion('request');
    }
  }

  if(T.stage==='transfer'){
    ball.x=T.thrower.cx; ball.y=T.thrower.cy; ball.z=4.6;
    if(T.kind==='breakaway'){
      const liveDecision=decideBreakawayTarget(T.thrower,T.target);
      if(liveDecision.nb==='P'){
        T.stealText=T.stealText||'飛び出しから戻ってセーフ';
        return concludeSteal();
      }
      setThrowTarget(T,liveDecision.nb,'breakaway-live-'+liveDecision.source,liveDecision);
    }
    /* transfer 中に送球先が変わった場合も、そのフレームで身体の向きを更新する。 */
    prepareThrowerFootwork(T);
    /* 自分で塁を踏むなら持ち替えは要らない（握り直さず、そのまま踏みに行く）。
       持ち替えを待ってから歩き出していたため、投げるより遅くなってセーフになっていた。
       カバーがすでに塁に入っているなら、自分で行かずに投げる。 */
    if(!T.stepChecked && T.target!=='P' && T.kind!=='fly' && T.kind!=='steal'){
      T.stepChecked=true;
      const tp0=throwPoint(T.target);
      const my=Math.hypot(tp0[0]-T.thrower.cx, tp0[1]-T.thrower.cy);
      const mine=reachTimeToPoint(T.thrower,tp0[0],tp0[1],{
        useCurrent:true,speedScale:0.88,reaction:false,turn:true});
      const cov=coverArrival(T.target, null);
      if(my<30 && mine < cov + T.transfer){
        setTarget(T.thrower, tp0[0], tp0[1]);
        T.receiver=T.thrower; T.dest=tp0;
        T.stage='step'; T.t=0;
        return;
      }
    }
    if(T.t>=T.transfer){
      /* ★2026-08-05修理: けん制はカバーが塁に入るまで投げない（オーナー仕様OI-106の
         「カバーが塁に入ってから投げる」をけん制の経路にも適用。打球の経路にだけ入れて
         けん制に入れ忘れていた）。録画20260805_125004: 二塁けん制で、カバーの遊撃手が
         塁から37ftの時点で投げ、誰も捕れずセンター後方272ftまで転々→三塁走者が生還。
         捕り手の到着が送球の到着に間に合わないうちは持って待ち、1.5秒待っても
         間に合わないならけん制を中止する（投手が持ったまま＝実際の野球と同じ）。 */
      if(T.kind==='pickoff'||T.kind==='breakaway'){
        const tp0=throwPoint(T.target);
        const dist=Math.hypot(tp0[0]-T.thrower.cx, tp0[1]-T.thrower.cy);
        const flight=dist/117;                       // 内野送球80mph≒117ft/s
        const cov=coverArrival(T.target, null);
        if(cov > flight + 0.15){
          /* 待っている間に走者が塁へ戻り切ったら、投げても意味が無い＝投げずに終える
             （実際の野球で投手が偽投だけして戻すのと同じ）。二塁けん制はカバーの
             遊撃手が塁から遠く、待ち時間が最初の実装(1.5秒)を超えることがあり、
             一律中止だと通常配置でも一度も投げられなくなっていた（単体検証で発覚）。 */
          const tr=T.kind==='pickoff'?runners.find(r=>!r.out && r.origin===T.target):null;
          /* ★2026-08-05修理2（Sol Ultra 所見22）: 早出し(jumped)へのけん制は、
             カバーを待っている間に走者が戻り切っても即やめない。
             やめていたため二塁けん制は488回中488回すべて送球前に消え、
             早出しを罰する仕組みが機能しなくなっていた（私の同日の修理が作った退行）。
             通常リード（飛び出し0.12塁未満）の走者が戻ったなら投げる意味が無いので終える。 */
          /* 判定は「開始時にどれだけ飛び出していたか」だけで行う。r.jumped はけん制の
             発火条件そのもの（けん制は早出し時しか起きない）なので、それを見ると
             常に真になり中止が一度も働かなくなる。 */
          const wasJump = (T.jumpLead||0) >= 0.12;
          if(tr && Math.abs(tr.p-tr.origin)<=0.05 && !wasJump) return requestPlayConclusion('request');
          if(T.t < T.transfer + 2.6) return;         // カバーが入るまで持って待つ
          return requestPlayConclusion('request');                     // それでも間に合わない＝中止
        }
      }
      /* 投げる瞬間に、その時点の走者の位置で投げ先を決め直す。
         捕った時の判断のまま投げると、中継が受け取ってから投げ直す時に
         1〜2秒前の状況へ投げてしまう（二塁を狙う走者がいるのに一塁へ投げる、等）。 */
      /* 牽制は投げる先が決まっている（飛び出した走者の塁）。ここに含めていたため、
         「戻れる走者は狙わない」という打球用の判断が牽制にも働き、
         送球先が投手に書き換わって塁に誰も入らず、走者が悠々と次の塁へ進んでいた。 */
      const releaseDecision=decideThrowTarget(T.thrower,{kind:T.kind,currentTarget:T.target,
        relayed:T.relayed,manualTarget:(!isPlayerBatting()?manualThrow:null)});
      setThrowTarget(T,releaseDecision.nb,releaseDecision.source+'-release',releaseDecision);
      /* 自分が送球先の塁のすぐそばにいるなら投げない（自分で塁を踏む）。
         一塁手が誰もいない一塁へ投げる、といった不自然な動きを防ぐ。 */
      const tp=throwPoint(T.target);
      /* 自分がカバーより早く塁に着けるなら投げずに自分で踏む。
         固定距離で決めると、三塁手が三塁のすぐ近くにいても投げてしまう。 */
      const myStep = Math.hypot(tp[0]-T.thrower.cx, tp[1]-T.thrower.cy);
      if(T.target!=='P' && myStep < 6){          // 目の前の塁は自分で踏む
        setTarget(T.thrower, tp[0], tp[1]);
        T.receiver=T.thrower; T.dest=tp;
        T.stage='step'; T.t=0;
        return;
      }
      /* 塁間の走者を、どちらの塁へ投げても刺せない時は投げない。
         ボールを持ったまま走者へ詰め、どちらへ投げても間に合う距離にしてから動く。
         いきなり投げると、投げた反対側の塁へ楽に進まれてしまう。 */
      const trap = trappedRunner(T.thrower);
      if(trap && T.kind!=='fly' && T.kind!=='breakaway' && !T.relayed){
        T.stage='approach'; T.trap=trap; T.t=0; return;
      }
      /* 送球の回数にも上限を置く。走者が塁間を行き来するたびに投げ続け、
         決着しないまま20秒近く続く場面があった。実際の守備も、アウトが取れないと
         分かった時点で投手へ返して終わりにする。 */
      S.throwCount=(S.throwCount||0)+1;
      if(S.throwCount>6 && T.stage!=='rundown') setThrowTarget(T,'P','throw-limit');
      // 投手への返球は投手本人が受ける。それ以外はカバーに入っている野手が受ける
      let recv = (T.target==='P') ? fielders.find(f=>f.n==='投') : coverOf(T.target, T.thrower);
      let p = (T.target==='P' && recv) ? [recv.cx, recv.cy] : throwPoint(T.target);
      /* 肩が届かない距離は中継に入れる。届かない送球をそのまま投げると、
         手前で落ちて誰も取りに行かないまま止まってしまう。 */
      const far=Math.hypot(p[0]-T.thrower.cx, p[1]-T.thrower.cy);
      const reachable=throwSpeed(armEff(T.thrower), 200);
      const maxD=reachable*reachable/32.2*0.92;          // その初速で届く最大距離
      /* 中継に入れる条件は「物理的に届かない」ではなく「低い弾道で届かない」。
         届きさえすれば高い山なりを直接投げていたため、バウンドが受け手の頭を越え、
         プロなら中継に返す場面で緩いロブが飛んでいた（録画220141、オーナー指摘
         「深い位置からは中継に返球する」）。 */
      if(far>maxD || !throwFlatOK(far, throwSpeed(armEff(T.thrower), far))){
        /* 中継はベースカバーに入っていない野手を優先する。カバー中の野手を引き抜くと
           返球の間その塁が無人になる。他に居なければ引き抜くが、その塁は別の野手が埋める。 */
        const pick = (freeOnly)=>{ let cut=null,cd=1e9;
          fielders.forEach(f=>{ if(f===T.thrower || f===recv || f.primary) return;
            if(freeOnly && f.coverBase!=null) return;
            if(!freeOnly && f.coverBase!=null &&
               !findCoverCandidate(f.coverBase,[f,T.thrower,recv])) return;
            const t=Math.hypot(p[0]-f.cx,p[1]-f.cy)+Math.hypot(f.cx-T.thrower.cx,f.cy-T.thrower.cy);
            if(t<cd && Math.hypot(f.cx-T.thrower.cx,f.cy-T.thrower.cy)<maxD){ cd=t; cut=f; } });
          return cut; };
        const cut = pick(true) || pick(false);
        if(cut && releaseCoverForTemporaryRole(cut,'relay',[T.thrower,recv])){
          recv=cut; p=[cut.cx,cut.cy]; T.relayTo=T.target;
        }
      }
      /* 送球のそれ。送球精度(送)が低いほど狙いから外れる。判定の基準点(T.dest)は
         塁のままにして、ボールだけがそれる（それた球は受け手の居残り判定・迎え・chaseが処理）。 */
      const farLaunch=Math.hypot(p[0]-T.thrower.cx, p[1]-T.thrower.cy);
      const off=throwOffset(T.thrower, farLaunch);
      launchThrow(T.thrower.cx,T.thrower.cy,p[0]+off[0],p[1]+off[1],armEff(T.thrower));
      if(recv) setTarget(recv,p[0],p[1]);   // 受け手は送球先で待つ（投手も同じ）
      /* カットオフ（セオリー準拠 2026-08-04導入）: 外野からの本塁送球は、
         左翼側=三塁手／中堅・右翼側=一塁手が「外野手と本塁の直線上」約45ftに入る。
         今は位置取り（見た目とこぼれ球の回収圏）のみで、送球の切り取り判断は次段。 */
      if(T.target===4 && farLaunch>158){
        const cutN = (T.thrower.cx < -30) ? '三' : '一';
        const cut = fielders.find(x=>x.n===cutN);
        if(cut && cut!==T.thrower && cut!==recv && !cut.primary &&
           releaseCoverForTemporaryRole(cut,'home-cutoff',[T.thrower,recv])){
          const cd = Math.max(1, Math.hypot(T.thrower.cx-p[0], T.thrower.cy-p[1]));
          setTarget(cut, p[0]+(T.thrower.cx-p[0])/cd*45, p[1]+(T.thrower.cy-p[1])/cd*45);
        }
      }
      /* バックアップ。手の空いた野手1人が送球線の延長20ft後方へ入る（実際の野球の基本動作）。
         それた球を後ろで止める人が誰もおらず、悪送球のたびに大きく転がっていた
         （録画202420、オーナー指摘「他の内野手がカバーに入っているべき」）。 */
      if(farLaunch>1){
        const bx=p[0]+(p[0]-T.thrower.cx)/farLaunch*20, by=p[1]+(p[1]-T.thrower.cy)/farLaunch*20;
        let bu=null, bd=1e9;
        fielders.forEach(f=>{
          if(f===T.thrower || f===recv || f.coverBase!=null || f.primary) return;
          const dd=Math.hypot(bx-f.cx, by-f.cy);
          if(dd<bd){ bd=dd; bu=f; }
        });
        if(bu && bd<110) setTarget(bu, bx, by);
      }
      T.receiver=recv;
      T.stage='fly'; T.t=0; T.dest=p;
    }
    return;
  }
  if(T.stage==='fly'){
    let acc=Math.min(0.30,(T.acc||0)+dt), g=0;
    while(acc>=PHYS_H && g++<900){ acc-=PHYS_H; stepBall(ball,PHYS_H); ball.t+=PHYS_H; }
    T.acc=acc;
    trail.push([ball.x,ball.z,ball.y]); if(trail.length>18) trail.shift();
    /* 受け手は送球の「実際に来る場所」へ寄って捕る。多少それた送球は捕る側が
       動いて処理するのが普通で、塁の上で棒立ちのまま「それた判定」を待たない
       （録画で指摘のあった不具合）。0.2秒ごとに軌道を先読みして立ち位置を直す。 */
    if(!T.chased && T.receiver && ball.t > (T.meetT||0)+0.20){
      T.meetT=ball.t;
      /* 塁を離れて迎えに出るかは「塁上で捕れるか」で決める。
         塁の最接近時に (a)横のずれがグラブ圏内5ft (b)高さが跳んで届く8.5ft以下 なら塁上で捕れる
         ＝ベースに残る。以前は「捕球の高さ4.5ftまで降りてくる地点」を目標にしていたため、
         胸の高さで塁上を通過する普通の送球でも、その降下点＝塁の後方へ迎えに出てしまい、
         一塁手が毎回ベースの後ろで捕って封殺が不成立になっていた（録画183359）。
         本当にそれた送球だけ、捕れる高さに降りる地点へ迎えに出る（chase側の回収と併用）。 */
      const pb={x:ball.x,y:ball.y,z:ball.z,vx:ball.vx,vy:ball.vy,vz:ball.vz,bs:0,ss:0};
      let bestD=1e9, bestZ=0, land=null;
      for(let i=0;i<480;i++){
        stepBall(pb,PHYS_H);
        const dd=Math.hypot(pb.x-T.dest[0], pb.y-T.dest[1]);
        if(dd<bestD){ bestD=dd; bestZ=pb.z; }
        if(!land && pb.z<=4.5) land=[pb.x,pb.y];
        if(pb.z<=0.1 && Math.hypot(pb.vx,pb.vy)<3) break;
      }
      if(bestD<5 && bestZ<=8.5) setTarget(T.receiver, T.dest[0], T.dest[1]);   // 塁上で捕れる＝残る
      else if(land && Math.hypot(land[0]-T.dest[0], land[1]-T.dest[1])<26)
        setTarget(T.receiver, land[0], land[1]);   // 大きく外れた球は追わない（chase側が拾う）
    }
    let d=Math.hypot(ball.x-T.dest[0], ball.y-T.dest[1]);
    /* 捕球の発火は「受け手との距離」で見る。塁との距離で見ていたため、
       塁から5ft超それた送球は、受け手が降下点で構えていても目の前を素通りしていた
       （録画205904: 本塁への返球が6.7ftずれ→捕手の前を抜けてバックネットへ。
       「本塁への送球がほぼ確実にそれる」の正体）。受け手が動いて捕るのが実際の野球。 */
    let dRecv = T.receiver ? Math.hypot(ball.x-T.receiver.cx, ball.y-T.receiver.cy) : d;
    /* それた球の回収は「頭上を越えた/着弾した」瞬間に始める。発射から2.6秒の固定待ちだと、
       通過してから1秒以上誰も反応しない（録画202420、オーナー指摘「取りに行くべき」）。 */
    if(!T.chased && dRecv>=5 && (T.sailed || ball.landed || T.t>2.6)) T.chased=true;
    if(T.chased){
      /* それた球の回収は「一番近い野手」。受け手固定だと、遠い受け手が
         延々と追いかけ、すぐ横の野手が突っ立って見ている（録画で確認）。 */
      let best=T.receiver, bd=1e9;
      fielders.forEach(f=>{ const q=Math.hypot(ball.x-f.cx,ball.y-f.cy);
        if(q<bd){ bd=q; best=f; } });
      T.receiver=best;
      setTarget(T.receiver, ball.x, ball.y);
      dRecv=Math.hypot(ball.x-T.receiver.cx, ball.y-T.receiver.cy);
      T.dest=[ball.x,ball.y];
    }
    if(T.chased && T.t>8 && requestPlayConclusion('chase-watchdog')) return;
    /* 高さも見る。横の距離だけで捕球としていたため、受け手の頭のはるか上（19ft）を
       通過している送球まで吸い込まれていた（録画で確認）。
       跳んで届くのは約9ftまで。それより高い送球はそのまま頭上を越えていく＝悪送球。 */
    /* 頭上を越える高さの送球はそのまま通過させる。ただし肩が弱くて山なりになっただけの
       送球までエラーとして数えない（記録が実際よりずっと多くなっていた）。
       エラーにするのは「まっすぐ投げられる距離なのに大きく外した」時だけ。 */
    if(dRecv<5 && ball.z>9.5){
      if(!T.sailed){ T.sailed=true;
        const far=Math.hypot(T.dest[0]-T.thrower.cx, T.dest[1]-T.thrower.cy);
        if(far < 110) S.errorBy=(T.thrower.name||T.thrower.n); }
      return;                                      // 通り過ぎさせる（この後 chased で拾いに行く）
    }
    if(dRecv<5 && ball.z<=9.5){
      // 受け手が捕って塁に触れるまでの間。送球がずれるほど手間取る
      T.stage='catch'; T.t=0;
      const recvCat=clamp((T.receiver&&T.receiver.cat)||60,1,100)/100;
      T.catchDur = 0.04 + 0.08*(1-recvCat) + (T.chased?0.12:0) + rnd(0,0.04);
      if(T.receiver) T.receiver.possessionContext=receiveTransferContext(T);
      /* 捕った瞬間に球を手へ固定する。次フレームのタッチ判定→即終了が
         捕球スナップより先に走ると、飛行速度が残ったままプレーが締まり、
         捕った球が幽霊のように飛び続けていた（録画215858「悪送球なのにチェンジ」＝
         実際は正規の捕球アウトで、見た目だけが後ろへ飛んでいた）。 */
      if(T.receiver){ ball.x=T.receiver.cx; ball.y=T.receiver.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0; }
    }
    return;
  }
  /* ボールを持ったまま走者へ詰め寄る段階。どちらの塁へ投げても間に合う距離まで近づいたら
     挟殺プレーに入る。走者が塁へ逃げ切れる状況で先に投げると、必ず反対側へ進まれる。 */
  if(T.stage==='approach'){
    const r=T.trap;
    ball.x=T.thrower.cx; ball.y=T.thrower.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0;
    updateRunners(dt); moveFielders(dt,true);
    if(r.out || Math.abs(r.p-Math.round(r.p))<0.03){    // 走者が塁に着いてしまった
      T.stage='transfer'; T.t=0; T.stepChecked=false; return;
    }
    const rp=runnerPos(r);
    setTarget(T.thrower, rp.x, rp.z);
    const lo=Math.floor(r.p+1e-9), hi=Math.min(4, lo+1);
    const back={...r, goal:lo}, fwd={...r, goal:hi};
    const canLo = runnerBackETA(back) > throwETAof(T.thrower,lo);
    const canHi = runnerETA(fwd,hi)   > throwETAof(T.thrower,hi);
    const near = Math.hypot(rp.x-T.thrower.cx, rp.z-T.thrower.cy);
    if((canLo && canHi) || near<26 || T.t>4.5){
      T.receiver=T.thrower;
      return beginRundown(r, hi);
    }
    return;
  }
  /* ボールを持った野手が自分で塁を踏みに行く段階。
     踏む前にアウトを宣告してはいけない（遊撃手が二塁を踏む前に併殺が成立していた）。 */
  if(T.stage==='step'){
    ball.x=T.thrower.cx; ball.y=T.thrower.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0;
    if(Math.hypot(T.dest[0]-T.thrower.cx, T.dest[1]-T.thrower.cy) < 1.6 || T.t>2.2)
      return judgeAtBase(T.target);
    return;
  }
  if(T.stage==='catch'){
    // 受け取ったボールは野手の手の中にある（宙に浮いたまま止まって見えないように）
    if(T.receiver){ ball.x=T.receiver.cx; ball.y=T.receiver.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0; }
    if(T.t>=T.catchDur){
      if(T.relayTo!=null){                 // 中継を受けた野手が本来の塁へ投げ直す
        const nx=T.relayTo; T.relayTo=null; T.thrower=T.receiver||T.thrower;
        setThrowTarget(T,nx,'relay-release'); T.stage='transfer'; T.t=0;
        setTransferContext(T,T.thrower,'relay-receive',0.04);
        return;
      }
      /* 受け手がまだ塁に着いていなければ、着くまでアウトにしない。
         送球が塁の上空を通っただけでアウトになるのを防ぐ。
         待つ間、受け手は塁へ踏みに行く。これが無いと、送球を迎えに出て捕った受け手が
         捕った場所に立ち尽くしたまま保留が時間切れ(3.6秒)になり、
         間に合っていた封殺が全て内野安打になっていた（ゴロ安打率69%の主因）。 */
      if(T.target!=='P' && T.receiver && T.dest && T.t<3.6 &&
         Math.hypot(T.dest[0]-T.receiver.cx, T.dest[1]-T.receiver.cy) > 1.8){
        setTarget(T.receiver, T.dest[0], T.dest[1]);
        return;
      }
      return judgeAtBase(T.target);
    }
    return;
  }
  if(T.stage==='rundown') return updateRundown(dt);
}
/* ===== 挟殺プレー（ランダウン） =====
   走者が塁間で捕まったら、即アウトにせず追い込む。
   ボールを持った野手が走者に詰め、走者が逃げ切りそうになったら反対の塁へ送球して切り返す。
   タッチが届けばアウト、走者が塁に戻れればセーフ。送球を弾けば走者が助かる。 */
/* 挟殺で使うカバー。打った瞬間の割り当てではなく「今その塁に一番近い野手」を選ぶ。
   挟殺は野手が入れ替わりながら追い込むプレーで、最初の担当がボールを持って
   反対側にいることが普通にある。割り当て固定だと誰もいない塁へ投げてしまう。 */
function rundownCover(base, exclude, exclude2){
  const best=findCoverCandidate(base,[exclude,exclude2]);
  if(!best) return null;
  if(best.coverBase!==base) assignCoverRole(best,base,'rundown-cover');
  else{ const p=throwPoint(base); setTarget(best,p[0],p[1]); }
  return best;
}
function coverOf(base, exclude){
  /* その塁のカバーに入っている野手が受け手。打った瞬間に割り当ててある。
     「今その塁に一番近い人」で選ぶと、たまたま近くにいただけの投手が受け手になり、
     実際には50ft離れているのに塁上でアウトが宣告される。 */
  const assigned=fielders.find(f=>f!==exclude && f.coverBase===base);
  if(assigned) return assigned;
  const created=rundownCover(base,exclude);
  if(created) return created;
  return fielders.find(f=>f!==exclude&&!f.primary)||fielders[0];
}
function beginRundown(r, hi){
  const T=throwPlay;
  const lo=Math.max(1,hi-1);
  T.stage='rundown';
  // loLim/hiLim = 走者が使える範囲。切り返しのたびに両側の野手が詰めてきて狭くなる
  // 保持者は実際に送球を受けた野手。塁に近いだけの別人にするとボールが瞬間移動する
  T.rd={ r, hi, lo, loLim:lo, hiLim:hi, holder:(T.receiver||T.thrower), sub:'chase', t:0, ex:0 };
  // 挟殺が始まったら、両側の塁にそれぞれ別の野手が入る（遊撃手・三塁手も加わる）
  const hiCover = rundownCover(hi, T.rd.holder);
  rundownCover(lo, T.rd.holder, hiCover);      // 反対側には別の野手を入れる
  r.extra=0; setAutoGoal(r, lo);            // まず戻ろうとする
  setMsg('挟まれた！','', '#ffc23d');
}
/* 挟殺の保持/追走/送球も距離トリガーで即決せず、短時間の代替行動を比較する。 */
function rundownOtherAdvanceRisk(mainRunner,windowSec){
  let risk=0;
  runners.forEach(r=>{
    if(r===mainRunner || r.out || runnerObservedDir(r)<=0 || r.p>=4-1e-9) return;
    const base=Math.min(4,Math.floor(r.p+1e-9)+1), eta=runnerETA(r,base);
    if(eta<windowSec+0.30) risk+=base===4?1.15:(base===3?0.45:0.25);
  });
  return risk;
}
function planRundownAction(R,recv,chasing){
  const r=R.r, holder=R.holder, dir=runnerObservedDir(r), basePoint=throwPoint(chasing);
  const runnerT=dir<0?runnerBackETA({...r,goal:chasing}):runnerETA(r,chasing);
  const throwDist=Math.hypot(basePoint[0]-holder.cx,basePoint[1]-holder.cy);
  const throwT=throwFlightTime(throwDist,armEff(holder))+0.12;
  const ahead={...r,p:clamp(r.p+(dir>=0?0.09:-0.09),0,4)}, ap=runnerPos(ahead);
  const tagT=reachTimeToPoint(holder,ap.x,ap.z,{useCurrent:true,reach:3,reaction:false,turn:true});
  const throwMargin=runnerT-throwT, tagMargin=runnerT-tagT;
  const recvGap=recv?Math.hypot(basePoint[0]-recv.cx,basePoint[1]-recv.cy):99;
  const risk=rundownOtherAdvanceRisk(r,throwT);
  const earlyPenalty=Math.max(0,throwMargin-0.55)*1.8;  // 早着しすぎる球は反転時間を与える
  const actions=[
    {kind:'chase',utility:1.15+clamp(tagMargin,-1,1)*0.7+(tagMargin>0.12?1.0:0),
      priority:tagMargin>0.12?3:1,reason:tagMargin>0.12?'tag-window':'compress-lane',
      margin:tagMargin,risk:0,feasible:true},
    {kind:'throw',utility:1.35+clamp(throwMargin,0,0.9)*0.8-earlyPenalty-risk,
      priority:2,reason:risk>0.4?'throw-despite-advance-risk':'throw-window',
      margin:throwMargin,risk,feasible:!!recv&&recvGap<=12&&throwMargin>0.08}
  ];
  return selectDefenseAction(actions);
}
function updateRundown(dt){
  /* 走者と野手の移動は呼び出し元(updateThrowPhase)が既に1回行っている。
     ここで再度呼ぶと1フレームに2回動いてしまう（速度が2倍になる）ので呼ばない。 */
  const T=throwPlay, R=T.rd, r=R.r;
  R.t+=dt;
  const rp=runnerPos(r);

  if(R.sub==='chase'){
    ball.x=R.holder.cx; ball.y=R.holder.cy; ball.z=4.4;
    /* 走者の背中を追うだけでは同じ足の速さなら永久に追いつけない。
       実際の野手と同じく、走者の進路の少し先（8ft先）を目がけて塞ぎに行く。 */
    const ahead={...r, p: clamp(r.p + (r.goal>r.p?0.09:-0.09), 0, 4)};
    const ap=runnerPos(ahead);
    setTarget(R.holder, ap.x, ap.z);
    /* 塁に到達したかを先に見る。タッチ判定を先に行うと、同じフレームで塁に着いていても
       野手が近いというだけでアウトになってしまう（到達が先ならセーフが正しい）。 */
    if(R.t>0.25 && Math.abs(r.p-r.goal)<0.02 && Math.abs(r.goal-Math.round(r.goal))<0.01)
      return endRundown('セーフ！','#3fd66a');
    if(Math.hypot(R.holder.cx-rp.x, R.holder.cy-rp.z) < 3.0){
      markOut(r,'tag'); return endRundown('タッチアウト！','#95a3b4');
    }
    // 逃げ場が無くなったらタッチアウト
    /* 逃げ場が無くなっても、実際にタッチしていなければアウトにしない。
       抽象的な「逃げ幅」だけでアウトを宣告していた。 */
    if(R.hiLim-R.loLim < 0.13 && Math.hypot(R.holder.cx-rp.x, R.holder.cy-rp.z) < 6.0){
      markOut(r,'tag'); return endRundown('タッチアウト！','#95a3b4'); }
    /* 毎tick、保持して詰める・直接タッチへ追う・切り返し送球を比較する。
       「塁まで一定距離になったらランダムに投げる」旧R.trigは、まだ追えば刺せる場面でも
       球を手放し、反対方向や別走者に進塁時間を与えていた。 */
    const goingHi = runnerObservedDir(r)>=0;
    const chasing = goingHi ? R.hi : R.lo;
    const recv=rundownCover(chasing,R.holder);
    const p=throwPoint(chasing);
    const action=planRundownAction(R,recv,chasing);
    R.actionReason=action?action.reason:'no-action';
    R.actionMargin=action?action.margin:0;
    R.actionRisk=action?action.risk:0;
    if(!action || action.kind!=='throw'){
      if(!recv){
        const myGap=Math.hypot(p[0]-R.holder.cx,p[1]-R.holder.cy);
        if(myGap<30) setTarget(R.holder,p[0],p[1]);
      }
      if(R.t>9) return timeoutRundown();
      return;
    }
    R.ex++;
    // 実際に切り返した時だけ、両側の野手が詰めたぶん逃げ幅を狭める
    R.loLim=Math.min(R.loLim+0.10, R.hiLim-0.05);
    R.hiLim=Math.max(R.hiLim-0.10, R.loLim+0.05);
    const away = clamp(goingHi ? R.loLim : R.hiLim, R.loLim, R.hiLim);
    R.fumble = Math.random() < A.fumble(recv.cat)*2.2;
    let dest=p;
    if(R.fumble){
      const o=throwOffset(R.holder, Math.hypot(p[0]-R.holder.cx,p[1]-R.holder.cy));
      dest=[p[0]+o[0]*2.4, p[1]+o[1]*2.4];
    }
    launchThrow(R.holder.cx,R.holder.cy,dest[0],dest[1],armEff(R.holder));
    setTarget(recv,p[0],p[1]);
    R.sub='relay'; R.recv=recv; R.dest=dest; R.rt=0;
    r.extra=0;
    const gBefore=r.goal;
    setAutoGoal(r,away);
    if(r.goal!==gBefore) r.v=0;
    if(R.t>9) return timeoutRundown();
    return;
  }
  if(R.sub==='relay'){
    R.rt+=dt;
    /* 走者が塁に到達していれば、切り返しの送球が飛んでいる途中でもセーフ。
       セーフ判定がchase側にしか無かったため、送球中に本塁を踏んだ走者が
       3秒後に捕球した野手に塁上で「タッチアウト」にされていた（実測トレース）。 */
    if(Math.abs(r.p-r.goal)<0.02 && Math.abs(r.goal-Math.round(r.goal))<0.01)
      return endRundown('セーフ！','#3fd66a');
    if(R.t>9) return timeoutRundown();
    /* 切り返しが受け手を外れて抜けた＝挟殺は崩壊。走者は先の塁を取り、

       外野を転々とする間も挟殺の機械が回り続け、球を無視したまま時間切れの
       「戻ってセーフ」でプレーを打ち切っていた（録画211639）。 */
    {
      const dPast=Math.hypot(ball.x-R.dest[0], ball.y-R.dest[1]);
      if(dPast>10 && (ball.landed || R.rt>1.2)){
        if(!r.out){ r.extra=0; r.cmd=null; setAutoGoal(r, Math.min(4, R.hi), true); r.v=Math.max(r.v||0,(r.sp||23)*0.5); }
        T.rd=null; T.stage='fly'; T.t=0; T.chased=true;
        T.dest=[ball.x, ball.y];
        setMsg('送球が乱れた！','','#ffc23d');
        return;
      }
    }
    let acc=Math.min(0.30,(R.acc||0)+dt), g=0;
    while(acc>=PHYS_H && g++<900){ acc-=PHYS_H; stepBall(ball,PHYS_H); }
    R.acc=acc;

    const recvHere = !R.recv || Math.hypot(R.dest[0]-R.recv.cx, R.dest[1]-R.recv.cy) < 6;
    if((Math.hypot(ball.x-R.dest[0], ball.y-R.dest[1])<5 && recvHere) || R.rt>3.2){

      const q=runnerPos(r);

/* 挟殺が決着しないまま長引いた時の打ち切り。走者は「今いる塁間の手前の塁」へ戻して終える。

   挟まれたままセーフ＋1点になっていた（録画で確認）。追い込まれている走者に塁を与えない。 */
function timeoutRundown(){
  const r=throwPlay && throwPlay.rd ? throwPlay.rd.r : null;
  if(r && !r.out){
    const back=Math.max(r.origin, Math.floor(r.p+1e-9));
    setRunnerIntent(r,back,{source:'rundown-timeout',force:true,updateAuto:true,cmd:null});
  }

/* 挟殺中だけ使うloLim/hiLim（1.2,1.8等）は「逃げ幅」の仮目標であって塁ではない。
   挟殺が送球ミス等で終了する時、その仮goalを残して通常プレーへ戻すと、走者は塁間で
   p===goalのまま停止し、PlayLifecycleは正しく「未決着」と判定し続ける。
   終了時には、仮goalがどちら側の逃げ幅だったかから合法な塁(lo/hi)へ意図を清算する。 */
function settleRundownExitIntent(T){
  const R=T&&T.rd, r=R&&R.r;
  if(!R || !r || r.out) return null;
  if(Math.abs(r.goal-Math.round(r.goal))<0.01) return {runner:r,base:Math.round(r.goal),changed:false};
  const loGap=Math.abs(r.goal-R.loLim), hiGap=Math.abs(r.goal-R.hiLim);
  const base=clamp(loGap<=hiGap?R.lo:R.hi,0,4);
  setRunnerIntent(r,base,{source:'rundown-exit',force:true,updateAuto:true,cmd:null});
  r.extra=0;

}
function endRundown(text,color){
  const T=throwPlay;
  T.rdText=text; T.rdColor=color;
  const rundownExit=settleRundownExitIntent(T);
  /* 挟殺が決着しても、本塁へ向かっている別の走者がいる限りプレーは終わらない。
     ここで即確定していたため、三本間の走者が本塁の手前(p=3.5)にいるのに
     「1点」でプレーが打ち切られていた（録画で確認。タッチ経路には同じ対策済みだったが
     挟殺の決着経路に入れ忘れていた）。ボール保持者から本塁へ送って続行する。 */
  /* ★2026-08-05修理: 挟殺の決着で「プレー全体」を閉じない（Sol指摘P4）。
     従来は本塁へ向かう走者しか見ておらず、三塁へ向かう走者などが塁間にいても
     プレーが確定していた（録画20260805_125004 play4: けん制の挟殺が決着した瞬間、
     一塁走者が2.9＝三塁の0.1手前・Sキー押下中のまま打ち切られた）。
     塁間にいる／まだ次の塁へ向かっている走者がいる限り、保持者から勝負のある塁へ
     送って続行する。全体の時間切れ（+8秒延長つき）が最後の歯止めとして残る。 */
  const homing = runners.find(r=>!r.out && r.p<3.97 && r.p>2.0 && runnerObservedDir(r)>0);
  const unsettled = homing || runners.find(r=>!r.out && r.p<3.97 &&
    (Math.abs(r.p-Math.round(r.p))>=0.02 || runnerObservedDir(r)!==0));
  if(unsettled && baseOuts()+countOuts()<3){
    const dir=runnerObservedDir(unsettled);
    const tgtBase = homing ? 4
      : (rundownExit && rundownExit.runner===unsettled ? rundownExit.base
      : clamp(dir<0?Math.floor(unsettled.p):Math.ceil(unsettled.p),1,4));
    /* 挟殺の切り返し送球が空中にある最中は、保持者にボールは無い。
       ここでtransferへ入れると空中の球が保持者の手へ瞬間帰還する
       （録画211315: 捕手が二塁へ投げたのにまだ持っていて三塁へ投げた、の正体）。
       空中の球は受け手に捕らせてから転送する(relayTo)。 */
    if(T.rd && T.rd.sub==='relay'){
      T.receiver=T.rd.recv; T.dest=T.rd.dest; T.relayTo=tgtBase; setThrowTarget(T,tgtBase,'rundown-air-relay');
      T.stage='fly'; T.t=0; T.rd=null; T.relayed=true;
      return;
    }
    const holder = (T.rd && T.rd.holder) || T.receiver || T.thrower;
    T.rd=null; T.thrower=holder; T.receiver=null; T.relayed=true;
    T.stage='transfer'; T.t=0; T.stepChecked=false;
    setTransferContext(T,holder,'rundown-receive',0.04);
    setThrowTarget(T,tgtBase,'rundown-turn');
    return;

/* 投手への返球を受けた時の締め。本塁へ向かって走っている走者がいる限りプレーは終わっていない

  const homing = runners.find(r=>!r.out && r.p<3.97 && r.p>2.0 && runnerObservedDir(r)>0);
  const unsettled = homing || runners.find(r=>!r.out && r.p<3.97 &&
    (Math.abs(r.p-Math.round(r.p))>=0.02 || runnerObservedDir(r)!==0));

    const holder = T.receiver || T.thrower;
    const dir=runnerObservedDir(unsettled);
    const fallback=homing?4:clamp(dir<0?Math.floor(unsettled.p):Math.ceil(unsettled.p),1,4);
    const decision=decideThrowTarget(holder,{kind:'live',homeIfAdvancing:true,fallbackTarget:fallback});

      if(cand.p>b+0.12){ T.stealText='牽制で挟まれた！'; return beginRundown(cand, b+1); }
      markOut(cand,'tag'); T.stealText='牽制アウト！';

         走者が二塁を回って三塁へ向かっていると該当者なし＝盗塁成功として
         プレーを打ち切っており、走者は誰にも追われずに三塁へ進めていた（録画で確認）。 */

      if(goingOn){
        const holder = T.receiver || T.thrower;

        T.stage='transfer'; T.t=0; T.stepChecked=false;
        setTransferContext(T,holder,'throw-receive',0.04);
        const nx=decideThrowTarget(holder,{kind:'live',fallbackTarget:Math.min(4,b+1)});
        setThrowTarget(T,nx.nb,'steal-continue-'+nx.source);
        setMsg('走者が次の塁へ！','','#ffc23d');

    const back = runners.filter(r=>!r.out && r.mustReturn && r.origin===b && Math.abs(r.p-r.origin)>0.02)

  const cand = runners.filter(r=>!r.out && r.p<b && r.p>b-1.001 &&

  }
  /* セーフの判定が出ても、別の走者がまだ次の塁へ向かっているならプレーは終わらない。
     ここで即確定していたため、一塁セーフ（エラー）の瞬間に、二塁走者が三塁へ
     走っている途中で結果が固定されていた（録画で確認）。ボールを持っている野手が
     次の狙いへ投げ直して続行する。回数は S.throwCount の上限(6)が歯止め。 */
  const chase = runners.find(r=>!r.out && runnerObservedDir(r)>0 && r.p < 3.98 &&
    Math.abs(r.p-Math.round(r.p))>0.02);
  if(chase && baseOuts()+countOuts()<3 && (S.throwCount||0)<6){
    const holder = T.receiver || T.thrower;
    const nxt=decideThrowTarget(holder,{kind:'live'});
    if(nxt && nxt.nb!=='P'){
      T.thrower=holder; T.receiver=null; setThrowTarget(T,nxt.nb,'chase-'+nxt.source);
      T.stage='transfer'; T.t=0; T.stepChecked=false; T.relayed=true;
      setTransferContext(T,holder,'throw-receive',0.04);

     きわどくアウトになった時に1点が入っていた。 */

  S.outs++; S.preOuts=(S.preOuts||0)+1;

     二塁封殺のアウトが、続く一塁送球の決着まで表示されなかった。
     プレーが続けば表示は続報で上書きされる。フライ捕球は resolveCatch 側が出す。 */

     野球ではアウトより先に本塁に達していた走者だけが得点になる（タイムプレー）。
     行き先が本塁というだけで得点にしていたため、まだ三塁手前にいる走者まで得点していた。 */

}

   一度だけ分類し、第三アウト以外は未解決条件が1つでもあれば終了させない。 */
function playLifecycleState(){

  const ballSpeed=ball?Math.hypot(ball.vx||0,ball.vy||0,ball.vz||0):0;
  const liveBall=!!(stageLive && ball && (ball.z>0.8 || ballSpeed>3));
  const goHeld=isPlayerBatting() && (held['s']||held['z']) && runners.some(r=>!r.out&&r.p<3.98);
  const backHeld=isPlayerBatting() && held['x'] && runners.some(r=>!r.out &&
    ((r.origin===0&&r.p>1.02)||(r.origin>0&&r.p>r.origin+0.02)));

    (Math.abs(r.p-Math.round(r.p))>=0.02 || Math.abs(r.p-r.goal)>=0.02));
  const activeRundown=!!(T&&T.stage==='rundown'&&T.rd&&!T.rdText);
  const flyDecision=!!(T&&T.kind==='fly'&&T.t<1.5&&runners.some(r=>!r.out&&r.origin>0&&r.origin<4));

  const dests = (Array.isArray(res.throwTo)?res.throwTo:[res.throwTo]);
  let cur=[ball.primary.cx, ball.primary.cy];
  const segs=[];
  dests.forEach(dst=>{
    const b=throwPoint(dst), len=Math.hypot(b[0]-cur[0], b[1]-cur[1]);
    segs.push({a:cur, b, len, dur: Math.max(0.18, len/125) + 0.16});

  }

  ball.x=last.b[0]; ball.y=last.b[1]; ball.z=4.0;

  if(routineNow) actions.push({kind:'routine',mode:'routine',utility:4,priority:4,feasible:true});
  if(jumpNow) actions.push({kind:'jump',mode:'jump',utility:2.1-0.08*(b.z-STANDING_CATCH_Z),priority:2,feasible:true});
  if(dive>0.15) actions.push({kind:'dive',mode:'dive',dive,utility:1.45-0.35*dive,priority:1,feasible:true});
  if(!routineNow){
    const future=findRoutineCatchWindow(f,b,{ground});
    if(future) actions.push({kind:'wait-routine',mode:'wait',future,
      utility:3.35-0.55*future.t,priority:3,feasible:true});

    ? (ball.vx*(prePrim.cx-ball.x)+ball.vy*(prePrim.cy-ball.y)) : 0;

     数えられず、跳ね上がりを内野手が高さ8.4ftで「フライ捕球」していた（録画165844。

     頭の上に越されて後逸する。0.2秒ごとに取り直す（毎フレームだと重い）。 */

    if(Math.hypot(ball.x-prim.cx, ball.y-prim.cy) > CATCH_R + 3

           捕る寸前だったサードが急に三塁カバーへ走り出す（録画で確認）。 */
        if(freed!=null) rundownCover(freed, plan2.f, prim);
        /* ★外された旧担当を無役で放置しない。空いている最寄りの塁をカバーさせ、
           全塁埋まっているなら新担当の後方18ftでバックアップに入れる
           （録画110336で旧担当がタグ無しのまま棒立ち→逆走していた対策）。 */

          const open=[1,2,3,4].filter(b=>!fielders.some(x=>x.coverBase===b));

            open.forEach(b=>{ const p=throwPoint(b); const q=Math.hypot(p[0]-prim.cx,p[1]-prim.cy);

       押している走者も塁に戻し、捕球された瞬間に走り出す（tagUp）。
       押している間ずっと塁を離れる作りだったため、Sを押しっぱなしにすると
       離塁扱いになって戻され、タッチアップの成功率が0%になっていた。 */

       落ちる（またはスタンドへ入る）まで飛ばし続け、そこで確定させる。
       時間で切っていたため、途中で消えて行方が分からなかった。 */

  const d2=Math.hypot(ball.x-prim.cx, ball.y-prim.cy);

  if(!inAir){ ball.dPrev=undefined; ball.dMin=undefined; }

    ball.dMin = Math.min(ball.dMin===undefined ? 1e9 : ball.dMin, d2); }
