name: Baseball3D regression

"on":
  push:
    branches:
      - "agent/**"
    paths:
      - "baseball3d.html"
      - "_test_harness_20260804.js"
      - "_test_runner_intent_20260808.js"
      - "_test_fielding_assignment_20260808.js"
      - "_architecture_guard_20260808.js"
      - "ARCHITECTURE_REMEDIATION_20260808.md"
      - ".github/workflows/baseball3d-regression.yml"
  pull_request:
    paths:
      - "baseball3d.html"
      - "_test_harness_20260804.js"
      - "_test_runner_intent_20260808.js"
      - "_test_fielding_assignment_20260808.js"
      - "_architecture_guard_20260808.js"
      - "ARCHITECTURE_REMEDIATION_20260808.md"
      - ".github/workflows/baseball3d-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Static and architectural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('baseball3d.html').read_text(encoding='utf-8')
          start=src.index('<script>')+len('<script>')
          end=src.index('</script>',start)
          Path('/tmp/baseball3d-main.js').write_text(src[start:end],encoding='utf-8')
          PY
          node --check /tmp/baseball3d-main.js
          node --check _test_harness_20260804.js
          node --check _test_runner_intent_20260808.js
          node --check _test_fielding_assignment_20260808.js
          node --check _architecture_guard_20260808.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js
          node _test_fielding_assignment_20260808.js

      - name: Build full-harness baseline and mutations
        run: |
          python - <<'PY'
          from pathlib import Path

          harness=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker="  console.log(JSON.stringify(out,null,1));\n  return out;"
          exposed="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert harness.count(marker)==1
          harness=harness.replace(marker,exposed,1)
          base=Path('baseball3d.html').read_text(encoding='utf-8')

          def build(source,name):
              prelude=(
                  '<script>(()=>{let s=0x71D22228>>>0;Math.random=()=>{'
                  's^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};})();'
                  'window.requestAnimationFrame=()=>0;</script>\n<script>\n"use strict";'
              )
              source=source.replace('<script>\n"use strict";',prelude,1)
              source=source.replace('</body>',f'<script>\n{harness}\n</script>\n</body>',1)
              Path('/tmp/'+name+'.html').write_text(source,encoding='utf-8')

          build(base,'baseline')

          old="      if(r.origin>=4 || !selected(r)) return;\n"
          new="      if(r.origin>=4 || (r.origin!==0 && !selected(r))) return;\n"
          assert base.count(old)==1
          build(base.replace(old,new,1),'mut28')

          old2="function runnerObservedDir(r){\n  return r.obsDir===1 ? 1 : (r.obsDir===-1 ? -1 : 0);\n}\n"
          new2="function runnerObservedDir(r){\n  return r.p<r.goal-1e-6 ? 1 : (r.p>r.goal+1e-6 ? -1 : 0);\n}\n"
          assert base.count(old2)==1
          build(base.replace(old2,new2,1),'mut29')

          old3="  if(o.updateAuto!==false) r.autoGoal=goal;\n"
          new3="  r.autoGoal=goal;\n"
          assert base.count(old3)==1
          build(base.replace(old3,new3,1),'mut30')

          old4="    if(ex.has(f) || f.primary) return;\n    if(f.coverBase!=null && f.coverBase!==base) return;\n"
          new4="    if(ex.has(f)) return;\n"
          assert base.count(old4)==1
          build(base.replace(old4,new4,1),'mut31')

          old5="      if(handoff.changed) return false;\n"
          assert base.count(old5)==1
          build(base.replace(old5,'',1),'mut32')

          # Structural mutation: reintroduce a second direct goal writer.
          guard_old="    setRunnerIntent(r,back,{source:'rundown-timeout',force:true,updateAuto:true,cmd:null});\n"
          guard_new="    r.goal=back; setRunnerIntent(r,back,{source:'rundown-timeout',force:true,updateAuto:true,cmd:null});\n"
          assert base.count(guard_old)==1
          Path('/tmp/guard-mutated.html').write_text(base.replace(guard_old,guard_new,1),encoding='utf-8')

          # Structural mutation: bypass the cover assignment API.
          cover_anchor="          recv=cut; p=[cut.cx,cut.cy]; T.relayTo=T.target;\n"
          cover_direct="          cut.coverBase=null; recv=cut; p=[cut.cx,cut.cy]; T.relayTo=T.target;\n"
          assert base.count(cover_anchor)==1
          Path('/tmp/guard-cover-mutated.html').write_text(base.replace(cover_anchor,cover_direct,1),encoding='utf-8')
          PY

      - name: Assert architecture mutation is rejected
        run: |
          if node _architecture_guard_20260808.js /tmp/guard-mutated.html; then
            echo 'goal architecture mutation escaped'
            exit 1
          fi
          if node _architecture_guard_20260808.js /tmp/guard-cover-mutated.html; then
            echo 'cover architecture mutation escaped'
            exit 1
          fi

      - name: Run browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for name in baseline mut28 mut29 mut30 mut31 mut32; do
            timeout 240 "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-gl=swiftshader \
              --enable-unsafe-swiftshader \
              --allow-file-access-from-files \
              --dump-dom "file:///tmp/$name.html" \
              > "/tmp/$name.dom" 2> "/tmp/$name.err" || {
                cat "/tmp/$name.err"
                exit 1
              }
          done

      - name: Assert baseline and mutation detection
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,json,re,urllib.parse

          def load(name):
              dom=Path('/tmp/'+name+'.dom').read_text(encoding='utf-8',errors='replace')
              match=re.search(r'data-harness="([^"]+)"',dom)
              if not match:
                  raise SystemExit(name+': data-harness missing')
              return json.loads(urllib.parse.unquote(html.unescape(match.group(1))))

          baseline=load('baseline')
          bad={k:v for k,v in baseline.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'baseline_count':len(baseline),'baseline_failed':bad},ensure_ascii=False,indent=2))
          if len(baseline)!=34 or bad:
              raise SystemExit('baseline failed')

          m28=load('mut28')
          m29=load('mut29')
          m30=load('mut30')
          m31=load('mut31')
          m32=load('mut32')
          print('mut28',m28['test28_個別走者選択'])
          print('mut29',m29['test29_守備と走者意図の分離'])
          print('mut30',m30['test30_RunnerIntent契約'])
          print('mut31',m31['test31_FieldingAssignment契約'])
          print('mut32',m32['test32_壁反射担当交代'])
          if m28['test28_個別走者選択'].get('verdict')!='FAIL':
              raise SystemExit('selection-scope mutation escaped')
          if m29['test29_守備と走者意図の分離'].get('verdict')!='FAIL':
              raise SystemExit('intent-leak mutation escaped')
          if m30['test30_RunnerIntent契約'].get('verdict')!='FAIL':
              raise SystemExit('RunnerIntent API mutation escaped')
          if m31['test31_FieldingAssignment契約'].get('verdict')!='FAIL':
              raise SystemExit('role-stealing mutation escaped')
          if m32['test32_壁反射担当交代'].get('verdict')!='FAIL':
              raise SystemExit('wall-handoff mutation escaped')
          PY
