name: Baseball3D regression

"on":
  push:
    branches:
      - "agent/**"
    paths:
      - "baseball3d.html"
      - "_test_harness_20260804.js"
      - "_test_runner_intent_20260808.js"
      - "_test_fielding_assignment_20260808.js"
      - "_test_reach_model_20260808.js"
      - "_architecture_guard_20260808.js"
      - "ARCHITECTURE_REMEDIATION_20260808.md"
      - ".github/workflows/baseball3d-regression.yml"
  pull_request:
    paths:
      - "baseball3d.html"
      - "_test_harness_20260804.js"
      - "_test_runner_intent_20260808.js"
      - "_test_fielding_assignment_20260808.js"
      - "_test_reach_model_20260808.js"
      - "_architecture_guard_20260808.js"
      - "ARCHITECTURE_REMEDIATION_20260808.md"
      - ".github/workflows/baseball3d-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Static and architectural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('baseball3d.html').read_text(encoding='utf-8')
          start=src.index('<script>')+len('<script>')
          end=src.index('</script>',start)
          Path('/tmp/baseball3d-main.js').write_text(src[start:end],encoding='utf-8')
          PY
          node --check /tmp/baseball3d-main.js
          node --check _test_harness_20260804.js
          node --check _test_runner_intent_20260808.js
          node --check _test_fielding_assignment_20260808.js
          node --check _test_reach_model_20260808.js
          node --check _architecture_guard_20260808.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js
          node _test_fielding_assignment_20260808.js
          node _test_reach_model_20260808.js

      - name: Build full-harness baseline and mutations
        run: |
          python - <<'PY'
          from pathlib import Path

          harness=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker="  console.log(JSON.stringify(out,null,1));\n  return out;"
          exposed="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert harness.count(marker)==1
          harness=harness.replace(marker,exposed,1)
          base=Path('baseball3d.html').read_text(encoding='utf-8')

          def build(source,name):
              prelude=(
                  '<script>(()=>{let s=0x71D22228>>>0;Math.random=()=>{'
                  's^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};})();'
                  'window.requestAnimationFrame=()=>0;</script>\n<script>\n"use strict";'
              )
              source=source.replace('<script>\n"use strict";',prelude,1)
              source=source.replace('</body>',f'<script>\n{harness}\n</script>\n</body>',1)
              Path('/tmp/'+name+'.html').write_text(source,encoding='utf-8')

          build(base,'baseline')

          old="      if(r.origin>=4 || !selected(r)) return;\n"
          new="      if(r.origin>=4 || (r.origin!==0 && !selected(r))) return;\n"
          assert base.count(old)==1
          build(base.replace(old,new,1),'mut28')

          old2="function runnerObservedDir(r){\n  return r.obsDir===1 ? 1 : (r.obsDir===-1 ? -1 : 0);\n}\n"
          new2="function runnerObservedDir(r){\n  return r.p<r.goal-1e-6 ? 1 : (r.p>r.goal+1e-6 ? -1 : 0);\n}\n"
          assert base.count(old2)==1
          build(base.replace(old2,new2,1),'mut29')

          old3="  if(o.updateAuto!==false) r.autoGoal=goal;\n"
          new3="  r.autoGoal=goal;\n"
          assert base.count(old3)==1
          build(base.replace(old3,new3,1),'mut30')

          old4="    if(ex.has(f) || f.primary) return;\n    if(f.coverBase!=null && f.coverBase!==base) return;\n"
          new4="    if(ex.has(f)) return;\n"
          assert base.count(old4)==1
          build(base.replace(old4,new4,1),'mut31')

          old5="      if(handoff.changed) return false;\n"
          assert base.count(old5)==1
          build(base.replace(old5,'',1),'mut32')

          old6="const REACH_TURN_MAX=0.30;"
          assert base.count(old6)==1
          build(base.replace(old6,"const REACH_TURN_MAX=0;",1),'mut33')

          assert base.count('const RETARGET_GAIN=0.12;')==1
          build(base.replace('const RETARGET_GAIN=0.12;','const RETARGET_GAIN=0;',1),'mut35')

          old7="  if(targetPassedByBall(f.tx,f.ty)) return true;\n"
          assert base.count(old7)==1
          build(base.replace(old7,'',1),'mut36')

          old8="  if(o.manualTarget!=null) return {nb:o.manualTarget,source:'manual',locked:true};\n"
          assert base.count(old8)==1
          build(base.replace(old8,"  if(o.manualTarget!=null) return {nb:o.manualTarget==='P'?1:o.manualTarget,source:'manual',locked:true};\n",1),'mut37')

          old9="  if(o.relayed || o.kind==='steal' || o.kind==='pickoff' || o.lockCurrent){\n"
          assert base.count(old9)==1
          build(base.replace(old9,"  if(o.kind==='steal' || o.kind==='pickoff' || o.lockCurrent){\n",1),'mut38')

          old10="  if(throwPlay && throwPlay.stage==='transfer') setThrowTarget(throwPlay,t,'manual-live');\n"
          assert base.count(old10)==1
          build(base.replace(old10,"  if(throwPlay && throwPlay.stage==='transfer') throwPlay.target=(t==='P')?1:t;\n",1),'mut39')

          # Structural mutation: reintroduce a second direct goal writer.
          guard_old="    setRunnerIntent(r,back,{source:'rundown-timeout',force:true,updateAuto:true,cmd:null});\n"
          guard_new="    r.goal=back; setRunnerIntent(r,back,{source:'rundown-timeout',force:true,updateAuto:true,cmd:null});\n"
          assert base.count(guard_old)==1
          Path('/tmp/guard-mutated.html').write_text(base.replace(guard_old,guard_new,1),encoding='utf-8')

          # Structural mutation: bypass the cover assignment API.
          cover_anchor="          recv=cut; p=[cut.cx,cut.cy]; T.relayTo=T.target;\n"
          cover_direct="          cut.coverBase=null; recv=cut; p=[cut.cx,cut.cy]; T.relayTo=T.target;\n"
          assert base.count(cover_anchor)==1
          Path('/tmp/guard-cover-mutated.html').write_text(base.replace(cover_anchor,cover_direct,1),encoding='utf-8')

          # Structural mutation: bypass ReachModel inside coverArrival.
          reach_old="""    const t=reachTimeToPoint(f,p[0],p[1],{\n      useCurrent:true,reach:2,zeroWithinReach:true,speedScale:0.88,\n      reactionBase:F_REACT,reactScale:0.4,turn:true});\n"""
          reach_direct="    const t=runTime(f.sp*0.88,d);\n"
          assert base.count(reach_old)==1
          Path('/tmp/guard-reach-mutated.html').write_text(base.replace(reach_old,reach_direct,1),encoding='utf-8')

          # Structural mutation: bypass retarget adoption gate in dynamic re-aim.
          retarget_old="      retargetFielder(prim,b2.x,b2.y,'slow-roll-replan');\n"
          assert base.count(retarget_old)==1
          Path('/tmp/guard-retarget-mutated.html').write_text(base.replace(retarget_old,"      setTarget(prim,b2.x,b2.y);\n",1),encoding='utf-8')

          # Structural mutation: add a second post-construction throw-target writer.
          throw_anchor="      if(T.kind==='pickoff'){\n"
          assert base.count(throw_anchor)==1
          Path('/tmp/guard-throw-mutated.html').write_text(base.replace(throw_anchor,"      T.target='P';\n"+throw_anchor,1),encoding='utf-8')
          PY

      - name: Assert architecture mutation is rejected
        run: |
          if node _architecture_guard_20260808.js /tmp/guard-mutated.html; then
            echo 'goal architecture mutation escaped'; exit 1
          fi
          if node _architecture_guard_20260808.js /tmp/guard-cover-mutated.html; then
            echo 'cover architecture mutation escaped'; exit 1
          fi
          if node _architecture_guard_20260808.js /tmp/guard-reach-mutated.html; then
            echo 'ReachModel architecture mutation escaped'; exit 1
          fi
          if node _architecture_guard_20260808.js /tmp/guard-retarget-mutated.html; then
            echo 'retarget architecture mutation escaped'; exit 1
          fi
          if node _architecture_guard_20260808.js /tmp/guard-throw-mutated.html; then
            echo 'ThrowDecision architecture mutation escaped'; exit 1
          fi

      - name: Run browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for name in baseline mut28 mut29 mut30 mut31 mut32 mut33 mut35 mut36 mut37 mut38 mut39; do
            timeout 240 "$CHROME" \
              --headless=new --no-sandbox --disable-dev-shm-usage \
              --use-gl=swiftshader --enable-unsafe-swiftshader \
              --allow-file-access-from-files \
              --dump-dom "file:///tmp/$name.html" \
              > "/tmp/$name.dom" 2> "/tmp/$name.err" || {
                cat "/tmp/$name.err"; exit 1
              }
          done

      - name: Assert baseline and mutation detection
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,json,re,urllib.parse

          def load(name):
              dom=Path('/tmp/'+name+'.dom').read_text(encoding='utf-8',errors='replace')
              match=re.search(r'data-harness="([^"]+)"',dom)
              if not match: raise SystemExit(name+': data-harness missing')
              return json.loads(urllib.parse.unquote(html.unescape(match.group(1))))

          baseline=load('baseline')
          bad={k:v for k,v in baseline.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'baseline_count':len(baseline),'baseline_failed':bad},ensure_ascii=False,indent=2))
          if len(baseline)!=41 or bad: raise SystemExit('baseline failed')

          m28=load('mut28'); m29=load('mut29'); m30=load('mut30'); m31=load('mut31')
          m32=load('mut32'); m33=load('mut33'); m35=load('mut35'); m36=load('mut36')
          m37=load('mut37'); m38=load('mut38'); m39=load('mut39')
          if m28['test28_個別走者選択'].get('verdict')!='FAIL': raise SystemExit('selection-scope mutation escaped')
          if m29['test29_守備と走者意図の分離'].get('verdict')!='FAIL': raise SystemExit('intent-leak mutation escaped')
          if m30['test30_RunnerIntent契約'].get('verdict')!='FAIL': raise SystemExit('RunnerIntent mutation escaped')
          if m31['test31_FieldingAssignment契約'].get('verdict')!='FAIL': raise SystemExit('role mutation escaped')
          if m32['test32_壁反射担当交代'].get('verdict')!='FAIL': raise SystemExit('wall mutation escaped')
          if m33['test33_ReachModel契約'].get('verdict')!='FAIL' or m33['test34_動的到達方向'].get('verdict')!='FAIL': raise SystemExit('ReachModel mutation escaped')
          if m35['test35_再照準採用'].get('verdict')!='FAIL': raise SystemExit('retarget gain mutation escaped')
          if m36['test36_通過済み目標'].get('verdict')!='FAIL': raise SystemExit('passed-target mutation escaped')
          if m37['test37_ThrowDecision固定規則'].get('verdict')!='FAIL' and m37['test39_手動投手返球'].get('verdict')!='FAIL': raise SystemExit('manual priority mutation escaped')
          if m38['test37_ThrowDecision固定規則'].get('verdict')!='FAIL': raise SystemExit('relay lock mutation escaped')
          if m39['test39_手動投手返球'].get('verdict')!='FAIL': raise SystemExit('manual P mutation escaped')
          PY
