name: Apply b0805-18 retarget gate

"on":
  push:
    branches: ["agent/b0805-18-retarget-gate"]
    paths: [".github/workflows/cc_apply_b0805_18.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-18-retarget-gate
      - name: Apply patch
        run: |
          python .cc_patch_b0805_18.py
          git diff --check
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('baseball3d.html').read_text(encoding='utf-8'); a=s.index('<script>')+8; b=s.index('</script>',a)
          Path('/tmp/main.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/main.js
          node --check _test_harness_20260804.js
          node --check _architecture_guard_20260808.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js
          node _test_fielding_assignment_20260808.js
          node _test_reach_model_20260808.js
      - name: Build browser baseline and mutations
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker="  console.log(JSON.stringify(out,null,1));\n  return out;"
          exposed="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert h.count(marker)==1; h=h.replace(marker,exposed,1)
          base=Path('baseball3d.html').read_text(encoding='utf-8')
          def build(src,name):
              prelude=("<script>(()=>{let s=0x71D22228>>>0;Math.random=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};})();window.requestAnimationFrame=()=>0;</script>\n<script>\n\"use strict\";")
              src=src.replace('<script>\n"use strict";',prelude,1)
              src=src.replace('</body>',f'<script>\n{h}\n</script>\n</body>',1)
              Path('/tmp/'+name+'.html').write_text(src,encoding='utf-8')
          build(base,'baseline')
          assert base.count('const RETARGET_GAIN=0.12;')==1
          build(base.replace('const RETARGET_GAIN=0.12;','const RETARGET_GAIN=0;',1),'mut35')
          old="  if(targetPassedByBall(f.tx,f.ty)) return true;\n"
          assert base.count(old)==1
          build(base.replace(old,'',1),'mut36')
          old2="      retargetFielder(prim,b2.x,b2.y,'slow-roll-replan');\n"
          assert base.count(old2)==1
          Path('/tmp/guard-retarget.html').write_text(base.replace(old2,"      setTarget(prim,b2.x,b2.y);\n",1),encoding='utf-8')
          PY
      - name: Assert architecture mutation rejected
        run: |
          if node _architecture_guard_20260808.js /tmp/guard-retarget.html; then
            echo 'retarget architecture mutation escaped'; exit 1
          fi
      - name: Run browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for name in baseline mut35 mut36; do
            timeout 240 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --dump-dom "file:///tmp/$name.html" > "/tmp/$name.dom" 2> "/tmp/$name.err" || { cat "/tmp/$name.err"; exit 1; }
          done
      - name: Assert browser results
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,json,re,urllib.parse
          def load(n):
              s=Path('/tmp/'+n+'.dom').read_text(encoding='utf-8',errors='replace'); m=re.search(r'data-harness="([^"]+)"',s)
              if not m: raise SystemExit(n+': harness missing')
              return json.loads(urllib.parse.unquote(html.unescape(m.group(1))))
          b=load('baseline'); bad={k:v for k,v in b.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'count':len(b),'failed':bad},ensure_ascii=False,indent=2))
          if len(b)!=38 or bad: raise SystemExit('baseline failed')
          m35=load('mut35'); m36=load('mut36')
          print('mut35',m35['test35_再照準採用']); print('mut36',m36['test36_通過済み目標'])
          if m35['test35_再照準採用'].get('verdict')!='FAIL': raise SystemExit('gain mutation escaped')
          if m36['test36_通過済み目標'].get('verdict')!='FAIL': raise SystemExit('passed-target mutation escaped')
          PY
      - name: Commit implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js _architecture_guard_20260808.js ARCHITECTURE_REMEDIATION_20260808.md
          git diff --cached --check
          git commit -m "refactor: gate dynamic fielding retargets"
          git push origin HEAD:agent/b0805-18-retarget-gate
