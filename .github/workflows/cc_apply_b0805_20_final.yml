name: Verify final b0805-20 PlayLifecycle

"on":
  push:
    branches: ["agent/b0805-20-play-lifecycle"]
    paths: [".github/workflows/cc_apply_b0805_20_final.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-20-play-lifecycle
      - name: Apply final patch
        run: |
          python .cc_patch_b0805_20_final.py
          git diff --check
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('baseball3d.html').read_text(encoding='utf-8'); a=s.index('<script>')+8; b=s.index('</script>',a)
          Path('/tmp/main.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/main.js
          node --check _test_harness_20260804.js
          node --check _architecture_guard_20260808.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js
          node _test_fielding_assignment_20260808.js
          node _test_reach_model_20260808.js
      - name: Build browser baseline and mutations
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker="  console.log(JSON.stringify(out,null,1));\n  return out;"
          exposed="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert h.count(marker)==1; h=h.replace(marker,exposed,1)
          base=Path('baseball3d.html').read_text(encoding='utf-8')
          def build(src,name):
              prelude=("<script>(()=>{let s=0x71D22228>>>0;Math.random=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};})();window.requestAnimationFrame=()=>0;</script>\n<script>\n\"use strict\";")
              src=src.replace('<script>\n"use strict";',prelude,1)
              src=src.replace('</body>',f'<script>\n{h}\n</script>\n</body>',1)
              Path('/tmp/'+name+'.html').write_text(src,encoding='utf-8')
          build(base,'baseline')
          live="  const liveBall=!!(stageLive && ball && (ball.z>0.8 || ballSpeed>3));\n"
          assert base.count(live)==1
          build(base.replace(live,"  const liveBall=false;\n",1),'mut40')
          third="  const canClose=thirdOut || !(liveBall||keyHeld||unsettled||activeRundown||flyDecision);\n"
          assert base.count(third)==1
          build(base.replace(third,"  const canClose=!(liveBall||keyHeld||unsettled||activeRundown||flyDecision);\n",1),'mut41')
          safe="  if(T.target==='P' && T.stage!=='rundown' && !flyWait && !keyHeld && allSettled){\n    /* 終了要求がlive-ball等で拒否された時はreturnしない。ここは物理更新より前なので、\n       returnすると同じ球位置・速度のまま毎フレーム再び拒否され、送球が永久に凍結する。 */\n    if(requestPlayConclusion('settled-return')) return;\n  }\n"
          assert base.count(safe)==1
          frozen="  if(T.target==='P' && T.stage!=='rundown' && !flyWait && !keyHeld && allSettled) return requestPlayConclusion('request');\n"
          build(base.replace(safe,frozen,1),'mut42')
          anchor="      if(T.kind==='pickoff'){\n"
          assert base.count(anchor)==1
          Path('/tmp/guard-lifecycle.html').write_text(base.replace(anchor,"      concludePlay(false);\n"+anchor,1),encoding='utf-8')
          PY
      - name: Assert architecture mutation rejected
        run: |
          if node _architecture_guard_20260808.js /tmp/guard-lifecycle.html; then
            echo 'PlayLifecycle direct conclusion mutation escaped'; exit 1
          fi
      - name: Run browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for name in baseline mut40 mut41 mut42; do
            timeout 240 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --dump-dom "file:///tmp/$name.html" > "/tmp/$name.dom" 2> "/tmp/$name.err" || { cat "/tmp/$name.err"; exit 1; }
          done
      - name: Assert browser results
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,json,re,urllib.parse
          def load(n):
              s=Path('/tmp/'+n+'.dom').read_text(encoding='utf-8',errors='replace'); m=re.search(r'data-harness="([^"]+)"',s)
              if not m: raise SystemExit(n+': harness missing')
              return json.loads(urllib.parse.unquote(html.unescape(m.group(1))))
          b=load('baseline'); bad={k:v for k,v in b.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'count':len(b),'failed':bad},ensure_ascii=False,indent=2))
          if len(b)!=44 or bad: raise SystemExit('baseline failed')
          m40=load('mut40'); m41=load('mut41'); m42=load('mut42')
          print('mut40',m40['test40_ライブ送球終了禁止'])
          print('mut41',m41['test41_PlayLifecycle門番'])
          print('mut42',m42['test42_Lifecycle拒否後物理継続'],m42['sweep128'])
          if m40['test40_ライブ送球終了禁止'].get('verdict')!='FAIL': raise SystemExit('live-ball mutation escaped')
          if m41['test41_PlayLifecycle門番'].get('verdict')!='FAIL': raise SystemExit('third-out mutation escaped')
          if m42['test42_Lifecycle拒否後物理継続'].get('verdict')!='FAIL' and m42['sweep128'].get('verdict')!='FAIL': raise SystemExit('freeze mutation escaped')
          PY
      - name: Commit implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js _architecture_guard_20260808.js ARCHITECTURE_REMEDIATION_20260808.md
          git diff --cached --check
          git commit -m "refactor: centralize play lifecycle closure"
          git push origin HEAD:agent/b0805-20-play-lifecycle
