name: Apply b0805-19 ThrowDecision

"on":
  push:
    branches: ["agent/b0805-19-throw-decision"]
    paths: [".github/workflows/cc_apply_b0805_19.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-19-throw-decision
      - name: Apply patch
        run: |
          python .cc_patch_b0805_19.py
          git diff --check
      - name: Static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('baseball3d.html').read_text(encoding='utf-8'); a=s.index('<script>')+8; b=s.index('</script>',a)
          Path('/tmp/main.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/main.js
          node --check _test_harness_20260804.js
          node --check _architecture_guard_20260808.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js
          node _test_fielding_assignment_20260808.js
          node _test_reach_model_20260808.js
      - name: Build browser baseline and mutations
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker="  console.log(JSON.stringify(out,null,1));\n  return out;"
          exposed="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert h.count(marker)==1; h=h.replace(marker,exposed,1)
          base=Path('baseball3d.html').read_text(encoding='utf-8')
          def build(src,name):
              prelude=("<script>(()=>{let s=0x71D22228>>>0;Math.random=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};})();window.requestAnimationFrame=()=>0;</script>\n<script>\n\"use strict\";")
              src=src.replace('<script>\n"use strict";',prelude,1)
              src=src.replace('</body>',f'<script>\n{h}\n</script>\n</body>',1)
              Path('/tmp/'+name+'.html').write_text(src,encoding='utf-8')
          build(base,'baseline')
          old="  if(o.manualTarget!=null) return {nb:o.manualTarget,source:'manual',locked:true};\n"
          assert base.count(old)==1
          build(base.replace(old,"  if(o.manualTarget!=null) return {nb:o.manualTarget==='P'?1:o.manualTarget,source:'manual',locked:true};\n",1),'mut37')
          old2="  if(o.relayed || o.kind==='steal' || o.kind==='pickoff' || o.lockCurrent){\n"
          assert base.count(old2)==1
          build(base.replace(old2,"  if(o.kind==='steal' || o.kind==='pickoff' || o.lockCurrent){\n",1),'mut38')
          old3="  if(throwPlay && throwPlay.stage==='transfer') setThrowTarget(throwPlay,t,'manual-live');\n"
          assert base.count(old3)==1
          build(base.replace(old3,"  if(throwPlay && throwPlay.stage==='transfer') throwPlay.target=(t==='P')?1:t;\n",1),'mut39')
          anchor="      if(T.kind==='pickoff'){\n"
          assert base.count(anchor)==1
          Path('/tmp/guard-throw.html').write_text(base.replace(anchor,"      T.target='P';\n"+anchor,1),encoding='utf-8')
          PY
      - name: Assert architecture mutation rejected
        run: |
          if node _architecture_guard_20260808.js /tmp/guard-throw.html; then
            echo 'throw target writer mutation escaped'; exit 1
          fi
      - name: Run browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for name in baseline mut37 mut38 mut39; do
            timeout 240 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --dump-dom "file:///tmp/$name.html" > "/tmp/$name.dom" 2> "/tmp/$name.err" || { cat "/tmp/$name.err"; exit 1; }
          done
      - name: Assert browser results
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,json,re,urllib.parse
          def load(n):
              s=Path('/tmp/'+n+'.dom').read_text(encoding='utf-8',errors='replace'); m=re.search(r'data-harness="([^"]+)"',s)
              if not m: raise SystemExit(n+': harness missing')
              return json.loads(urllib.parse.unquote(html.unescape(m.group(1))))
          b=load('baseline'); bad={k:v for k,v in b.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'count':len(b),'failed':bad},ensure_ascii=False,indent=2))
          if len(b)!=41 or bad: raise SystemExit('baseline failed')
          m37=load('mut37'); m38=load('mut38'); m39=load('mut39')
          print('mut37',m37['test37_ThrowDecision固定規則'],m37['test39_手動投手返球'])
          print('mut38',m38['test37_ThrowDecision固定規則'])
          print('mut39',m39['test39_手動投手返球'])
          if m37['test37_ThrowDecision固定規則'].get('verdict')!='FAIL' and m37['test39_手動投手返球'].get('verdict')!='FAIL': raise SystemExit('manual priority mutation escaped')
          if m38['test37_ThrowDecision固定規則'].get('verdict')!='FAIL': raise SystemExit('relay lock mutation escaped')
          if m39['test39_手動投手返球'].get('verdict')!='FAIL': raise SystemExit('manual P mutation escaped')
          PY
      - name: Commit implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js _architecture_guard_20260808.js ARCHITECTURE_REMEDIATION_20260808.md
          git diff --cached --check
          git commit -m "refactor: centralize throw target decisions"
          git push origin HEAD:agent/b0805-19-throw-decision
