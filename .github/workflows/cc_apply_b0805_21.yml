name: Apply b0805-21 rundown exit intent

"on":
  push:
    branches: ["agent/b0805-21-rundown-exit-intent"]
    paths: [".github/workflows/cc_apply_b0805_21.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-21-rundown-exit-intent
      - name: Apply patch
        run: |
          python .cc_patch_b0805_21.py
          git diff --check
      - name: Static and architecture checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('baseball3d.html').read_text(encoding='utf-8'); a=s.index('<script>')+8; b=s.index('</script>',a)
          Path('/tmp/main.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/main.js
          node --check _test_harness_20260804.js
          node --check _architecture_guard_20260808.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js
          node _test_fielding_assignment_20260808.js
          node _test_reach_model_20260808.js
      - name: Build canonical harness, mutation, and deterministic g2
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker="  console.log(JSON.stringify(out,null,1));\n  return out;"
          exposed="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert h.count(marker)==1; h=h.replace(marker,exposed,1)
          base=Path('baseball3d.html').read_text(encoding='utf-8')
          prelude=("<script>(()=>{let s=0x71D22228>>>0;Math.random=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};})();window.requestAnimationFrame=()=>0;</script>\n<script>\n\"use strict\";")
          def harness_html(src,name):
              src=src.replace('<script>\n"use strict";',prelude,1)
              src=src.replace('</body>',f'<script>\n{h}\n</script>\n</body>',1)
              Path('/tmp/'+name+'.html').write_text(src,encoding='utf-8')
          harness_html(base,'baseline')
          call="  const rundownExit=settleRundownExitIntent(T);\n"
          assert base.count(call)==1
          mutated=base.replace(call,"  const rundownExit=null;\n",1)
          harness_html(mutated,'mut43')
          Path('/tmp/guard-rundown.html').write_text(mutated,encoding='utf-8')

          g2=r'''<script>
          (function(){
            function rng(seed){let s=seed>>>0;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};}
            function mirror(){if(S.phase!=='pitch'||!isPlayerBatting()||!pitch||pitch.swung||pitch._m)return;pitch._m=1;
              const strike=inZone(pitch.tx,pitch.ty),two=S.strikes>=2,prob=strike?(two?0.94:0.70):(two?0.42:0.24),sk=DIFF[DIFF_I].cpu;
              if(Math.random()<prob){const e=gauss(52/sk)+(pitch.P.dur<0.55?0:gauss(22/sk));pitch.cpuSwingT=1+e/(pitch.dur*1000);pitch.cpuOff={dx:gauss(30/sk),dy:gauss(30/sk)};}}
            const old=Math.random;Math.random=rng(0xdfb07ee1);newGame();let steps=0;
            while(!S.over&&steps++<220000){if(S.phase==='msg')S.timer=0;if(S.phase==='aimPitch'){const c=cpuChoosePitch();launchPitch(c.type,c.nx,c.ny);}if(S.phase==='windup')S.timer=0;mirror();if(S.phase==='play')S.timer=0;update(1/60);}
            Math.random=old;const fractional=runners.some(r=>!r.out&&Math.abs(r.p-r.goal)<0.001&&Math.abs(r.p-Math.round(r.p))>0.02);
            const out={completed:!!S.over,steps,inning:S.inning,phase:S.phase,fractional};document.body.setAttribute('data-g2',encodeURIComponent(JSON.stringify(out)));
          })();
          </script>'''
          frozen=base.replace('<script>\n"use strict";','<script>window.requestAnimationFrame=()=>0;</script>\n<script>\n"use strict";',1)
          Path('/tmp/g2.html').write_text(frozen.replace('</body>',g2+'</body>',1),encoding='utf-8')
          PY
      - name: Assert structural mutation rejected
        run: |
          if node _architecture_guard_20260808.js /tmp/guard-rundown.html; then
            echo 'rundown exit architecture mutation escaped'; exit 1
          fi
      - name: Run browser checks
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for n in baseline mut43 g2; do
            timeout 300 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --dump-dom "file:///tmp/$n.html" > "/tmp/$n.dom" 2> "/tmp/$n.err" || { cat "/tmp/$n.err"; exit 1; }
          done
      - name: Assert browser results
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,json,re,urllib.parse
          def attr(n,a):
              s=Path('/tmp/'+n+'.dom').read_text(encoding='utf-8',errors='replace');m=re.search(a+r'="([^"]+)"',s)
              if not m: raise SystemExit(n+': '+a+' missing')
              return json.loads(urllib.parse.unquote(html.unescape(m.group(1))))
          b=attr('baseline','data-harness'); bad={k:v for k,v in b.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'baseline_count':len(b),'failed':bad},ensure_ascii=False,indent=2))
          if len(b)!=45 or bad: raise SystemExit('baseline failed')
          m=attr('mut43','data-harness'); print('mut43',m['test43_挟殺終了goal清算'])
          if m['test43_挟殺終了goal清算'].get('verdict')!='FAIL': raise SystemExit('rundown-exit mutation escaped')
          g=attr('g2','data-g2'); print('g2',g)
          if not g.get('completed') or g.get('fractional'): raise SystemExit('deterministic g2 still stalls')
          PY
      - name: Commit implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js _architecture_guard_20260808.js ARCHITECTURE_REMEDIATION_20260808.md
          git diff --cached --check
          git commit -m "fix: settle rundown exit intent on a legal base"
          git push origin HEAD:agent/b0805-21-rundown-exit-intent
