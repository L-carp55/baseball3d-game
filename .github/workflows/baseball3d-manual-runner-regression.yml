name: Baseball3D manual runner regression

"on":
  push:
    branches:
      - "agent/**"
    paths:
      - "baseball3d.html"
      - "_test_harness_20260804.js"
      - "_test_runner_intent_20260808.js"
      - "_architecture_guard_20260808.js"
      - "_ci_browser_regression_20260809.py"
      - ".github/workflows/baseball3d-manual-runner-regression.yml"
  pull_request:
    paths:
      - "baseball3d.html"
      - "_test_harness_20260804.js"
      - "_test_runner_intent_20260808.js"
      - "_architecture_guard_20260808.js"
      - "_ci_browser_regression_20260809.py"
      - ".github/workflows/baseball3d-manual-runner-regression.yml"

permissions:
  contents: read

jobs:
  manual-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static and focused contract
        run: |
          python -m py_compile _ci_browser_regression_20260809.py
          node --check _test_harness_20260804.js
          node --check _test_runner_intent_20260808.js
          node --check _architecture_guard_20260808.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js
      - name: Browser baseline and S/X contract
        run: python _ci_browser_regression_20260809.py --manual
