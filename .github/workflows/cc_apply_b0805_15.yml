name: Apply b0805-15 RunnerIntent migration

"on":
  push:
    branches: ["agent/b0805-15-runner-intent-migration"]
    paths: [".github/workflows/cc_apply_b0805_15.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-15-runner-intent-migration

      - name: Apply patch
        run: |
          python .cc_patch_b0805_15.py
          git diff --check

      - name: Validate implementation and CI definition
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          src=Path('baseball3d.html').read_text(encoding='utf-8')
          start=src.index('<script>')+len('<script>')
          end=src.index('</script>',start)
          Path('/tmp/baseball3d-main.js').write_text(src[start:end],encoding='utf-8')
          yaml.safe_load(Path('.github/workflows/baseball3d-regression.yml').read_text(encoding='utf-8'))
          PY
          node --check /tmp/baseball3d-main.js
          node --check _test_harness_20260804.js
          node --check _test_runner_intent_20260808.js
          node --check _architecture_guard_20260808.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js

      - name: Commit implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js _test_runner_intent_20260808.js _architecture_guard_20260808.js ARCHITECTURE_REMEDIATION_20260808.md .github/workflows/baseball3d-regression.yml
          git diff --cached --check
          git commit -m "refactor: make RunnerIntent the sole goal writer"
          git push origin HEAD:agent/b0805-15-runner-intent-migration
