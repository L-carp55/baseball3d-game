name: Inspect b0805-20 conclusion call contexts
"on":
  push:
    branches: ["agent/b0805-20-play-lifecycle"]
    paths: [".github/workflows/cc_diag_b0805_20_calls.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-20-play-lifecycle
      - run: python .cc_patch_b0805_20_retry.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('baseball3d.html').read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(s):
              if "requestPlayConclusion('request')" in line:
                  print('\n=== line',i+1,'===')
                  for j in range(max(0,i-5),min(len(s),i+7)):
                      print(f'{j+1:5}: {s[j]}')
          PY
