name: Apply b0805-22 legacy CI compatibility

"on":
  push:
    branches: ["agent/b0805-22-manual-runner-priority"]
    paths: [".github/workflows/cc_apply_legacy_ci_compat_b0805_22.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-22-manual-runner-priority
      - name: Fold S/X contract into existing test28
        run: |
          python .cc_patch_legacy_ci_compat_b0805_22.py
          git diff --check
          node --check _test_harness_20260804.js
          node _architecture_guard_20260808.js
          node _test_runner_intent_20260808.js
      - name: Commit compatibility
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js
          git diff --cached --check
          git commit -m "test: fold manual S/X regression into selected-runner contract"
          git push origin HEAD:agent/b0805-22-manual-runner-priority