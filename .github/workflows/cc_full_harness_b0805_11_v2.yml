name: b0805-11 full browser harness v2
on:
  push:
    branches: ["agent/b0805-11-display-motion"]
    paths: [".github/workflows/cc_full_harness_b0805_11_v2.yml"]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-11-display-motion
      - name: Build self-testing HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('baseball3d.html').read_text(encoding='utf-8')
          h=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker='  console.log(JSON.stringify(out,null,1));\n  return out;'
          repl="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert h.count(marker)==1
          h=h.replace(marker,repl,1)
          html=html.replace('<script>\n"use strict";','<script>window.requestAnimationFrame=()=>0;</script>\n<script>\n"use strict";',1)
          html=html.replace('</body>',f'<script>\n{h}\n</script>\n</body>',1)
          Path('/tmp/h.html').write_text(html,encoding='utf-8')
          PY
      - name: Run browser harness
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          timeout 240 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --dump-dom file:///tmp/h.html > /tmp/dom.txt 2>/tmp/chrome.err || { cat /tmp/chrome.err; exit 1; }
      - name: Assert 22 PASS
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,json,urllib.parse
          s=Path('/tmp/dom.txt').read_text(encoding='utf-8',errors='replace')
          m=re.search(r'data-harness="([^"]+)"',s)
          if not m:
              print(Path('/tmp/chrome.err').read_text(errors='replace'))
              raise SystemExit('data-harness not found')
          out=json.loads(urllib.parse.unquote(html.unescape(m.group(1))))
          bad={k:v for k,v in out.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'count':len(out),'failed':bad},ensure_ascii=False,indent=2))
          if len(out)!=22 or bad: raise SystemExit(1)
          PY
