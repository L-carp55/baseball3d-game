name: b0805-11 patch
on:
  push:
    branches: ["agent/b0805-11-display-motion"]
    paths: [".github/workflows/cc_patch_b0805_11_v2.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-11-display-motion
      - run: python .cc_patch_b0805_11.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js
          git diff --cached --check
          git commit -m "fix: correct fly classification and catch presentation"
          git push origin HEAD:agent/b0805-11-display-motion
