name: Verify b0805-13 fielding motion fixes
on:
  push:
    branches: ["agent/b0805-13-fielding-motion"]
    paths: [".github/workflows/cc_patch_b0805_13.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-13-fielding-motion
      - name: Apply patch and syntax-check
        run: |
          python .cc_patch_b0805_13.py
          git diff --check
      - name: Build baseline and mutation HTMLs
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker='  console.log(JSON.stringify(out,null,1));\n  return out;'
          repl="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert h.count(marker)==1
          h=h.replace(marker,repl,1)
          base=Path('baseball3d.html').read_text(encoding='utf-8')
          def build(src,path):
              src=src.replace('<script>\n"use strict";','<script>window.requestAnimationFrame=()=>0;</script>\n<script>\n"use strict";',1)
              src=src.replace('</body>',f'<script>\n{h}\n</script>\n</body>',1)
              Path(path).write_text(src,encoding='utf-8')
          build(base,'/tmp/base.html')
          # OI-248 mutation: remove second-base cover assignment.
          old="  put(2, (c.spray>5 ? ['遊','二','投','一'] : ['二','遊','投','一']));\n"
          assert base.count(old)==1
          build(base.replace(old,'',1),'/tmp/mut25.html')
          # OI-243 mutation: restore 3D-distance-based dive activation.
          old2="""function groundDiveAmount(d2, gz, grabR){
            if(d2<=CATCH_R) return 0;                  // 普通にグラブが届く横距離なら倒れ込まない
            const stretch=d2/Math.max(0.1,grabR);
            return stretch>0.75 ? clamp((stretch-0.75)*3,0.3,1) : 0;
          }
          """
          new2="""function groundDiveAmount(d2, gz, grabR){
            const stretch=Math.hypot(d2,gz)/Math.max(0.1,grabR);
            return stretch>0.75 ? clamp((stretch-0.75)*3,0.3,1) : 0;
          }
          """
          assert base.count(old2)==1
          build(base.replace(old2,new2,1),'/tmp/mut26.html')
          # OI-245 mutation: ball leaves while body is still in old stride phase.
          assert base.count('const PITCH_RELEASE_K=0.80;')==1
          build(base.replace('const PITCH_RELEASE_K=0.80;','const PITCH_RELEASE_K=0.55;',1),'/tmp/mut27.html')
          PY
      - name: Run baseline and mutations in Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for name in base mut25 mut26 mut27; do
            timeout 240 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --dump-dom file:///tmp/$name.html > /tmp/$name.dom 2>/tmp/$name.err || { cat /tmp/$name.err; exit 1; }
          done
      - name: Assert baseline and mutation detection
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,json,urllib.parse
          def load(name):
              s=Path('/tmp/'+name+'.dom').read_text(encoding='utf-8',errors='replace')
              m=re.search(r'data-harness="([^"]+)"',s)
              if not m: raise SystemExit(name+': data-harness missing')
              return json.loads(urllib.parse.unquote(html.unescape(m.group(1))))
          base=load('base'); bad={k:v for k,v in base.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'baseline_count':len(base),'baseline_failed':bad},ensure_ascii=False,indent=2))
          if len(base)!=29 or bad: raise SystemExit('baseline failed')
          cases=[('mut25','test25_二塁カバー実体'),('mut26','test26_ゴロ不要ダイブ'),('mut27','test27_投球モーション時系列')]
          for name,key in cases:
              out=load(name); print(name,out[key])
              if out[key].get('verdict')!='FAIL': raise SystemExit(name+' mutation escaped')
          PY
      - name: Commit verified patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js
          git diff --cached --check
          git commit -m "fix: refine fielding dives and pitching motion"
          git push origin HEAD:agent/b0805-13-fielding-motion
