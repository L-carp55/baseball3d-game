name: Verify b0805-12 defense fixes
on:
  push:
    branches: ["agent/b0805-12-defense-decisions"]
    paths: [".github/workflows/cc_patch_b0805_12.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b0805-12-defense-decisions
      - name: Apply patch and syntax-check
        run: |
          python .cc_patch_b0805_12.py
          git diff --check
      - name: Build baseline and mutation HTMLs
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('_test_harness_20260804.js').read_text(encoding='utf-8')
          marker='  console.log(JSON.stringify(out,null,1));\n  return out;'
          repl="  const __j=JSON.stringify(out); document.body.setAttribute('data-harness',encodeURIComponent(__j));\n  console.log(JSON.stringify(out,null,1));\n  return out;"
          assert h.count(marker)==1
          h=h.replace(marker,repl,1)
          base=Path('baseball3d.html').read_text(encoding='utf-8')
          def build(src,path):
              src=src.replace('<script>\n"use strict";','<script>window.requestAnimationFrame=()=>0;</script>\n<script>\n"use strict";',1)
              src=src.replace('</body>',f'<script>\n{h}\n</script>\n</body>',1)
              Path(path).write_text(src,encoding='utf-8')
          build(base,'/tmp/base.html')
          old="""    if(fallback.nb===4 && fallback.m < -0.60){\n      const contain=containmentBaseForTrailingRunner();\n      if(contain!=null) return {nb:contain};\n    }\n"""
          assert base.count(old)==1
          build(base.replace(old,'',1),'/tmp/mut23.html')
          old2="return {armL:0.28,armR:0.24,elbowL:0.55,elbowR:0.55,lean:0.10,crouch:0.03,legL:0.08,legR:-0.08,kneeL:0.12,kneeR:0.12};"
          assert base.count(old2)==1
          build(base.replace(old2,old2.replace('crouch:0.03','crouch:0.30'),1),'/tmp/mut24.html')
          PY
      - name: Run baseline and mutations in Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for name in base mut23 mut24; do
            timeout 240 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --dump-dom file:///tmp/$name.html > /tmp/$name.dom 2>/tmp/$name.err || { cat /tmp/$name.err; exit 1; }
          done
      - name: Assert baseline 26 PASS and mutations detected
        run: |
          python - <<'PY'
          from pathlib import Path
          import html,re,json,urllib.parse
          def load(name):
              s=Path('/tmp/'+name+'.dom').read_text(encoding='utf-8',errors='replace')
              m=re.search(r'data-harness="([^"]+)"',s)
              if not m: raise SystemExit(name+': data-harness missing')
              return json.loads(urllib.parse.unquote(html.unescape(m.group(1))))
          base=load('base'); bad={k:v for k,v in base.items() if isinstance(v,dict) and v.get('verdict')!='PASS'}
          print(json.dumps({'baseline_count':len(base),'baseline_failed':bad},ensure_ascii=False,indent=2))
          if len(base)!=26 or bad: raise SystemExit('baseline failed')
          m23=load('mut23'); m24=load('mut24')
          print('mut23',m23['test23_手遅れ本塁送球'])
          print('mut24',m24['test24_守備構え'])
          if m23['test23_手遅れ本塁送球'].get('verdict')!='FAIL': raise SystemExit('OI-247 mutation escaped')
          if m24['test24_守備構え'].get('verdict')!='FAIL': raise SystemExit('OI-246 mutation escaped')
          PY
      - name: Commit verified patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball3d.html _test_harness_20260804.js
          git diff --cached --check
          git commit -m "fix: contain trailing runners and correct defensive ready poses"
          git push origin HEAD:agent/b0805-12-defense-decisions
