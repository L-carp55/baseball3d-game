}
function cpuChoosePitch(){
  const t=Math.floor(rnd(0,4));
  let nx,ny;
  const ahead = S.strikes>=2 && S.balls<3;
  if(ahead && Math.random()<0.6){
    nx=rnd(-1.75,1.75); ny=rnd(-1.8,-0.9);
    if(Math.abs(nx)<0.9) nx=(Math.random()<0.5?-1:1)*rnd(1.05,1.7);
  }else if(S.balls>=3 && Math.random()<0.7){ nx=rnd(-0.5,0.5); ny=rnd(-0.4,0.5); }
  /* ふつうの配球。ゾーンを外す割合が少なすぎると四球がまず出ず（打席の2%しか出ていなかった）、
     走者が溜まらないので得点が入らない。実際に投手がゾーンに投げるのは4割強。 */
  else { nx=rnd(-2.0,2.0); ny=rnd(-1.75,1.6); }
  return {type:t, nx, ny};
}
// nx,ny は「ゾーン中心からの割合」(±1でゾーンの端)
function launchPitch(type, nx, ny){
  const P=PITCHES[type];
  const tx = clamp(nx*ZX + gauss(P.ctrl), -1.9, 1.9);
  const ty = clamp((ZY0+ZY1)/2 + ny*((ZY1-ZY0)/2) + gauss(P.ctrl), 0.15, 5.0);
  pitch = {
    type, P, t:0, dur:P.dur*SPD[DIFF_I],
    rx:0.95, ry:5.75, rz:54.0,          // リリース点
    tx, ty,                              // 最終到達点(ft)
    swung:false, cpuSwingT:null, cpuOff:null, done:false
  };
  anim.wind=0;
  if(!isPlayerBatting()){
    const strike=inZone(tx,ty), two=S.strikes>=2;
    const p = strike ? (two?0.94:0.70) : (two?0.42:0.24);
    const sk = DIFF[DIFF_I].cpu;
    if(Math.random()<p){
      const err = gauss(52/sk) + (P.dur<0.55?0:gauss(22/sk));   // 変化球ほど読み違える
      pitch.cpuSwingT = 1 + err/(P.dur*1000);
      pitch.cpuOff = {dx:gauss(30/sk), dy:gauss(30/sk)};   // px相当
    }
  }
  S.phase='pitch';
  trail=[];
}
/* 変化球の軌道。
   Bを定数として  pos = release + (target - B - release)*e + B*e²  とする。
   ・e=1でちょうど狙った到達点に来る（だから狙い通りに投げられる）
   ・出だしは「target - B」へ向かって飛ぶので、打者から見ると最後にB分だけ曲がる
   以前はBにe²を掛けた値を1次項にも入れており、曲がりが打ち消し合って変化していなかった。 */
function pitchPos(t){
  const p=pitch, e=clamp(t,0,1.25), Bx=p.P.bx, By=p.P.by;
  return [
    p.rx + (p.tx-Bx-p.rx)*e + Bx*e*e,
    p.ry + (p.ty-By-p.ry)*e + By*e*e,
    p.rz + (0    -p.rz)*e
  ];
}

/* ========================= コンタクト（2D版と同一） ========================= */
/* 打撃モード。0=ミート打ち 1=強振 2=バント。あなたが打つ時だけ効く（CPUは強振と同じ既定値）。
   ミート＝当たる範囲が広く飛ばない / 強振＝狭いが飛ぶ / バント＝転がすだけ。 */
let batMode = 0;      // 既定はミート打ち
const BATMODE = [
  /* ミート＝当たる範囲が広いかわりに飛ばない。強振＝狭いかわりに飛ぶ。
     pow は打球初速の上限、loft は打ち出し角度の基準をずらす量。
     この差が小さすぎて、ミート打ちでも本塁打が続けて出ていた。 */
  {n:'ミート打ち', tw:1.50, aw:1.50, pow:0.88, loft:-5.0, whiff:1.18},
  {n:'強振',      tw:0.72, aw:0.72, pow:1.08, loft: 5.0, whiff:0.86},
  {n:'バント',    tw:1.00, aw:1.00, pow:1.00, loft: 0.0, whiff:1.00}
];
/* CPUの打者は打ち方を選ばないので、専用の素の値を使う。
   ここで強振（当たる範囲が0.72倍）を流用していたため、CPUの三振が打席の53%にもなり、
   1試合の得点が両軍で2点も入らなかった（実際の三振は打席の約22%）。 */
const CPU_MODE = {n:'CPU', tw:1.00, aw:1.00, pow:1.00, loft:0.5, whiff:1.00};
function evalContact(dtMs, dx, dy, powerMul, D, loft, px){
  /* 当たり判定はバットの形なりの横長楕円（横:縦≈2.2:1）。横のズレはバットの長さが
     吸収し、高さのズレはバットの太さぶんしか許されない（実物理どおり）。
     以前は逆で「高さの方を甘く見る」縦長判定＝○カーソルとも食い違っていた（オーナー指摘）。
     楕円の面積は旧判定と同じに保つ＝当てやすさの総量（三振率の較正）は変えない。 */
  const aimDist=Math.hypot(dx*0.60, dy*1.30);
  const qT=1-Math.abs(dtMs)/D.tw, qA=1-aimDist/D.aw;
  if(qT<=0||qA<=0) return null;
  const q=clamp(0.55*qT+0.45*qA,0,1);
  if(Math.random() > D.whiff + 0.90*q) return null;
  /* 打球初速。要点は「芯を外した時にどれだけ落ちるか」。
     実際のバットは、芯から少しずれただけで初速が急に落ちる（ずれに対して
     二乗以上で効く）。以前は q にほぼ比例させていたので、芯から外れても
     初速がほとんど落ちず、当たりさえすれば本塁打になっていた。
     パワーは上限(evMax)だけを押し上げ、下限は誰でも同じ弱い当たりになる。
     実測の目安: 平均89mph・強打者の上限115前後・史上最速122mph。 */
  const evMax=Math.min(118, 108*powerMul);
  const exit=clamp(40+(evMax-40)*Math.pow(q,1.35)+gauss(3.5), 28, 122);
  /* 打球方向は「カーソルと球のズレ」に素直に対応させる（頭打ちさせて暴れないようにする）。
     縦: 球の下を捉えるほど上がる / 横: 早く振る・内側を捉えるほど引っ張る */
  /* 打球角度。実測の分布はゴロ45%・ライナー20%・フライ35%とかなり広い。
     芯を食った当たりは角度もそろい、芯を外すほど上下に散る（詰まった打球が
     高く上がる・引っかけて叩きつける）。これを q でばらつき幅に効かせる。 */
  let la = (loft===undefined?12:loft) + 38*Math.tanh(dy/45) + gauss(8+18*(1-q));
  la = clamp(la, -30, 55);
  /* 打球方向はほぼタイミングで決まる（早く振れば引っ張り・遅れれば流す）。
     狙いの左右のズレは、方向よりも当たりの良し悪しに出る（バットは長い棒なので、
     横にずれても向きはあまり変わらず、詰まるか先っぽに当たるかになる）。
     以前は狙いの左右を方向に強く効かせていたため、
     「芯を食った打球＝狙いが正確＝真ん中方向」となり、強い当たりが必ず正面を突いていた。 */
  /* 内角・外角も方向を決める。内角の球はバットの根元に近い所で早く捉えるので引っ張りになり、
     外角は差されて逆方向へ出る。これが無かったため、内角の球を楽に流してホームランにできた。
     px=投球の左右(ft)。右打者から見て -x 側が内角＝引っ張り方向。 */
  const loc = (px||0)*19;
  let spray = 52*Math.tanh((dtMs*0.95 + dx*0.10 + loc)/52) + gauss(7);
  spray = clamp(spray, -58, 58);
  return {exit,la,spray,q};
}

/* ========================= 打球シミュレーション（2D版と同一） ========================= */
const DRAG=0.0013;
/* 打球の回転（マグヌス効果）。実際の打球は空気抵抗と重力だけでは飛ばない。
   ・バックスピン(bs)＝浮く力。フライの滞空が伸び、飛距離が20〜30ft変わる
   ・サイドスピン(ss)＝横に曲がる力。引っ張った打球がライン方向へ切れていくのはこれ
   回転はコンタクト(startFlight)で決まり、飛んでいる間に少しずつ弱まる。
   係数は「バックスピン強で+25ft・サイドスピン強で30ft横」の実測目安に合わせた。 */
function stepBall(b,dt){
  const sp=Math.hypot(b.vx,b.vy,b.vz), d=DRAG*sp;
  b.vx-=b.vx*d*dt; b.vy-=b.vy*d*dt; b.vz-=b.vz*d*dt;
  b.vz-=32.2*dt;
  if((b.bs||b.ss) && b.z>0.5 && sp>10){
    /* 係数は端から端まで測って決めた（出塁率32%・1試合8〜10点が崩れない範囲）。
       揚力を0.000115にするとライナーの滞空が伸びて出塁率が33%→59%に跳ねた。
       守備の位置取りは回転なしの飛距離に合わせてあるので、揚力は控えめ・
       横の曲がりは見た目に分かる量（引っ張りフライで10ft強）を残す。 */
    const LIFT=0.00005, SIDE=0.00019;
    const hx=b.vx/sp, hy=b.vy/sp;
    b.vz += (b.bs||0)*LIFT*sp*sp*dt;                      // 浮く
    b.vx += -hy*(b.ss||0)*SIDE*sp*sp*dt;                  // ライン側へ切れる
    b.vy +=  hx*(b.ss||0)*SIDE*sp*sp*dt;
    const dec=Math.pow(0.88,dt);                          // 回転は徐々に弱まる
    if(b.bs) b.bs*=dec; if(b.ss) b.ss*=dec;
  }
  b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
  /* バックネットで止まる。本塁の後方には必ずネットがあるので、
     それた送球やファウルが無限に転がっていくことはない。 */
  {
    const R=Math.hypot(b.x,b.y);
    if(R>BACKSTOP_R && b.y < 8 && b.z < 24){
      const nx=b.x/R, ny=b.y/R, vr=b.vx*nx+b.vy*ny;
      if(vr>0){
        b.vx -= 1.5*vr*nx; b.vy -= 1.5*vr*ny;   // 反発0.5で内側へ返す
        b.vz *= 0.6;
        b.x = nx*(BACKSTOP_R-0.5); b.y = ny*(BACKSTOP_R-0.5);
      }
    }
  }
  if(b.z<=0){ b.z=0;
    /* 弱い落下でも跳ねる。しきい値が高すぎて、たたきつけたゴロが一度も跳ねずに
       転がるだけになっていた。跳ねるたびに横の速度も落ちて自然に減速する。 */
    /* 跳ねは見えるように（反発0.44では低いゴロの跳ねが0.2-1ftしかなく
       「全然バウンドしている感じがない」＝滑って見えた。オーナー指摘）。
       見える跳ねを作るのは縦の反発だけ＝0.55へ。横の維持率は0.78のまま
       （0.86に上げたら球足が伸びすぎて封殺テストが0/20に崩壊した。実測済み）。 */
    if(b.vz<-1.2){ b.vz=-b.vz*0.55; b.vx*=0.78; b.vy*=0.78; }
    else {
      b.vz=0;
      /* 転がりの減速は「一定＋速度比例」。以前の指数型(毎秒70%減)は、強いゴロが
         1秒足らずで急死した後、時速3ftの這いが延々と続く二重の不自然さがあった
         （録画205336、三塁線の95mphゴロ）。実際の芝は速い球足ほど削られつつ、
         最後はすっと止まる。速度が減速量を下回ったら完全に停止する。 */
      const sp=Math.hypot(b.vx,b.vy);
      if(sp>0){
        /* 減速の強さは実測合わせ(2026-08-04): 強いゴロ(95mph)が外野の壁際まで
           約280ft転がって6秒前後で止まる。(8+0.10sp)では216ftで止まり
           「プロの試合よりずっと手前の中途半端な位置で止まる」となった（録画210517）。 */
        const dec=(5 + 0.055*sp)*dt;
        const k=Math.max(0, sp-dec)/sp;
        b.vx*=k; b.vy*=k;
      }
    } }
}
const BACKSTOP_R = 62;    // 本塁からバックネットまでの距離(ft)。実際の球場は50〜70ft
const CATCH_R = 4.5;      // グラブが届く距離。先読みと実判定で同じ値を使う
const DIVE_R  = 5.0;      // 飛びついて伸ばせる距離(ft)。守備力で決まる（下手でも多少は飛びつく）
function diveReach(f){ return DIVE_R*(0.25 + 0.75*((f.fld||60)/100)); }
/* バウンドに合わせて入る位置。ボールの「今いる場所」へまっすぐ走ると、
   大きく弾んだ打球は頭の上を越えて後逸する（実際に指摘のあった不具合）。
   これから先の軌道のうち「自分が間に合って、かつ捕れる高さにある」最初の点へ入る。 */
function interceptPoint(f){
  const b={x:ball.x,y:ball.y,z:ball.z,vx:ball.vx,vy:ball.vy,vz:ball.vz};
  let t=0, fallback=null, best2=null;
  for(let i=0;i<900;i++){
    stepBall(b,PHYS_H); t+=PHYS_H;
    if(i%6) continue;
    if(b.z<=6.2){
      if(!fallback) fallback=[b.x,b.y];
      const d=Math.max(0, Math.hypot(b.x-f.cx,b.y-f.cy)-CATCH_R);
      /* 速い打球(70ft/s超)は余裕をもって正面に入れる点まで待つ（強襲は待って止める）。
         転がる打球には余裕を待たず前へ突っ込む（実際の内野手のチャージ）。
         転がりの物理を実測型（球足が残る）に直した際、全部を「余裕のある深い点」で
         待つ古い作りのままだと捕球位置が深くなりすぎ、普通のゴロの一塁送球が
         間に合わなくなった（封殺テスト20/20→0/20の崩壊で検出）。 */
      const spd=Math.hypot(b.vx,b.vy);
      const margin = spd>70 ? ROUND_OFF : 0.06;
      if(reactOf(f)*0.4+runTime(f.sp,d)+margin <= t) return [b.x,b.y];
      if(!best2 && reactOf(f)*0.4+runTime(f.sp,d) <= t) best2=[b.x,b.y];
    }
    if(b.z<0.1 && Math.hypot(b.vx,b.vy)<3) break;
  }
  return best2||fallback||[ball.x,ball.y];
}
const PHYS_H  = 1/240;    // 物理の刻み。画面更新率に関係なくこの幅で進める
/* 捕れるかどうか。実際の野球では次の3つで決まる。
   ・手元に来るまでの時間が短く、しかも打球が速いほど捕れない（投手への強烈な当たり）
   ・飛びついて体勢を崩すほど捕れない
   ・捕球（能力）が高いほど捕れる
   これが無かったため、どんなに速い打球も100%捕られ、エラーが一度も起きなかった。 */
function catchProb(f, dive01){
  const sp    = Math.hypot(ball.vx,ball.vy,ball.vz)/1.467;   // mph
  const react = clamp((ball.t-0.26)/0.40, 0, 1);             // 反応する余裕（0.26秒以下はほぼ無理）
  const hard  = clamp((sp-70)/50, 0, 1);
  const skill = (f.cat||70)/100;
  let p = 0.995 - 0.07*(1-skill);
  p -= (1-react)*(0.30+0.55*hard)*(1.15-0.30*skill);
  p -= 0.60*dive01*dive01*(1.20-0.40*skill);
  return clamp(p, 0.03, 0.995);
}
/* 「どれだけ余裕を持って追いついたか」で決まる成功率。
   定位置から捕球地点まで走るのに要る時間と、実際に球が来るまでの時間の差が余裕。
   実際の野球では、ギリギリ届く打球が捕れるのは2〜3割しかない（だからポテンヒットも
   内野の間を抜ける当たりも生まれる）。ここが無かったため、理屈のうえで一歩でも
   間に合う打球はすべて捕られ、弱い当たりが1本も落ちなかった。
   最初から間に合っていない（＝追いかけて拾いに行く）場面では判定しない。 */
/* ゴロは正面に入って前へ出るぶん、飛球を追うより余裕が無くても捕れる（第2・第3引数で分ける）。 */
function routeProb(f, floor, gain, reach){
  const d0=Math.hypot(ball.x-f.x, ball.y-f.y);
  // 走らなければならないのは「手の届く範囲の外側」だけ。飛びつける分は走らなくてよい
  const need=reactOf(f)+runTime(f.sp, Math.max(0, d0-(reach===undefined?CATCH_R:reach)));
  const spare=ball.t-need;
  if(spare < -0.05) return 1;
  return clamp((floor===undefined?0.10:floor)+(gain===undefined?1.30:gain)*spare, 0, 1);
}
/* はじく。捕り損ねた打球はその場に落ちず、勢いを失って前や横へ弾む。
   はじいた本人はすぐには動けない（飛びついた後なら起き上がる時間も要る）。
   弾いた直後に「誰が一番早く追いつけるか」を決め直すので、球が野手の脇を抜けても
   その野手だけが延々と追いかけることにはならない。 */
function deflectBall(f, dive01, ground){
  S.errorBy = f.name || f.n;
  /* フェア地域で野手が触れた打球は、その後どこへ転がってもフェア（公認野球規則）。
     はじいた球がファウルラインを越えてファウル扱いになっていた（オーナー指摘）。 */
  if(Math.abs(Math.atan2(ball.x,ball.y)/RAD)<=45.5) ball.fairLocked=true;
  const k = (ground?0.30:0.22) + Math.random()*0.22;
  ball.vx = ball.vx*k + rnd(-14,14);
  ball.vy = ball.vy*k + rnd(-14,14);
  ball.vz = ground ? rnd(0.5,3.0) : Math.abs(ball.vz)*0.25 + rnd(1,6);
  ball.canCatchAir = false;                  // はじいた球は空中で捕り直せない扱いにする
  ball.dPrev=undefined; ball.dMin=undefined;
  f.stun = (ground?0.30:0.30+0.55*dive01);
  const plan = planPlay(ball, true);
  const freed = plan.f.coverBase;
  /* はじいた直後の計画は当てにしない（弾かれた球の転がりは予測とずれやすい）。
     計画時刻(planT)を先に置くと、その間は再照準が封じられ、外れた地点で野手が
     立ち尽くす（実測: エラー後に1.2秒棒立ち、録画172217）。すぐ再照準できるようにする。 */
  ball.primary = plan.f; ball.planT = ball.t + Math.min(plan.t, 0.25); plan.f.coverBase = null;
  fielders.forEach(x=>{ x.primary=(x===plan.f); });
  setTarget(plan.f, plan.x, plan.y);
  if(freed!=null) rundownCover(freed, plan.f);
}
/* 守備力による守備範囲の差。反応の速さとして効かせる（平均50でちょうど F_REACT）。
   以前は zone を計算だけして使っておらず、守備力を変えても打球への到達が変わらなかった。 */
function reactOf(f){ return Math.max(0.10, F_REACT + ((f.zone||0.0095)-0.0095)*20); }
function planPlay(src, useCurrent){
  /* 実際の飛行と同じ刻み(1/240秒)で先読みする。
     以前は0.02秒刻みで予測しており、予測した通り道と実際の打球が数ft ずれていたため、
     野手が球の脇に走り込んで「横を抜けたのに◯◯ゴロ」になっていた。 */
  const b={...src}; let t=0; const path=[]; const h=1/240;
  for(let i=0;i<1700;i++){
    stepBall(b,h); t+=h;
    if(i%4===0) path.push({x:b.x,y:b.y,z:b.z,t,vz:b.vz,sp:Math.hypot(b.vx,b.vy,b.vz)});
    const dist=Math.hypot(b.x,b.y), ang=clamp(Math.atan2(b.x,b.y)/RAD,-45,45);
    if(dist>fenceDist(ang)+12) break;
    if(t>7 || (b.z<=0.03 && Math.hypot(b.vx,b.vy)<5)) break;
  }
  if(!path.length) path.push({x:b.x,y:b.y,z:b.z,t});
  const firstLand = path.find(p=>p.z<=0.06 && p.t>0.15) || path[path.length-1];
  /* 捕れる高さ。立って手を伸ばして届くのは約7ft。そこから上は跳んだ分だけ伸びるが、
     跳んで捕れるのは山なりに落ちてくる打球だけで、速いまま頭上を越えていくライナーは捕れない。
     実際の捕球判定(stepFlight)と同じ基準にしてある。ここを一律9.5ftにしていたため、
     野手が「実際には届かない高さの通過点」を目指して走っていた。 */
  const topAt = p => 7.0 + 2.5*clamp(1-(p.sp/1.467)/135, 0, 1);
  const cands = path.filter(p=>p.t>0.22 && p.z <= topAt(p));
  const pool = cands.length?cands:[firstLand];
  let best={f:fielders[0], t:1e9, x:firstLand.x, y:firstLand.y, air:false};
  fielders.forEach(f=>{
    let hit=null;
    /* 壁に当たった後の再計算では、定位置ではなく「今いる場所」から測る。
       定位置基準のままだと、既に近くまで来ている野手を遅いと判定する。
       距離からグラブの届く分を引くのは、実際の捕球判定が4.5ft以内だから（同じ物差しにする）。 */
    const fx = useCurrent ? f.cx : f.x, fy = useCurrent ? f.cy : f.y;
    const react = reactOf(f);
    const dOf = p => Math.max(0, Math.hypot(p.x-fx,p.y-fy) - CATCH_R);
    /* 回り込み。「ぎりぎり届く点」を目指すと、横っ跳びの体勢で触るだけになって後逸する
       （実際に、2ft横まで来ていながら70ft以上後ろへ抜けていた）。
       本物の野手は少し深い角度で入り、正面で止められる点を選ぶ。
       余裕をもって入れる点を先に探し、無ければ従来どおりぎりぎりの点を目指す。 */
    for(const M of [ROUND_OFF, 0]){
      for(const p of pool){
        if(react+runTime(f.sp,dOf(p))+M <= p.t){ hit={t:p.t,p}; break; }
      }
      if(hit) break;
    }
    if(!hit){ const p=pool[pool.length-1];
      /* 間に合う点が無い時、走って行く先は「一番近づける点」にする（そこから飛びつく）。
         目標を最後の点＝球が止まる場所にしていたため、あと一歩で届く打球でも
         野手は球の行き着く先へ回り込むだけで、一度も身体を投げ出さなかった。
         大きく外れている時は従来どおり回収に向かう（届かない球に飛びついても意味がない）。 */
      let near=p, nd=1e9;
      for(const q of pool){ const d=dOf(q); if(d<nd){ nd=d; near=q; } }
      const layout = nd < diveReach(f)+3.0;
      hit={t:react+runTime(f.sp,dOf(p)), p: layout?near:p}; }
    if(hit.t<best.t) best={f, t:hit.t, x:hit.p.x, y:hit.p.y,
      air: hit.p.z>1.2 && hit.p.t<=firstLand.t+0.02};
  });
  return {...best, firstLand};
}
/* ===== 走者 =====
   位置は「本塁から何個目の塁か」の連続値 p で持つ（0=本塁, 1=一塁, 2=二塁, 3=三塁, 4=生還）。
   打球が飛んだ瞬間に走り出し、結果が確定したら行き先(goal)を更新する。
   進塁しない走者は元の塁へ戻る。 */
const RUN_SPEED = 1/90;                  // 1ft/秒あたりの塁進行。走力から出した速度を掛ける
function beginRunners(bases, mode){
  const bat = ROSTER[battingTeam()][S.order[battingTeam()]];
  /* mode==='noBatter' … 投球中の走者だけを置く（盗塁用。打者走者はまだ存在しない）
     mode==='keep'     … 盗塁で走っている走者をそのまま引き継ぎ、打者走者だけ足す */
  if(mode==='keep' && runners.length){
    runners.unshift({p:0, goal:1, autoGoal:1, extra:0, origin:0, sp:A.speed(bat.走)});
    return;
  }
  /* 打者走者の一塁までの脚は毎回わずかにぶれる（打った直後の体勢・スタートの切れ）。
     いつも最速タイムで走るわけではないので、能力から出した速さの94〜100%で走る。 */
  runners = (mode==='noBatter') ? []
          : [{p:0, goal:1, autoGoal:1, extra:0, origin:0, sp:A.speed(bat.走)*rnd(0.94,1.0)}];   // 打者走者
  /* 走者は塁から少しだけ離れて構える（リード）。実際の野球と同じで、これが無いと
     打った瞬間から完全な静止状態で走り出すことになり、単打で誰も進めなくなる。
     守備は goal（行くつもり）ではなく「実際に動いている向き」を見るので、
     止まっているリードを「走り出した」と誤読することはない。 */
  bases.forEach((b,i)=>{ const p=i+1+0.085;
    runners.push(b?{p, goal:p, autoGoal:p, extra:0, origin:i+1, sp:(b.sp||21)}:null); });
  runners=runners.filter(Boolean);
}
function applyRunnerResult(res){
  const moves = res.moves||[];
  runners.forEach(r=>{
    const mv = moves.find(m=>m.from===r.origin);
    setAutoGoal(r, mv ? mv.to : r.origin, true);   // 与えられた進塁・帰塁は手動より優先
  });
}
/* 走者も守備と同じ加速で走る。止まった状態から ACC_T 秒かけて最高速に達する。
   これがあるので、同じ最高速でも塁間はスプリントより時間がかかる。 */
function updateRunners(dt){
  const trapped = throwPlay && throwPlay.stage==='rundown' ? throwPlay.rd.r : null;
  runners.forEach(r=>{
    // 挟まれた走者は左右を見ながらなので全速では走れない
    const top=(r.sp||23)*(r===trapped?0.86:1), acc=top/ACC_T;
    r.dir = r.p<r.goal-1e-6 ? 1 : (r.p>r.goal+1e-6 ? -1 : 0);   // 守備が見て分かる「走っている向き」
    if(r.p < r.goal){
      r.v=Math.min(top,(r.v||0)+acc*dt);
      const pPrev=r.p;
      r.p=Math.min(r.goal, r.p + r.v*dt*RUN_SPEED);
      /* 塁を回って先へ続く時は減速する（実際の走者は塁で直角には曲がれない）。
         全速のまま90°向きを変えていたため、一塁を回った打者が急に加速したように見えていた
         （録画172010）。塁で止まる時は対象外＝本塁→一塁の較正には影響しない。
         経路は2つ: (a)塁を跨いで通過（目標が2塁先） (b)塁ちょうどで目標が延長されて出直す
         （Sキー押しっぱなしはこちら。クランプで必ずp=塁ぴったりを踏むので跨ぎでは検出できない）。
         どちらも今の速度に掛けるので、塁上で止まっていた走者(v≈0)には効かない。 */
      const crossed = r.p < r.goal-1e-9 && Math.floor(r.p) > Math.floor(pPrev);
      const throughBase = pPrev>0.5 && Math.abs(pPrev-Math.round(pPrev))<1e-6 && r.p>pPrev;
      if(crossed || throughBase) r.v*=0.65;
      // 目標の塁に着いたら、手動の進塁指示は消費して消える（勝手に次へ行かない）
      if(r.p>=r.goal-1e-9 && r.cmd==='S') r.cmd=null;
    }else if(r.p > r.goal){
      r.v=Math.min(top*0.8,(r.v||0)+acc*dt);
      r.p=Math.max(r.goal, r.p - r.v*dt*RUN_SPEED);
    }else{
      /* 目標に着いた瞬間に速度を0にすると、Sを押し続けて次の塁へ向かう時に
         毎回その場で止まってから走り直すことになる。急には止まれないので徐々に落とす。 */
      r.v=Math.max(0,(r.v||0) - (top/ACC_T)*2.2*dt);
    }
  });
}
function runnerPos(r){
  const i=Math.floor(Math.min(r.p,3.999)), f=r.p-i;
  const a=BASEPOS[i%4], b=BASEPOS[(i+1)%4];
  return {x:lerp(a.x,b.x,f), z:lerp(a.z,b.z,f), face:Math.atan2(b.x-a.x,b.z-a.z)};
}

/* ===== 野手の移動 ===== */
// フェンスの外へは出られないよう位置を球場内に丸める（本塁打を追いかけて場外へ走る不具合の対策）
function clampField(x,y){
  const d=Math.hypot(x,y);
  if(d<1) return [x,y];
  const max=fenceDist(clamp(Math.atan2(x,y)/RAD,-45,45))-2;
  return d>max ? [x/d*max, y/d*max] : [x,y];
}
function setTarget(f,x,y){ const p=clampField(x,y); f.tx=p[0]; f.ty=p[1]; }
function moveFielders(dt, running){
  fielders.forEach(f=>{
    if(f.diveT>0) f.diveT-=dt;      // 飛び込み・跳びの見た目タイマー
    if(f.jumpT>0) f.jumpT-=dt;
    const dx=f.tx-f.cx, dy=f.ty-f.cy, d=Math.hypot(dx,dy);
    /* ベースカバーは打球の行方を見てから動く必要がない（打った瞬間に決まっている動き）。
       反応待ちを入れると、一塁手が捕りに出た時の投手のカバーが間に合わず、
       まともな一塁ゴロがほとんど内野安打になる。カバーは全力で入る。 */
    const cover = f.coverBase!=null && !f.primary;
    /* はじいた直後・飛びついた直後は動けない（起き上がる時間）。 */
    if(f.stun>0){ f.stun-=dt; f.v=0; return; }
    if(d>0.5 && (running || cover)){
      f.v = Math.min(f.sp, (f.v||0) + (f.sp/ACC_F)*dt);   // 走り出しは加速する（守備は打者より速い）
      const m=Math.min(d, f.v*dt*(f.primary?1:0.88));   // カバーも能力どおりの速さで走る
      f.cx+=dx/d*m; f.cy+=dy/d*m; f.run+=m; f.face=Math.atan2(dx,dy);
      const p=clampField(f.cx,f.cy); f.cx=p[0]; f.cy=p[1];
    } else if(d<=0.5){ f.v=0; }
  });
}

/* ===== 送球・返球 =====
   送球は「実際に投げて、飛んで、到達する」ものとして扱う。
   ・捕ってから離すまでの持ち替え時間がある（肩が弱いほど長い）
   ・打球と同じ物理（空気抵抗・重力・バウンド）で飛ぶので、遠いほど遅く、山なりになる
   ・アウトかセーフかは「送球が塁に届いた時刻」と「走者がその塁に達した時刻」を比べて決める
   以前は捕った瞬間に結果が確定し、送球は見た目だけだった。 */
let throwPlay = null;

/* 送球先の座標。投手への返球は、マウンドではなく「投手が今いる場所」へ投げる。
   マウンド固定にすると、打球を追って動いた投手が不在のままボールだけが
   マウンドに転がって止まってしまう。 */
function throwPoint(t){
  if(t==='P'){
    const p=fielders.find(f=>f.n==='投');
    return p ? [p.cx, p.cy] : [0,60.5];
  }
  return [BASEPOS[t%4].x, BASEPOS[t%4].z];
}
/* 実際に投げる時の肩の強さ。定位置から余裕をもって投げる時が最大で、
   打球を追って長い距離を走ったあとは体勢が崩れて球威が落ちる。
   捕手は座った姿勢から、投手は投球動作の直後から投げるので、そのぶん弱い。 */
/* 送球の初速(ft/s)。肩の強さと、その距離をどれだけ本気で投げるかで決まる。
   実際の選手は近い塁へ全力では投げない（一塁手が22ft先へ92mphで投げていた）。
   遠投になるほど全力に近づく。実測の目安＝内野の一塁送球80mph・外野の全力88mph。 */
function throwSpeed(arm, dist){
  /* 手前へのトスは緩め、塁間以上は実戦の全力。ここを「130ftで全力」にしていたため、
     二塁→一塁(85ft)の併殺の送球まで9割の力になり、中位の守備力では併殺が
     ほぼ成立しなくなっていた（守備70で5%）。併殺の転送は実際には全力で投げる。 */
  const eff = clamp(0.78 + 0.30*((dist||120)/110), 0.78, 1.0);
  return (106 + 58*(arm-0.55)) * eff;
}
function armEff(f){
  const run = Math.min(1, (f.run||0)/70);            // 追いかけた距離ぶん体勢が苦しい
  /* 守備位置による差。外野手は助走をつけて全力で投げるので満額。
     内野手は捕ってすぐ正確に投げるため全力では投げない（実測でも外野より約8mph遅い）。
     捕手は座った姿勢から、投手は投球動作の直後から投げるのでさらに落ちる。 */
  const pos = (f.n==='捕') ? 0.88 : (f.n==='投' ? 0.86
            : ('一二三遊'.includes(f.n) ? 0.90 : 1.0));
  return Math.max(0.20, (f.arm||0.8) * (1 - 0.32*run) * pos);
}
/* 送球のそれ。送球精度（送、1〜100）が低いほど、また走りながらの体勢が苦しいほど大きくそれる。
   ガウス分布＝普段は小さくずれ、たまに大きく抜ける（実際の悪送球の出方）。
   走りペナルティは控えめ（外野手は捕球後にステップを踏んで投げ直すので、
   追った距離がそのまま乱れにはならない。初版の0.028では外野返球全部がσ5ft超になり
   「送球エラーが多い・後ろにそらしすぎ」となった＝録画203729、b0804-23実測で再較正）。
   目安(200ftの外野返球・送70・追走あり): 典型ずれ≈4ft(塁上で処理できる)・まれに8ft超（悪送球）。 */
function throwOffset(f, d){
  const run=Math.min(1,(f.run||0)/70);
  const acc=(f.acc!=null?f.acc:60);
  const sigma = d*(0.004 + 0.016*(100-acc)/100 + 0.012*run);
  return [gauss(sigma), gauss(sigma)];
}
/* 送球が届くまでの秒数。launchThrow と同じ式で求める。
   「距離÷一定の速さ」で見積もると遠投ほど大きく外れる（山なりに投げるぶん遅い）。
   守備の判断も走者の判断も、この同じ関数を使う＝見えている送球と判断が食い違わない。 */
/* 長い送球は実際には山なりに投げる（最短角では届かせられない）。
   さらに外野の遠投は助走（クロウホップ）を踏むので、その分だけ遅くなる。
   最短角＋助走なしで計算していたため、外野からの返球が弾丸のように速かった。 */
function throwArc(d){ return d>150 ? 1.45 : (d>90 ? 1.20 : 1.0); }
function throwHopTime(d){ return d>150 ? 0.35 : (d>90 ? 0.15 : 0); }
function throwFlightTime(d, arm){
  const v0=throwSpeed(arm, d);
  const th=throwAngle(d, v0);            // 実際の送球(launchThrow)と同じ角度で見積もる
  return d/Math.max(1, v0*Math.cos(th)) + throwHopTime(d);
}
// 野手fが塁bへ投げて、受け手が捕って触れるまでの秒数（中継が要る距離なら中継ぶんを足す）
/* 塁bで実際にプレーが成立するまでの秒数＝カバーの野手がその塁に着くまでの時間。
   投げる本人が一番近ければ、自分で踏みに行く時間。
   誰も入れない塁は 99（＝その塁では勝負にならない）。
   これを見ないと「三塁手が捕って、誰もいない三塁へ投げ、遊撃手が後から着いてセーフ」になる。 */
function coverArrival(b, thrower){
  if(b==='P') return 0;
  const p=throwPoint(b);
  let best=99;
  fielders.forEach(f=>{
    if(f.coverBase!==b && f!==thrower) return;
    const d=Math.hypot(p[0]-f.cx, p[1]-f.cy);
    const t = d<2 ? 0 : F_REACT*0.4 + runTime(f.sp*0.88, d);
    if(t<best) best=t;
  });
  return best;
}
function throwETAof(f, b){
  const p=throwPoint(b);
  const d=Math.hypot(p[0]-f.cx, p[1]-f.cy);
  const reach=throwSpeed(armEff(f), 200), maxD=reach*reach/32.2*0.92;
  const transfer=A.transfer(f.fld,f.cat);
  let t;
  if(d>maxD){                                  // 肩が届かない＝中継が入る
    const d1=maxD*0.62;
    t = transfer + throwFlightTime(d1,armEff(f)) + transfer*0.7 + throwFlightTime(d-d1,armEff(f)) + 0.28;
  }else{
    t = transfer + throwFlightTime(d,armEff(f)) + 0.28;
  }
  // 送球が着いても、塁に人がいなければアウトにはできない。遅い方が成立時刻
  return Math.max(t, coverArrival(b, f)) + 0.12;   // 受けてからタッチするまでの時間
}
function launchThrow(fx,fy,tx,ty,arm){
  const d=Math.max(1,Math.hypot(tx-fx,ty-fy));
  /* 打球の回転を消す。ball オブジェクトは打球から使い回されるため、
     ここで消さないと送球が打球の残り回転で曲がり・浮き、
     一塁への普通の送球が届かなくなる（出塁率33%→60%超の実測主因）。 */
  ball.bs=0; ball.ss=0;
  const v0=throwSpeed(arm, d);   // 肩の強さ＋その距離をどれだけ本気で投げるか
  const th=throwAngle(d, v0);
  const vh=v0*Math.cos(th), vz=v0*Math.sin(th);
  ball.x=fx; ball.y=fy; ball.z=5.4; ball.landed=false; ball.t=0;
  ball.vx=(tx-fx)/d*vh; ball.vy=(ty-fy)/d*vh; ball.vz=vz;
}
/* 送球の投射角。実際の内野送球は相手の胸へ直線的に投げる＝目標地点を捕球の高さ(約5ft)で
   通過する角度を選ぶ。以前は「その距離にちょうど届く山なり」の角度(斜方投射の公式×山なり係数)で、
   90〜150ftの内野送球が目標の真上を高さ7〜9ftで通過していた。受け手は「捕れる高さ(4.5ft)に
   降りてくる地点」＝塁の8〜12ft後方へ迎えに出てしまい、一塁手が毎回ベースの後ろで捕って
   封殺が成立しなくなっていた（録画183359）。150ft超の遠投は今まで通り山なりで届かせる。 */
const _thCache=new Map();
function throwPassHeight(d, v0, th){
  // 送球の2D弾道(stepBallと同じ空気抵抗・重力)で、距離dを通過する時の高さ。届かなければnull
  let x=0, z=5.4, vx=v0*Math.cos(th), vz=v0*Math.sin(th);
  for(let i=0;i<2400;i++){
    const sp=Math.hypot(vx,vz), dr=DRAG*sp;
    vx-=vx*dr*PHYS_H; vz-=vz*dr*PHYS_H; vz-=32.2*PHYS_H;
    x+=vx*PHYS_H; z+=vz*PHYS_H;
    if(x>=d) return z;
    if(z<=0) return null;
  }
  return null;
}
function throwAngle(d, v0){
  /* 目標地点を捕球の高さ(約5ft)で通過する最小の角度を、実際の物理で二分探索。
     閉形式(斜方投射)では空気抵抗(速度比例で内野送球でも約16ft/s²の減速)を賄えず手前に落ちる。
     距離の上限は設けない＝その肩で物理的に届く限り胸の高さへ直線的に投げ、
     届かない時だけ山なり。以前150ftで区切っていたため、右翼→二塁(180ft)などが旧弾道のまま
     目標上空を高さ14ftで通過し、全部が悪送球になっていた（録画202420）。
     結果は距離・初速で丸めてキャッシュ（毎フレームのAI見積りでも重くならない）。 */
  const key=((d/3)|0)*1000 + ((v0/2)|0);
  const hit=_thCache.get(key);
  if(hit!==undefined) return hit;
  let lo=-0.05, hi=0.78;
  for(let k=0;k<16;k++){
    const mid=(lo+hi)/2;
    const z=throwPassHeight(d,v0,mid);
    if(z===null || z<5.0) lo=mid; else hi=mid;
  }
  let th=(lo+hi)/2;
  const z=throwPassHeight(d,v0,th);
  if(z===null || z<=2.0){
    // その初速では低い弾道で目標を通過できない（弱肩の遠投）→山なりで届かせる
    const s=Math.min(0.95, 32.2*d/(v0*v0));
    th=Math.min(0.78, 0.5*Math.asin(s)*throwArc(d));
  }
  _thCache.set(key, th);
  return th;
}
/* その距離を「捕球の高さを通る低い弾道」で投げられるか。山なりでしか届かない距離は
   直接投げず中継へ返すための判定（プロは山なりに投げない＝オーナー指摘、録画220141。
   高いロブはバウンドで受け手の頭を越える事故も起こす）。 */
const _flatCache=new Map();
function throwFlatOK(d, v0){
  const key=((d/3)|0)*1000+((v0/2)|0);
  let hit=_flatCache.get(key);
  if(hit!==undefined) return hit;
  let lo=-0.05, hi=0.78;
  for(let k=0;k<12;k++){ const mid=(lo+hi)/2; const z=throwPassHeight(d,v0,mid);
    if(z===null||z<5.0) lo=mid; else hi=mid; }
  const z=throwPassHeight(d,v0,(lo+hi)/2);
  hit = (z!==null && z>2.0);
  _flatCache.set(key,hit);
  return hit;
}
// 走者が塁bに到達するまでの残り秒数（すでに達していれば0）
// 走者が塁bに着くまでの残り秒数（今の速度から加速することを織り込む）
function runnerETA(r,b){
  if(r.p>=b) return 0;
  const d=(b-r.p)/RUN_SPEED, top=r.sp||23, acc=top/ACC_T, v=r.v||0;
  const tAcc=Math.max(0,(top-v)/acc), dAcc=v*tAcc+0.5*acc*tAcc*tAcc;
  return d<=dAcc ? (Math.sqrt(v*v+2*acc*d)-v)/acc : tAcc+(d-dAcc)/top;
}
/* 帰塁にかかる残り秒数。updateRunners の帰塁は上限が top*0.8 で加速もあるので、
   前進用の runnerETA とは別式が要る。ここを距離÷最高速で見積もると
   待ち時間が足りず、最後に走者が塁へ瞬間移動する。 */
function runnerBackETA(r){
  const d=(r.p-r.goal)/RUN_SPEED; if(d<=0) return 0;
  const top=(r.sp||23)*0.8, acc=(r.sp||23)/ACC_T, v=r.v||0;
  const tAcc=Math.max(0,(top-v)/acc), dAcc=v*tAcc+0.5*acc*tAcc*tAcc;
  return d<=dAcc ? (Math.sqrt(v*v+2*acc*d)-v)/acc : tAcc+(d-dAcc)/top;
}
// 押し出されて必ず進まなければならない走者か
/* 押し出されて必ず進まなければならない走者か。
   後ろの塁が打者走者(origin=0)まで全部埋まっている時だけ強制。
   打者走者がアウトになれば後ろが空くので強制は消える（b=0から見る理由）。 */
function isForced(r){
  for(let b=0;b<r.origin;b++) if(!runners.some(x=>x.origin===b && !x.out)) return false;
  return true;
}
function leadForceTarget(){
  let best=null;
  runners.forEach(r=>{
    if(r.out || r.p>=r.goal) return;
    if(!isForced(r)) return;
    const nb=Math.min(4, r.origin+1);
    if(!best || nb>best.nb) best={nb, r};
  });
  return best;
}
/* 守備の判断。走者が「どこへ行くつもりか」は見えないので使わない。
   見えているのは「今どこにいて、どちらへ走っているか」だけ。そこから、
   間に合う見込みのある一番先の塁を選ぶ。本塁は余裕がある時だけ狙う
   （ぎりぎりで本塁へ投げて間に合わないより、確実に刺せる手前の塁を取る）。
   誰も走っていなければ投手へ返球する。 */
function chooseThrowTarget(f){
  const throwETA=b=>throwETAof(f,b);
  /* 「今動いている走者」だけでなく「押し出されて必ず進む走者」も対象にする。
     押し出しは守備からも見えている事実であり、走り出す一瞬前でも塁は狙える。
     これが無いと、満塁で打った直後の一瞬に「誰も走っていない」と見えて、
     本塁封殺を捨てて一塁や二塁へ投げてしまう。 */
  const live=runners.filter(r=>!r.out && (
    r.dir>0 || (r.origin===0 && r.p<1) || (r.origin>0 && isForced(r) && r.p<r.origin+1)));
  /* 塁間を戻っている走者も刺せる。戻り先の塁へ投げれば間に合う場面を、
     「前へ走っていないから対象外」として見逃していた。 */
  const back=runners.filter(r=>!r.out && r.dir<0 && Math.abs(r.p-Math.round(r.p))>0.06);
  let sure=null, lead=null, fallback=null;
  for(const r of back){
    const b=Math.floor(r.p+1e-9);
    if(b<1) continue;
    if(runnerBackETA({...r, goal:b}) > throwETAof(f,b)+0.05) return {nb:b};
  }
  for(const r of live){
    /* その走者が今向かっている塁から先へ、順に「間に合うか」を見る。
       走者が今どこにいるかではなく、送球が着く頃にどこにいるかで決めるのが要点。
       外野から、まだ一塁に達していない打者走者を見て一塁へ投げると、
       送球が着く頃には二塁を回っている＝完全な無駄になる。 */
    /* 内野からは「その走者が今向かっている塁」だけを狙う。
       その先まで見ると、一塁へ走っているだけの打者走者を二塁で刺そうとしたり、
       三塁へ向かう走者を見て本塁へ投げたりする（実際にそうなっていた）。
       外野からは送球に時間がかかるので、着く頃の位置＝1つ先まで見る。 */
    /* 封じられていない走者は、投げた先へ着く前に元の塁へ戻れる。
       戻れる走者を狙って投げると、その走者は戻って、打者走者は一塁でセーフになる
       ＝誰もアウトにならない（1死二塁の内野ゴロで毎回三塁へ投げていた原因）。
       狙ってよいのは「もう戻れないところまで来ている走者」だけ。
       戻る時間より送球が早く着くなら、その走者は帰塁でも刺せる＝踏み切っている。 */
    const forced = isForced(r) || r.origin===0;
    if(!forced){
      const homeB = Math.floor(r.p+1e-9);
      /* 「踏み切っている」の判定は2通り。
         (a) 全力で前へ走っている（向き＋速度、どちらも守備から見える）——
             帰塁ETAだけで見ると、全力疾走中でも「まだ戻れる」と読んでしまい、
             本塁勝負を捨てて1点を献上した（録画で確認）
         (b) もう塁へ戻る時間がない */
      const sprinting = r.dir>0 && (r.v||0) > 0.6*(r.sp||24);
      const committed = sprinting || (homeB>=1 &&
        runnerBackETA({...r, goal:homeB}) > throwETAof(f,homeB) - 0.15);
      if(!committed) continue;                    // 塁の近くで様子見の走者は狙わない
    }
    const nextB = Math.min(4, Math.floor(r.p+1e-9)+1);
    const bMax = (Math.hypot(f.cx,f.cy) < 158) ? nextB : 4;
    const leadR = runners.filter(x=>!x.out && x.p<4-1e-9).sort((a,b)=>b.p-a.p)[0];
    for(let b=nextB; b<=bMax; b++){
      const te=throwETA(b), re=runnerETA(r,b);
      /* 「その先の塁」は、走者が実際にそこへ走るかを走者側と同じ物差し(safeReachのslack)で
         判定してから勝負する。走らない塁へ投げても何も起きない。
         以前は「余裕2秒以内なら勝負」という緩い門番で、二塁で止まる打者走者を
         「三塁なら余裕1.65秒で刺せる」と誤読し、誰も向かっていない三塁へ投げていた
         （録画183631: 二塁に投げれば打者を刺せた場面）。
         走者が今まさに向かっている最初の塁(nextB)は必ず勝負の対象。 */
      if(b>nextB){
        const slack=(r===leadR)?0.55:1.35;
        if(re >= te + slack) break;      // 走者は自重する＝その塁の勝負は存在しない
      }
      const m = re - te - ((b===4)?0.35:0.05);
      if(m>0){                                    // ここなら刺せる
        /* 候補は2種類ためる。
           sure=一番確実にアウトにできる塁（余裕が最大） / lead=はっきり刺せる一番先の塁。
           2アウトならどこでアウトにしても攻撃終了なので sure を採る。
           それ以外は前の走者を止めたいので lead を優先するが、
           lead に数えるのは余裕がはっきりある送球だけにする
           （きわどい賭けで先の塁へ投げ、結局どこもアウトにならないのを防ぐ）。 */
        if(!sure || m>sure.m) sure={nb:b, m};
        if(m > (forced?0.05:0.30) && (!lead || b>lead.nb)) lead={nb:b, m};
        break;
      }
      /* 刺せない塁の中では「一番惜しい塁」を控えにする。
         先頭走者の行き先を機械的に選ぶと、満塁で明らかに間に合わない本塁へ投げてしまう。 */
      if(!fallback || m>fallback.m) fallback={nb:b, m};
      if(re > te-0.7) break;                      // これ以上先は論外
    }
  }
  const pick = (baseOuts()>=2) ? (sure||lead) : (lead||sure);
  if(pick) return {nb:pick.nb};
  if(fallback){
    /* どこにも勝負が無い時の送球先。走者が余裕で先に着く塁（0.6秒超の負け）へ後追いで
       投げても意味がない（単打で打者到達済みの一塁へ207ft投げていた＝録画203729）。
       1つ先の塁へ投げて、次の進塁を牽制する（実際の外野手の「先の塁へ返す」動き）。
       ★外野手（本塁から158ft超）だけに適用する。内野ゴロの打者は一塁で止まるので、
       内野手がこれをやると誰も向かっていない二塁へ投げる（録画210048=遊ゴロで二塁送球、
       封殺テスト20/20→0/20の崩壊としても検出）。適用条件を持たない行動ルールを
       全野手共通の判断関数に足したことが真因＝場面パッチには必ず適用条件を付ける。
       内野手は負けていてもそのまま塁へ投げる＝駆け抜け・間一髪の絵として自然。 */
    const isOF = Math.hypot(f.cx,f.cy) >= 158;
    const nb = (isOF && fallback.m < -0.6) ? Math.min(4, fallback.nb+1) : fallback.nb;
    return {nb};
  }
  return {nb:'P'};
}
/* その走者が「送球に勝てる」一番先の塁。塁打数を先に決めて配るのではなく、
   実際の足と実際の送球の速さを比べて決める。
   以前は打球の回収にかかった秒数だけで塁打数を決め、その塁までは無条件セーフにしていた。
   そのため「明らかにアウトのタイミングなのに、野手が捕った時点でスリーベースが確定して
   プレーが打ち切られる」という見え方になっていた。 */
function safeReach(r, f){
  /* 守備は一度に1か所へしか投げられない。前を走る走者への送球で手一杯なら、
     後ろの走者はその分だけ余裕がある。先頭以外の走者はこの猶予を見込んで走る。 */
  const lead=runners.filter(x=>!x.out && x.p<4-1e-9).sort((a,b)=>b.p-a.p)[0];
  /* 先頭の走者にも少しだけ余裕を見る。実際の走塁でも、間一髪なら回す（送球が逸れる・
     捕り損ねる可能性があるため）。ここを0にすると確実な時しか走らず、単打で誰も還れない。 */
  const slack=(r===lead)?0.55:1.35;
  let best=Math.max(r.origin, Math.floor(r.p+1e-9));
  for(let b=best+1; b<=4; b++){
    if(runnerETA(r,b) < throwETAof(f,b)+slack) best=b; else break;
  }
  return best;
}
/* 塁間に取り残されていて、どちらの塁へ投げても刺せない走者を返す。
   こういう走者には投げてはいけない。投げた瞬間、反対側の塁へ楽に進まれる。
   ボールを持ったまま詰め寄り、どちらへ投げても間に合う距離にしてから勝負する。 */
function trappedRunner(f){
  const live=runners.filter(r=>!r.out && r.origin>0 && r.p>0.12 && r.p<3.95);
  for(const r of live){
    const lo=Math.floor(r.p+1e-9), hi=Math.min(4, lo+1);
    const frac=r.p-lo;
    /* 塁の間の真ん中あたりで迷っている走者だけが対象。
       塁に寄っている走者や、すでに全速で片方へ向かっている走者は「詰まって」いないので、
       歩いて近づくのではなく普通に投げる。 */
    if(frac < 0.30 || frac > 0.70) continue;
    if((r.v||0) > 0.55*(r.sp||23)) continue;           // 全速で走っている＝行き先は決まっている
    const rp=runnerPos(r);
    if(Math.hypot(rp.x-f.cx, rp.z-f.cy) > 80) continue; // 遠すぎる。歩いて詰める距離ではない
    const back={...r, goal:lo}, fwd={...r, goal:hi};
    const canLo = runnerBackETA(back) > throwETAof(f,lo);
    const canHi = runnerETA(fwd,hi)   > throwETAof(f,hi);
    if(!canLo && !canHi) return r;                     // どちらへ投げても逃げられる
  }
  return null;
}
function beginThrowPhase(f, kind, award, flyLead){
  // 走者の行き先を決める（外野なら送球に勝てる塁まで、内野なら詰まっている走者が1つ）
  /* ★前の走者から順に決め、追い越しを禁止する。safeReachは走者ごとに独立で、
     前の走者が二塁で止まるのに打者へ「二塁まで行ける」を配っていた
     （録画211639: レフト前で二塁に走者が居座る中、打者が二塁へ来て挟まれた）。
     押し出し（打者は一塁必達・封じられた走者は次の塁必達）は下限として保証する。 */
  if(kind!=='fly'){
    const rs=runners.filter(r=>!r.out).sort((a,b)=>b.p-a.p);
    let aheadGoal=99;
    rs.forEach(r=>{
      let auto = (kind==='outfield')
        ? safeReach(r, f)
        : ((r.origin===0 || isForced(r) || baseOuts()>=2) ? Math.min(4, r.origin+1) : r.origin);
      if(aheadGoal<4) auto=Math.min(auto, aheadGoal-1);
      const floorBase = (r.origin===0) ? 1
                      : (isForced(r) ? r.origin+1 : Math.max(r.origin, Math.floor(r.p+1e-9)));
      auto=Math.max(auto, floorBase);
      r.safeGoal = auto;                 // 自動で狙う塁（無条件セーフの意味ではない）
      setAutoGoal(r, auto);              // 手動の指示はこの上に足される
      aheadGoal = (auto<4) ? auto : 99;  // 本塁は何人でも入れる
    });
  }
  /* 送球先は「間に合う見込みのある一番先の塁」。
     見込みが無いのに本塁へ投げると走者が必ず刺されてしまい、単打で誰も還れなくなる
     （実際にそうなっていた）。届かないと分かっている塁には投げない。 */
  let tgt = chooseThrowTarget(f);
  /* フライ捕球後は「離塁していた走者の元の塁」へ投げて離塁アウトを狙う。
     狙う走者がいなければ投手へ返球して終わり。 */
  if(kind==='fly') tgt = flyLead ? {nb: flyLead.mustReturn ? flyLead.origin : Math.min(4,flyLead.origin+1)} : {nb:'P'};
  // 守備側（あなた）が送球先を指定していればそれを優先する
  if(!isPlayerBatting() && manualThrow!=null) tgt = {nb: manualThrow};   // 'P'は投手のまま渡す
  throwPlay = {
    /* フライを捕った野手の名前。結果表示は「捕った人」で作る。
       表示時にその時点のボール保持者(thrower)を使うと、返球を経た後に
       「右フライ」が「投フライ」に化ける（録画で確認）。 */
    flyBy: kind==='fly' ? f.n : null,
    stage:'transfer', t:0,
    /* 持ち替え時間 = 守備力（捕ってから投げるまでの動作の速さ）＋捕球（握り直しの確実さ）。
       捕球が低いと一定確率で捕り損ね、さらに時間がかかる。 */
    transfer: A.transfer(f.fld,f.cat) + rnd(0,0.10)
              + (Math.random()<A.fumble(f.cat) ? rnd(0.55,1.15) : 0),
    thrower:f, kind, award,
    target: tgt ? tgt.nb : 1,
    relayed:false,
    fieldT: ball.t
  };
  ball.vx=0; ball.vy=0; ball.vz=0; ball.z=4.6;
  ball.x=f.cx; ball.y=f.cy;
  S.phase='throwing';
  if(kind!=='fly') setMsg('','');   // フライは捕球時に出したアウト表示を消さない
}
/* ボールを持っている野手が、塁を離れている走者に触れたらアウト。
   野球では塁上でなくても、塁間にいる走者はタッチされた時点でアウトになる。
   これまで挟殺プレーの中でしか判定していなかったため、
   ボールを持った野手のすぐ横を走者が通り抜けても何も起きなかった。 */
function tagNearbyRunner(holder){
  if(!holder) return null;
  for(const r of runners){
    if(r.out) continue;
    /* 塁に触れていればセーフ。ただし押し出されている走者はその塁の権利を失っているので、
       元の塁の上にいてもタッチでアウトにできる（野球規則5.06(a)(1)）。 */
    const forcedOff = r.origin>0 && isForced(r) && Math.round(r.p)===r.origin;
    if(!forcedOff && Math.abs(r.p-Math.round(r.p))<0.012) continue;
    if(r.p>=4-1e-6) continue;                            // 生還済み
    const q=runnerPos(r);
    if(Math.hypot(holder.cx-q.x, holder.cy-q.z) < 3.0){ markOut(r,'tag'); return r; }
  }
  return null;
}
function updateThrowPhase(dt){
  const T=throwPlay;
  T.t+=dt;
  /* プレー全体の打ち切り。切り返しの送球が延々と続いて決着しない場面があった
     （三塁走者が本塁と三塁の間を往復し、そのたびに新しい送球が始まって19秒続く）。
     実際の野球でも決着がつかなければ走者は塁に戻って終わる。 */
  S.playClock=(S.playClock||0)+dt;
  /* 挟殺は自前の時間制限(updateRundown の R.t>9)を持っているので、
     プレー全体の打ち切りでは止めない。ここで一律に切っていたため、
     追い込んでいる途中の挟殺が強制的にセーフで終わっていた。
     それでも終わらない時のための最後の歯止めだけ、うんと長い所に残す。 */
  const inRundown = (T.stage==='rundown');
  if(S.playClock > (inRundown?24:12)){
    if(inRundown) return endRundown('セーフ！','#3fd66a');
    return concludePlay();
  }
  /* 投手へ返すだけになり、走者も全員止まっているなら、そこでプレーは終わり。
     ボールが投手の手に戻るまで待っていたため、走者が一塁に着いて何も起きていないのに
     さらに6秒待たされていた（ポテンヒットで1プレー13秒）。 */
  /* ただしフライ捕球の直後だけは、すぐに閉じない。タッチアップは捕った“後”に走り出すもので、
     ここで即座に打ち切ると、捕球前からSを押していないとタッチアップできなくなる。
     走者がいる時は1.5秒だけ判断の間を置く。 */
  const flyWait = (T.kind==='fly' && runners.some(r=>!r.out && r.origin>0 && r.origin<4) && T.t<1.5);
  /* 走者が塁間にいる間はプレーを閉じない（塁の上に着いていることまで確認する）。
     走塁キーを押している間も閉じない。次の塁を狙おうとしているのに
     プレーを終わらせてしまうと、操作が効かなかったように見える。 */
  const keyHeld = isPlayerBatting() && (held['s']||held['z']||held['x']);
  const allSettled = runners.every(r=> r.out ||
    (Math.abs(r.p-r.goal)<0.02 && Math.abs(r.p-Math.round(r.p))<0.02));
  if(T.target==='P' && T.stage!=='rundown' && !flyWait && !keyHeld && allSettled) return concludePlay();
  updateRunners(dt);
  moveFielders(dt,true);
  /* ボールを持っている野手は誰か。持っている間はいつでもタッチが成立する。 */
  const holder = (T.stage==='transfer'||T.stage==='step'||T.stage==='approach') ? T.thrower
               : (T.stage==='catch') ? T.receiver
               : (T.stage==='rundown' && T.rd && T.rd.sub==='chase') ? T.rd.holder : null;
  if(holder){          // フライ捕球後も、塁を離れている走者にはタッチが成立する
    const tagged = tagNearbyRunner(holder);
    if(tagged){
      if(T.stage==='rundown') return endRundown('タッチアウト！','#95a3b4');
      /* タッチした後もアウトを取れる走者が残っていれば、送球して続ける。
         1つ目のアウトでプレーを終えていたため、続く併殺を毎回捨てていた。 */
      /* 本塁へ向かっている走者がいる限り、プレーは終わっていない。
         打者走者をアウトにした時点で閉じていたため、三塁走者が本塁の手前60%の所にいるのに
         「1点」と確定してプレーが打ち切られていた（録画で確認）。 */
      let nxt = (baseOuts()+countOuts()<3) ? chooseThrowTarget(holder) : null;
      const homing = runners.find(r=>!r.out && r.goal>=3.99 && r.p<3.97 && r.p>2.0);
      if(homing && baseOuts()+countOuts()<3 && (!nxt || nxt.nb==='P')) nxt={nb:4};
      if(nxt && nxt.nb!=='P'){
        T.thrower=holder; T.target=nxt.nb; T.stage='transfer'; T.t=0;
        T.stepChecked=false; T.relayed=true;      // 追加の送球（併殺の2つ目）
        T.transfer=A.transfer(holder.fld,holder.cat)*0.75+0.16;
        return;
      }
      /* 打者走者を一塁到達前にアウトにしたものは、触っていても普通のゴロアウト。
         「二ゴロ → タッチアウト！」と出ていて不自然だった。 */
      if(!(tagged.origin===0 && tagged.p<1-1e-9)){ T.rdText='タッチアウト！'; T.rdColor='#95a3b4'; }
      return concludePlay();
    }
  }

  if(T.stage==='transfer'){
    ball.x=T.thrower.cx; ball.y=T.thrower.cy; ball.z=4.6;
    /* 自分で塁を踏むなら持ち替えは要らない（握り直さず、そのまま踏みに行く）。
       持ち替えを待ってから歩き出していたため、投げるより遅くなってセーフになっていた。
       カバーがすでに塁に入っているなら、自分で行かずに投げる。 */
    if(!T.stepChecked && T.target!=='P' && T.kind!=='fly' && T.kind!=='steal'){
      T.stepChecked=true;
      const tp0=throwPoint(T.target);
      const my=Math.hypot(tp0[0]-T.thrower.cx, tp0[1]-T.thrower.cy);
      const mine=runTime(T.thrower.sp*0.88, my);
      const cov=coverArrival(T.target, null);
      if(my<30 && mine < cov + T.transfer){
        setTarget(T.thrower, tp0[0], tp0[1]);
        T.receiver=T.thrower; T.dest=tp0;
        T.stage='step'; T.t=0;
        return;
      }
    }
    if(T.t>=T.transfer){
      /* 投げる瞬間に、その時点の走者の位置で投げ先を決め直す。
         捕った時の判断のまま投げると、中継が受け取ってから投げ直す時に
         1〜2秒前の状況へ投げてしまう（二塁を狙う走者がいるのに一塁へ投げる、等）。 */
      /* 牽制は投げる先が決まっている（飛び出した走者の塁）。ここに含めていたため、
         「戻れる走者は狙わない」という打球用の判断が牽制にも働き、
         送球先が投手に書き換わって塁に誰も入らず、走者が悠々と次の塁へ進んでいた。 */
      if(T.kind!=='fly' && T.kind!=='steal' && T.kind!=='pickoff'
         && !T.relayed && !(!isPlayerBatting() && manualThrow!=null)){
        const t2=chooseThrowTarget(T.thrower); if(t2) T.target=t2.nb;
      }
      /* 自分が送球先の塁のすぐそばにいるなら投げない（自分で塁を踏む）。
         一塁手が誰もいない一塁へ投げる、といった不自然な動きを防ぐ。 */
      const tp=throwPoint(T.target);
      /* 自分がカバーより早く塁に着けるなら投げずに自分で踏む。
         固定距離で決めると、三塁手が三塁のすぐ近くにいても投げてしまう。 */
      const myStep = Math.hypot(tp[0]-T.thrower.cx, tp[1]-T.thrower.cy);
      if(T.target!=='P' && myStep < 6){          // 目の前の塁は自分で踏む
        setTarget(T.thrower, tp[0], tp[1]);
        T.receiver=T.thrower; T.dest=tp;
        T.stage='step'; T.t=0;
        return;
      }
      /* 塁間の走者を、どちらの塁へ投げても刺せない時は投げない。
         ボールを持ったまま走者へ詰め、どちらへ投げても間に合う距離にしてから動く。
         いきなり投げると、投げた反対側の塁へ楽に進まれてしまう。 */
      const trap = trappedRunner(T.thrower);
      if(trap && T.kind!=='fly' && !T.relayed){
        T.stage='approach'; T.trap=trap; T.t=0; return;
      }
      /* 送球の回数にも上限を置く。走者が塁間を行き来するたびに投げ続け、
         決着しないまま20秒近く続く場面があった。実際の守備も、アウトが取れないと
         分かった時点で投手へ返して終わりにする。 */
      S.throwCount=(S.throwCount||0)+1;
      if(S.throwCount>6 && T.stage!=='rundown') T.target='P';
      // 投手への返球は投手本人が受ける。それ以外はカバーに入っている野手が受ける
      let recv = (T.target==='P') ? fielders.find(f=>f.n==='投') : coverOf(T.target, T.thrower);
      let p = (T.target==='P' && recv) ? [recv.cx, recv.cy] : throwPoint(T.target);
      /* 肩が届かない距離は中継に入れる。届かない送球をそのまま投げると、
         手前で落ちて誰も取りに行かないまま止まってしまう。 */
      const far=Math.hypot(p[0]-T.thrower.cx, p[1]-T.thrower.cy);
      const reachable=throwSpeed(armEff(T.thrower), 200);
      const maxD=reachable*reachable/32.2*0.92;          // その初速で届く最大距離
      /* 中継に入れる条件は「物理的に届かない」ではなく「低い弾道で届かない」。
         届きさえすれば高い山なりを直接投げていたため、バウンドが受け手の頭を越え、
         プロなら中継に返す場面で緩いロブが飛んでいた（録画220141、オーナー指摘
         「深い位置からは中継に返球する」）。 */
      if(far>maxD || !throwFlatOK(far, throwSpeed(armEff(T.thrower), far))){
        /* 中継はベースカバーに入っていない野手を優先する。カバー中の野手を引き抜くと
           返球の間その塁が無人になる。他に居なければ引き抜くが、その塁は別の野手が埋める。 */
        const pick = (freeOnly)=>{ let cut=null,cd=1e9;
          fielders.forEach(f=>{ if(f===T.thrower) return;
            if(freeOnly && f.coverBase!=null) return;
            const t=Math.hypot(p[0]-f.cx,p[1]-f.cy)+Math.hypot(f.cx-T.thrower.cx,f.cy-T.thrower.cy);
            if(t<cd && Math.hypot(f.cx-T.thrower.cx,f.cy-T.thrower.cy)<maxD){ cd=t; cut=f; } });
          return cut; };
        const cut = pick(true) || pick(false);
        if(cut){
          const freed = cut.coverBase;
          cut.coverBase=null;
          recv=cut; p=[cut.cx,cut.cy]; T.relayTo=T.target;
          if(freed!=null) rundownCover(freed, cut);      // 抜けた塁は別の野手が埋める
        }
      }
      /* 送球のそれ。送球精度(送)が低いほど狙いから外れる。判定の基準点(T.dest)は
         塁のままにして、ボールだけがそれる（それた球は受け手の居残り判定・迎え・chaseが処理）。 */
      const farLaunch=Math.hypot(p[0]-T.thrower.cx, p[1]-T.thrower.cy);
      const off=throwOffset(T.thrower, farLaunch);
      launchThrow(T.thrower.cx,T.thrower.cy,p[0]+off[0],p[1]+off[1],armEff(T.thrower));
      if(recv) setTarget(recv,p[0],p[1]);   // 受け手は送球先で待つ（投手も同じ）
      /* カットオフ（セオリー準拠 2026-08-04導入）: 外野からの本塁送球は、
         左翼側=三塁手／中堅・右翼側=一塁手が「外野手と本塁の直線上」約45ftに入る。
         今は位置取り（見た目とこぼれ球の回収圏）のみで、送球の切り取り判断は次段。 */
      if(T.target===4 && farLaunch>158){
        const cutN = (T.thrower.cx < -30) ? '三' : '一';
        const cut = fielders.find(x=>x.n===cutN);
        if(cut && cut!==T.thrower && cut!==recv && !cut.primary){
          const cd = Math.max(1, Math.hypot(T.thrower.cx-p[0], T.thrower.cy-p[1]));
          cut.coverBase=null;
          setTarget(cut, p[0]+(T.thrower.cx-p[0])/cd*45, p[1]+(T.thrower.cy-p[1])/cd*45);
        }
      }
      /* バックアップ。手の空いた野手1人が送球線の延長20ft後方へ入る（実際の野球の基本動作）。
         それた球を後ろで止める人が誰もおらず、悪送球のたびに大きく転がっていた
         （録画202420、オーナー指摘「他の内野手がカバーに入っているべき」）。 */
      if(farLaunch>1){
        const bx=p[0]+(p[0]-T.thrower.cx)/farLaunch*20, by=p[1]+(p[1]-T.thrower.cy)/farLaunch*20;
        let bu=null, bd=1e9;
        fielders.forEach(f=>{
          if(f===T.thrower || f===recv || f.coverBase!=null || f.primary) return;
          const dd=Math.hypot(bx-f.cx, by-f.cy);
          if(dd<bd){ bd=dd; bu=f; }
        });
        if(bu && bd<110) setTarget(bu, bx, by);
      }
      T.receiver=recv;
      T.stage='fly'; T.t=0; T.dest=p;
    }
    return;
  }
  if(T.stage==='fly'){
    let acc=Math.min(0.30,(T.acc||0)+dt), g=0;
    while(acc>=PHYS_H && g++<900){ acc-=PHYS_H; stepBall(ball,PHYS_H); ball.t+=PHYS_H; }
    T.acc=acc;
    trail.push([ball.x,ball.z,ball.y]); if(trail.length>18) trail.shift();
    /* 受け手は送球の「実際に来る場所」へ寄って捕る。多少それた送球は捕る側が
       動いて処理するのが普通で、塁の上で棒立ちのまま「それた判定」を待たない
       （録画で指摘のあった不具合）。0.2秒ごとに軌道を先読みして立ち位置を直す。 */
    if(!T.chased && T.receiver && ball.t > (T.meetT||0)+0.20){
      T.meetT=ball.t;
      /* 塁を離れて迎えに出るかは「塁上で捕れるか」で決める。
         塁の最接近時に (a)横のずれがグラブ圏内5ft (b)高さが跳んで届く8.5ft以下 なら塁上で捕れる
         ＝ベースに残る。以前は「捕球の高さ4.5ftまで降りてくる地点」を目標にしていたため、
         胸の高さで塁上を通過する普通の送球でも、その降下点＝塁の後方へ迎えに出てしまい、
         一塁手が毎回ベースの後ろで捕って封殺が不成立になっていた（録画183359）。
         本当にそれた送球だけ、捕れる高さに降りる地点へ迎えに出る（chase側の回収と併用）。 */
      const pb={x:ball.x,y:ball.y,z:ball.z,vx:ball.vx,vy:ball.vy,vz:ball.vz,bs:0,ss:0};
      let bestD=1e9, bestZ=0, land=null;
      for(let i=0;i<480;i++){
        stepBall(pb,PHYS_H);
        const dd=Math.hypot(pb.x-T.dest[0], pb.y-T.dest[1]);
        if(dd<bestD){ bestD=dd; bestZ=pb.z; }
        if(!land && pb.z<=4.5) land=[pb.x,pb.y];
        if(pb.z<=0.1 && Math.hypot(pb.vx,pb.vy)<3) break;
      }
      if(bestD<5 && bestZ<=8.5) setTarget(T.receiver, T.dest[0], T.dest[1]);   // 塁上で捕れる＝残る
      else if(land && Math.hypot(land[0]-T.dest[0], land[1]-T.dest[1])<26)
        setTarget(T.receiver, land[0], land[1]);   // 大きく外れた球は追わない（chase側が拾う）
    }
    let d=Math.hypot(ball.x-T.dest[0], ball.y-T.dest[1]);
    /* 捕球の発火は「受け手との距離」で見る。塁との距離で見ていたため、
       塁から5ft超それた送球は、受け手が降下点で構えていても目の前を素通りしていた
       （録画205904: 本塁への返球が6.7ftずれ→捕手の前を抜けてバックネットへ。
       「本塁への送球がほぼ確実にそれる」の正体）。受け手が動いて捕るのが実際の野球。 */
    let dRecv = T.receiver ? Math.hypot(ball.x-T.receiver.cx, ball.y-T.receiver.cy) : d;
    /* それた球の回収は「頭上を越えた/着弾した」瞬間に始める。発射から2.6秒の固定待ちだと、
       通過してから1秒以上誰も反応しない（録画202420、オーナー指摘「取りに行くべき」）。 */
    if(!T.chased && dRecv>=5 && (T.sailed || ball.landed || T.t>2.6)) T.chased=true;
    if(T.chased){
      /* それた球の回収は「一番近い野手」。受け手固定だと、遠い受け手が
         延々と追いかけ、すぐ横の野手が突っ立って見ている（録画で確認）。 */
      let best=T.receiver, bd=1e9;
      fielders.forEach(f=>{ const q=Math.hypot(ball.x-f.cx,ball.y-f.cy);
        if(q<bd){ bd=q; best=f; } });
      T.receiver=best;
      setTarget(T.receiver, ball.x, ball.y);
      dRecv=Math.hypot(ball.x-T.receiver.cx, ball.y-T.receiver.cy);
      T.dest=[ball.x,ball.y];
    }
    if(T.chased && T.t>8) return concludePlay();   // 収拾できなければプレーを閉じる
    /* 高さも見る。横の距離だけで捕球としていたため、受け手の頭のはるか上（19ft）を
       通過している送球まで吸い込まれていた（録画で確認）。
       跳んで届くのは約9ftまで。それより高い送球はそのまま頭上を越えていく＝悪送球。 */
    /* 頭上を越える高さの送球はそのまま通過させる。ただし肩が弱くて山なりになっただけの
       送球までエラーとして数えない（記録が実際よりずっと多くなっていた）。
       エラーにするのは「まっすぐ投げられる距離なのに大きく外した」時だけ。 */
    if(dRecv<5 && ball.z>9.5){
      if(!T.sailed){ T.sailed=true;
        const far=Math.hypot(T.dest[0]-T.thrower.cx, T.dest[1]-T.thrower.cy);
        if(far < 110) S.errorBy=(T.thrower.name||T.thrower.n); }
      return;                                      // 通り過ぎさせる（この後 chased で拾いに行く）
    }
    if(dRecv<5 && ball.z<=9.5){
      // 受け手が捕って塁に触れるまでの間。送球がずれるほど手間取る
      T.stage='catch'; T.t=0;
      T.catchDur = rnd(0.04,0.30)*(1.30-armEff(T.thrower))*2.0;
      /* 捕った瞬間に球を手へ固定する。次フレームのタッチ判定→即終了が
         捕球スナップより先に走ると、飛行速度が残ったままプレーが締まり、
         捕った球が幽霊のように飛び続けていた（録画215858「悪送球なのにチェンジ」＝
         実際は正規の捕球アウトで、見た目だけが後ろへ飛んでいた）。 */
      if(T.receiver){ ball.x=T.receiver.cx; ball.y=T.receiver.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0; }
    }
    return;
  }
  /* ボールを持ったまま走者へ詰め寄る段階。どちらの塁へ投げても間に合う距離まで近づいたら
     挟殺プレーに入る。走者が塁へ逃げ切れる状況で先に投げると、必ず反対側へ進まれる。 */
  if(T.stage==='approach'){
    const r=T.trap;
    ball.x=T.thrower.cx; ball.y=T.thrower.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0;
    updateRunners(dt); moveFielders(dt,true);
    if(r.out || Math.abs(r.p-Math.round(r.p))<0.03){    // 走者が塁に着いてしまった
      T.stage='transfer'; T.t=0; T.stepChecked=false; return;
    }
    const rp=runnerPos(r);
    setTarget(T.thrower, rp.x, rp.z);
    const lo=Math.floor(r.p+1e-9), hi=Math.min(4, lo+1);
    const back={...r, goal:lo}, fwd={...r, goal:hi};
    const canLo = runnerBackETA(back) > throwETAof(T.thrower,lo);
    const canHi = runnerETA(fwd,hi)   > throwETAof(T.thrower,hi);
    const near = Math.hypot(rp.x-T.thrower.cx, rp.z-T.thrower.cy);
    if((canLo && canHi) || near<26 || T.t>4.5){
      T.receiver=T.thrower;
      return beginRundown(r, hi);
    }
    return;
  }
  /* ボールを持った野手が自分で塁を踏みに行く段階。
     踏む前にアウトを宣告してはいけない（遊撃手が二塁を踏む前に併殺が成立していた）。 */
  if(T.stage==='step'){
    ball.x=T.thrower.cx; ball.y=T.thrower.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0;
    if(Math.hypot(T.dest[0]-T.thrower.cx, T.dest[1]-T.thrower.cy) < 1.6 || T.t>2.2)
      return judgeAtBase(T.target);
    return;
  }
  if(T.stage==='catch'){
    // 受け取ったボールは野手の手の中にある（宙に浮いたまま止まって見えないように）
    if(T.receiver){ ball.x=T.receiver.cx; ball.y=T.receiver.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0; }
    if(T.t>=T.catchDur){
      if(T.relayTo!=null){                 // 中継を受けた野手が本来の塁へ投げ直す
        const nx=T.relayTo; T.relayTo=null; T.thrower=T.receiver||T.thrower;
        T.target=nx; T.stage='transfer'; T.t=0;
        T.transfer=A.transfer(T.thrower.fld,T.thrower.cat)*0.7+0.12;
        return;
      }
      /* 受け手がまだ塁に着いていなければ、着くまでアウトにしない。
         送球が塁の上空を通っただけでアウトになるのを防ぐ。
         待つ間、受け手は塁へ踏みに行く。これが無いと、送球を迎えに出て捕った受け手が
         捕った場所に立ち尽くしたまま保留が時間切れ(3.6秒)になり、
         間に合っていた封殺が全て内野安打になっていた（ゴロ安打率69%の主因）。 */
      if(T.target!=='P' && T.receiver && T.dest && T.t<3.6 &&
         Math.hypot(T.dest[0]-T.receiver.cx, T.dest[1]-T.receiver.cy) > 1.8){
        setTarget(T.receiver, T.dest[0], T.dest[1]);
        return;
      }
      return judgeAtBase(T.target);
    }
    return;
  }
  if(T.stage==='rundown') return updateRundown(dt);
}
/* ===== 挟殺プレー（ランダウン） =====
   走者が塁間で捕まったら、即アウトにせず追い込む。
   ボールを持った野手が走者に詰め、走者が逃げ切りそうになったら反対の塁へ送球して切り返す。
   タッチが届けばアウト、走者が塁に戻れればセーフ。送球を弾けば走者が助かる。 */
/* 挟殺で使うカバー。打った瞬間の割り当てではなく「今その塁に一番近い野手」を選ぶ。
   挟殺は野手が入れ替わりながら追い込むプレーで、最初の担当がボールを持って
   反対側にいることが普通にある。割り当て固定だと誰もいない塁へ投げてしまう。 */
function rundownCover(base, exclude, exclude2){
  const p=throwPoint(base);
  let best=null,bd=1e9;
  fielders.forEach(f=>{ if(f===exclude || f===exclude2) return;
    const d=Math.hypot(p[0]-f.cx,p[1]-f.cy); if(d<bd){bd=d;best=f;} });
  if(best){ best.coverBase=base; setTarget(best,p[0],p[1]); }
  return best||fielders[0];
}
function coverOf(base, exclude){
  /* その塁のカバーに入っている野手が受け手。打った瞬間に割り当ててある。
     「今その塁に一番近い人」で選ぶと、たまたま近くにいただけの投手が受け手になり、
     実際には50ft離れているのに塁上でアウトが宣告される。 */
  const assigned=fielders.find(f=>f!==exclude && f.coverBase===base);
  if(assigned) return assigned;
  const p=throwPoint(base);
  let best=null,bd=1e9;
  fielders.forEach(f=>{ if(f===exclude) return;
    const d=Math.hypot(p[0]-f.cx,p[1]-f.cy); if(d<bd){bd=d;best=f;} });
  return best||fielders[0];
}
function beginRundown(r, hi){
  const T=throwPlay;
  const lo=Math.max(1,hi-1);
  T.stage='rundown';
  // loLim/hiLim = 走者が使える範囲。切り返しのたびに両側の野手が詰めてきて狭くなる
  // 保持者は実際に送球を受けた野手。塁に近いだけの別人にするとボールが瞬間移動する
  T.rd={ r, hi, lo, loLim:lo, hiLim:hi, holder:(T.receiver||T.thrower), sub:'chase', t:0, ex:0 };
  // 挟殺が始まったら、両側の塁にそれぞれ別の野手が入る（遊撃手・三塁手も加わる）
  const hiCover = rundownCover(hi, T.rd.holder);
  rundownCover(lo, T.rd.holder, hiCover);      // 反対側には別の野手を入れる
  r.extra=0; setAutoGoal(r, lo);            // まず戻ろうとする
  setMsg('挟まれた！','', '#ffc23d');
}
function updateRundown(dt){
  /* 走者と野手の移動は呼び出し元(updateThrowPhase)が既に1回行っている。
     ここで再度呼ぶと1フレームに2回動いてしまう（速度が2倍になる）ので呼ばない。 */
  const T=throwPlay, R=T.rd, r=R.r;
  R.t+=dt;
  const rp=runnerPos(r);

  if(R.sub==='chase'){
    ball.x=R.holder.cx; ball.y=R.holder.cy; ball.z=4.4;
    /* 走者の背中を追うだけでは同じ足の速さなら永久に追いつけない。
       実際の野手と同じく、走者の進路の少し先（8ft先）を目がけて塞ぎに行く。 */
    const ahead={...r, p: clamp(r.p + (r.goal>r.p?0.09:-0.09), 0, 4)};
    const ap=runnerPos(ahead);
    setTarget(R.holder, ap.x, ap.z);
    /* 塁に到達したかを先に見る。タッチ判定を先に行うと、同じフレームで塁に着いていても
       野手が近いというだけでアウトになってしまう（到達が先ならセーフが正しい）。 */
    if(R.t>0.25 && Math.abs(r.p-r.goal)<0.02 && Math.abs(r.goal-Math.round(r.goal))<0.01)
      return endRundown('セーフ！','#3fd66a');
    if(Math.hypot(R.holder.cx-rp.x, R.holder.cy-rp.z) < 3.0){
      markOut(r,'tag'); return endRundown('タッチアウト！','#95a3b4');
    }
    // 逃げ場が無くなったらタッチアウト
    /* 逃げ場が無くなっても、実際にタッチしていなければアウトにしない。
       抽象的な「逃げ幅」だけでアウトを宣告していた。 */
    if(R.hiLim-R.loLim < 0.13 && Math.hypot(R.holder.cx-rp.x, R.holder.cy-rp.z) < 6.0){
      markOut(r,'tag'); return endRundown('タッチアウト！','#95a3b4'); }
    /* 逃げ込み先に近づいたら、その方向の塁へ送球して切り返させる。
       投げる距離を毎回わずかに変える。固定にしていたため切り返しの間合いが完全に読め、
       走者が同じ動きで逃げ切れていた。実際の挟殺も、詰め方と投げる間合いは一定ではない。 */
    if(R.trig===undefined) R.trig = 0.20;
    if(Math.abs(r.p-r.goal) < R.trig){
      R.trig = rnd(0.11, 0.30);              // 次の切り返しは別の間合いで
      const goingHi = r.goal > (R.loLim+R.hiLim)/2;
      const chasing = goingHi ? R.hi : R.lo;       // 走者が向かっている側
      const recv=rundownCover(chasing, R.holder);
      const p=throwPoint(chasing);
      /* 受け手が塁に入っていなければ投げない。投げると球が塁の上で止まり、
         受け手が着くまで判定が出ない（見た目も結果もおかしくなる）。
         受け手が着くまでは自分がその塁へ詰める。自分の方が先に着くならそのまま踏む。 */
      const recvGap = Math.hypot(p[0]-recv.cx, p[1]-recv.cy);
      const myGap   = Math.hypot(p[0]-R.holder.cx, p[1]-R.holder.cy);
      if(recvGap > 12){          // 受け手が塁に入りかけていれば投げてよい
        if(myGap <= recvGap) setTarget(R.holder, p[0], p[1]);   // 自分の方が近い＝踏みに行く
    /* 時間切れでアウトにしない。決着がつかないまま長引いたら走者はセーフ。 */
    if(R.t>9) return timeoutRundown();
        return;                                                  // まだ投げない
      }
      R.ex++;
      // 両側の野手が詰めてきて、走者の使える範囲が狭まる
      R.loLim=Math.min(R.loLim+0.10, R.hiLim-0.05);
      R.hiLim=Math.max(R.hiLim-0.10, R.loLim+0.05);
      const away = clamp(goingHi ? R.loLim : R.hiLim, R.loLim, R.hiLim);
      R.fumble = Math.random() < A.fumble(recv.cat)*2.2;
      /* 乱れる時は実際にそれた所へ投げる。以前は「送球が乱れてセーフ」と出るのに
         球はまっすぐ塁へ飛んでいたので、バグにしか見えなかった。 */
      let dest=p;
      if(R.fumble){
        const o=throwOffset(R.holder, Math.hypot(p[0]-R.holder.cx,p[1]-R.holder.cy));
        dest=[p[0]+o[0]*2.4, p[1]+o[1]*2.4];
      }
      launchThrow(R.holder.cx,R.holder.cy,dest[0],dest[1],armEff(R.holder));
      setTarget(recv, p[0], p[1]);          // 切り返しの受け手はその塁へ入る
      R.sub='relay'; R.recv=recv; R.dest=dest; R.rt=0;
      /* 走者は急停止して逆走する。切り返しのたびに止まって加速し直すので、
         そのぶん詰められる（挟殺で走者が追い込まれていくのはこのため）。
         ただし速度を0にするのは実際に向きを変えた時だけ。Sで突っ込み続けている走者は
         行き先が変わらない（手動指示はsetAutoGoalで上書きされない）ので、そのまま走らせる。
         向きが変わっていないのに速度だけ毎回リセットしていたため、突っ込んだ走者が
         本塁手前で這うように減速していた（録画170919で確認）。 */
      r.extra=0;
      const gBefore=r.goal;
      setAutoGoal(r, away);
      if(r.goal!==gBefore) r.v=0;
    }
    /* 時間切れでアウトにしない。決着がつかないまま長引いたら走者はセーフ。 */
    if(R.t>9) return timeoutRundown();
    return;
  }
  if(R.sub==='relay'){
    R.rt+=dt;
    /* 走者が塁に到達していれば、切り返しの送球が飛んでいる途中でもセーフ。
       セーフ判定がchase側にしか無かったため、送球中に本塁を踏んだ走者が
       3秒後に捕球した野手に塁上で「タッチアウト」にされていた（実測トレース）。 */
    if(Math.abs(r.p-r.goal)<0.02 && Math.abs(r.goal-Math.round(r.goal))<0.01)
      return endRundown('セーフ！','#3fd66a');
    if(R.t>9) return timeoutRundown();
    /* 切り返しが受け手を外れて抜けた＝挟殺は崩壊。走者は先の塁を取り、
       守備は通常の回収(chase)へ移る。この脱出経路が無かったため、抜けた球が
       外野を転々とする間も挟殺の機械が回り続け、球を無視したまま時間切れの
       「戻ってセーフ」でプレーを打ち切っていた（録画211639）。 */
    {
      const dPast=Math.hypot(ball.x-R.dest[0], ball.y-R.dest[1]);
      if(dPast>10 && (ball.landed || R.rt>1.2)){
        if(!r.out){ r.extra=0; r.cmd=null; setAutoGoal(r, Math.min(4, R.hi), true); r.v=Math.max(r.v||0,(r.sp||23)*0.5); }
        T.rd=null; T.stage='fly'; T.t=0; T.chased=true;
        T.dest=[ball.x, ball.y];
        setMsg('送球が乱れた！','','#ffc23d');
        return;
      }
    }
    let acc=Math.min(0.30,(R.acc||0)+dt), g=0;
    while(acc>=PHYS_H && g++<900){ acc-=PHYS_H; stepBall(ball,PHYS_H); }
    R.acc=acc;
    /* 受け手が塁に着くまではボールを受け手の手へ移さない（塁の上で球が止まって見える）。 */
    const recvHere = !R.recv || Math.hypot(R.dest[0]-R.recv.cx, R.dest[1]-R.recv.cy) < 6;
    if((Math.hypot(ball.x-R.dest[0], ball.y-R.dest[1])<5 && recvHere) || R.rt>3.2){
      if(R.fumble) return endRundown('送球がそれてセーフ！','#3fd66a');
      // 受け手のすぐそばに走者がいればその場でタッチ
      const q=runnerPos(r);
      if(Math.hypot(R.recv.cx-q.x, R.recv.cy-q.z) < 3.0){
        markOut(r,'tag'); return endRundown('タッチアウト！','#95a3b4');
      }
      R.holder=R.recv; R.sub='chase';
    }
  }
}
/* 挟殺が決着しないまま長引いた時の打ち切り。走者は「今いる塁間の手前の塁」へ戻して終える。
   以前は走者の位置を四捨五入していたため、三本間で3.7の位置にいた走者が本塁へ切り上げられ、
   挟まれたままセーフ＋1点になっていた（録画で確認）。追い込まれている走者に塁を与えない。 */
function timeoutRundown(){
  const r=throwPlay && throwPlay.rd ? throwPlay.rd.r : null;
  if(r && !r.out){
    const back=Math.max(r.origin, Math.floor(r.p+1e-9));
    r.goal=back; r.autoGoal=back; r.cmd=null;
  }
  return endRundown('戻ってセーフ','#3fd66a');
}
function endRundown(text,color){
  const T=throwPlay;
  T.rdText=text; T.rdColor=color;
  /* 挟殺が決着しても、本塁へ向かっている別の走者がいる限りプレーは終わらない。
     ここで即確定していたため、三本間の走者が本塁の手前(p=3.5)にいるのに
     「1点」でプレーが打ち切られていた（録画で確認。タッチ経路には同じ対策済みだったが
     挟殺の決着経路に入れ忘れていた）。ボール保持者から本塁へ送って続行する。 */
  const homing = runners.find(r=>!r.out && r.goal>=3.99 && r.p<3.97 && r.p>2.0);
  if(homing && baseOuts()+countOuts()<3){
    /* 挟殺の切り返し送球が空中にある最中は、保持者にボールは無い。
       ここでtransferへ入れると空中の球が保持者の手へ瞬間帰還する
       （録画211315: 捕手が二塁へ投げたのにまだ持っていて三塁へ投げた、の正体）。
       空中の球は受け手に捕らせてから本塁へ転送する(relayTo)。 */
    if(T.rd && T.rd.sub==='relay'){
      T.receiver=T.rd.recv; T.dest=T.rd.dest; T.relayTo=4; T.target=4;
      T.stage='fly'; T.t=0; T.rd=null; T.relayed=true;
      return;
    }
    const holder = (T.rd && T.rd.holder) || T.receiver || T.thrower;
    T.rd=null; T.thrower=holder; T.receiver=null; T.relayed=true;
    T.stage='transfer'; T.t=0; T.stepChecked=false;
    T.transfer=A.transfer(holder.fld,holder.cat)*0.75+0.16;
    T.target=4;
    return;
  }
  concludePlay();
}

/* 投手への返球を受けた時の締め。本塁へ向かって走っている走者がいる限りプレーは終わっていない
   ＝投手から本塁へ投げて勝負を続ける（endRundownと同じ対策）。ここで即打ち切っていたため、
   犠牲フライで三塁を回った走者が本塁到達前に「1点」と判定されていた（録画202928）。 */
function concludeOrChaseHome(){
  const T=throwPlay;
  const homing = runners.find(r=>!r.out && r.goal>=3.99 && r.p<3.97 && r.p>2.0);
  if(homing && baseOuts()+countOuts()<3){
    const holder = T.receiver || T.thrower;
    T.thrower=holder; T.receiver=null; T.relayed=true;
    T.stage='transfer'; T.t=0; T.stepChecked=false;
    T.transfer=A.transfer(holder.fld,holder.cat)*0.75+0.16;
    T.target=4;
    return;
  }
  return concludePlay();
}
function judgeAtBase(b){
  const T=throwPlay;
  if(T.kind==='pickoff'){
    // 飛び出した走者が塁へ戻れていなければアウト。塁間で捕まったら挟殺へ
    /* 一塁へ牽制したなら一塁走者だけが対象。塁で絞らないと、
       二塁走者のリードが大きいというだけで一塁牽制の対象にしてしまう。 */
    const cand=runners.filter(r=>!r.out && r.jumped && r.origin===b && Math.abs(r.p-b)>0.02)
                      .sort((x,y)=>Math.abs(y.p-y.origin)-Math.abs(x.p-x.origin))[0];
    if(cand){
      if(cand.p>b+0.12){ T.stealText='牽制で挟まれた！'; return beginRundown(cand, b+1); }
      markOut(cand,'tag'); T.stealText='牽制アウト！';
    }else T.stealText='戻ってセーフ';
    return concludeSteal();
  }
  if(T.kind==='steal'){
    // 盗塁はタッチプレー。送球が着いた時に走者が塁に達していなければアウト
    const cand=runners.filter(r=>!r.out && r.p<b && r.p>b-1.001 && r.dir>0).sort((x,y)=>y.p-x.p)[0];
    if(cand && runnerETA(cand,b)>0.02){ markOut(cand,'tag'); T.stealText='盗塁失敗！'; }
    else {
      /* その塁を回ってさらに次を狙っている走者がいる間は、盗塁はまだ終わっていない。
         「塁の手前にいる走者」だけを見て成否を決めていたため、
         走者が二塁を回って三塁へ向かっていると該当者なし＝盗塁成功として
         プレーを打ち切っており、走者は誰にも追われずに三塁へ進めていた（録画で確認）。 */
      const goingOn = runners.find(r=>!r.out && r.p>b-0.02 && r.p<b+0.999 && r.goal>b+0.02);
      if(goingOn){
        const holder = T.receiver || T.thrower;
        T.thrower=holder; T.receiver=null; T.relayed=false;
        T.stage='transfer'; T.t=0; T.stepChecked=false;
        T.transfer=A.transfer(holder.fld,holder.cat)*0.75+0.16;
        const nx=chooseThrowTarget(holder);
        T.target = nx ? nx.nb : Math.min(4, b+1);
        setMsg('走者が次の塁へ！','','#ffc23d');
        return;                                   // プレー続行
      }
      T.stealText='盗塁成功！';
    }
    return concludeSteal();
  }
  if(b==='P') return concludeOrChaseHome();   // 投手への返球はアウト判定を伴わない
  /* 外野への安打では判定しない。塁打数（award）は「回収の早さから安全に取れる塁」を
     すでに表しているので、そこへ向かう走者を送球で刺すと二重に不利になる。
     実際、これが原因で三塁打を打った打者が三塁で刺され、単打の一塁走者も二塁で刺されて
     ホームラン以外で1点も入らない状態になっていた。送球の演出だけ行って結果に進む。 */
  if(T.kind==='fly'){
    if(b==='P') return concludeOrChaseHome();
    // 離塁していて戻り切れていない走者は離塁アウト。タッチアップ組は間に合えばセーフ
    /* 離塁アウトにできるのは、投げた塁を元の塁とする走者だけ。
       送球先と無関係に「一番離れている走者」を選ぶと、一塁へ投げて三塁走者がアウトになる。 */
    const back = runners.filter(r=>!r.out && r.mustReturn && r.origin===b && Math.abs(r.p-r.origin)>0.02)
                        .sort((x,y)=>Math.abs(y.p-y.origin)-Math.abs(x.p-x.origin))[0];
    if(back && Math.abs(back.p-back.origin)>0.02){
      markOut(back,'force');
      T.flyText='離塁アウト！';
    }else{
      const tagger = runners.filter(r=>!r.out && !r.mustReturn && r.p<b && r.p>b-1.001 && r.dir>0)
                            .sort((x,y)=>y.p-x.p)[0];
      if(tagger && runnerETA(tagger,b)>0.02) return beginRundown(tagger, b);
    }
    return concludePlay();
  }
  /* 外野への安打でも内野ゴロと同じように判定する。
     以前は「塁打数ぶんは無条件セーフ」にしていたので、間に合っていない走者も刺せなかった。 */
  // 封殺・タッチの判定
  /* アウトの対象は「その塁の手前にいて、そこへ来なければならない／来ようとしている走者」。
     以前は走者の内部の行き先(goal)で選んでいたため、押し出されているのに
     帰塁を指示された走者が封殺を免れていた。見えている事実だけで選ぶ。 */
  const cand = runners.filter(r=>!r.out && r.p<b && r.p>b-1.001 &&
                 (r.dir>0 || (r.origin===0 && b===1) || (r.origin>0 && isForced(r) && b===r.origin+1)))
               .sort((x,y)=>y.p-x.p)[0];
  let outMade=false;
  /* 塁を踏むだけでアウトにできるのは封殺だけ。強制されていない走者は
     タッチが必要なので、間に合わなくても即アウトにせず挟殺プレーへ回す。
     （守備側が自分で送球先を指定した時に、この場面が起きる） */
  if(cand && runnerETA(cand,b)>0.02){
    /* 塁を踏むだけでアウトにできる（封殺）のは、押し出されている走者が
       すぐ次の塁へ向かっている時だけ。打者走者なら一塁だけ。
       それ以外はタッチが要るので、間に合っていなくても挟殺プレーへ回す。 */
    const forceable = (cand.origin===0) ? (b===1) : (isForced(cand) && b===cand.origin+1);
    if(!forceable) return beginRundown(cand, b);
    markOut(cand,'force'); outMade=true;
  }
  else if(cand){ cand.p=Math.max(cand.p,b); }

  // 併殺を狙えるか（一塁がまだ空いていて、打者走者が残っている）
  const br = runners.find(r=>r.origin===0 && !r.out);
  // 併殺は「速く捕れた打球」でだけ狙える。中継のひねりぶん持ち替えも遅くなる
  if(outMade && b>=2 && !T.relayed && baseOuts()+countOuts()<3 && br && br.p<1 && T.fieldT<2.2){
    T.relayed=true; T.stage='transfer'; T.t=0;
    T.transfer=A.transfer(T.thrower.fld,T.thrower.cat)*0.75+0.16; T.target=1;
    // 一塁へ投げるのは「今ボールを持っている野手」。塁の近くにいるだけの別人が投げない
    T.thrower = T.receiver || T.thrower;
    ball.x=T.thrower.cx; ball.y=T.thrower.cy;
    return;
  }
  /* セーフの判定が出ても、別の走者がまだ次の塁へ向かっているならプレーは終わらない。
     ここで即確定していたため、一塁セーフ（エラー）の瞬間に、二塁走者が三塁へ
     走っている途中で結果が固定されていた（録画で確認）。ボールを持っている野手が
     次の狙いへ投げ直して続行する。回数は S.throwCount の上限(6)が歯止め。 */
  const chase = runners.find(r=>!r.out && r.p < r.goal-0.15 && r.p < 3.98);
  if(chase && baseOuts()+countOuts()<3 && (S.throwCount||0)<6){
    const holder = T.receiver || T.thrower;
    const nxt = chooseThrowTarget(holder);
    if(nxt && nxt.nb!=='P'){
      T.thrower=holder; T.receiver=null; T.target=nxt.nb;
      T.stage='transfer'; T.t=0; T.stepChecked=false; T.relayed=true;
      T.transfer=A.transfer(holder.fld,holder.cat)*0.75+0.16;
      ball.x=holder.cx; ball.y=holder.cy;
      return;
    }
  }
  concludePlay();
}
function countOuts(){ return runners.filter(r=>r.out).length; }
/* アウトが成立したその瞬間にアウトカウントを1つ増やす。
   以前はプレーが全部終わってから加算していたので、フライを捕った後、
   ボールが内野に返ってくるまでアウトカウントが増えなかった。
   二重加算しないよう、先に足した数を S.preOuts に覚えておき、最後に差し引く。 */
function markOut(r, kind){
  if(r.out) return;
  /* 打者走者が一塁に達する前のアウトは、触られて取られた場合でも
     「封殺と同じ扱い」になる（規則上、その第三アウトでは得点が認められない）。
     タッチだからと得点を認めていたため、2アウト三塁の一塁ゴロで
     きわどくアウトになった時に1点が入っていた。 */
  const beforeFirst = (r.origin===0 && r.p < 1-1e-9);
  if(beforeFirst) kind='force';
  r.out=true; r.outKind=kind; r.goal=r.p;
  (S.outOrder=S.outOrder||[]).push(kind);       // 成立順を残す（第三アウトの種類で得点可否が変わる）
  S.outs++; S.preOuts=(S.preOuts||0)+1;
  /* アウトの表示は成立した瞬間に出す（プレーの打ち切りとは別）。
     二塁封殺のアウトが、続く一塁送球の決着まで表示されなかった。
     プレーが続けば表示は続報で上書きされる。フライ捕球は resolveCatch 側が出す。 */
  if(kind!=='fly' && (S.phase==='flight'||S.phase==='throwing'))
    setMsg('アウト！','','#95a3b4');
  /* 第三アウトが成立した瞬間に、本塁を踏み終えていた走者を控えておく。
     野球ではアウトより先に本塁に達していた走者だけが得点になる（タイムプレー）。
     行き先が本塁というだけで得点にしていたため、まだ三塁手前にいる走者まで得点していた。 */
  if(S.outs>=3 && !S.thirdOutScored)
    S.thirdOutScored = runners.filter(x=>x.p>=4-1e-6);
  ui();
}
const baseOuts = ()=> S.outs-(S.preOuts||0);   // このプレーが始まる前のアウト数
function concludePlay(){
  /* 進塁キーを押している間は結果を確定させない。
     確定してしまうと、その後にキーを押しても走塁指示が届かず（記録はもう閉じているため）、
     「押していたのにプレーが終わった」ことになる（録画で確認）。
     次の塁を狙える走者がいる時だけ保留し、長引いたら上の打ち切りが効く。 */
  if(throwPlay && isPlayerBatting() && (held['s']||held['z']) && (S.playClock||0) < 8
     && baseOuts()+countOuts() < 3
     && runners.some(r=>!r.out && r.p<3.98 &&
          (Math.abs(r.p-Math.round(r.p))<0.06 || r.p < r.goal-0.02))){
    if(throwPlay.stage!=='rundown'){ throwPlay.holdOpen=true; return; }
  }
  let runs=0; const nb=[null,null,null];
  /* 前の走者から順に塁を埋める。同じ塁に2人は入れないので、埋まっていたら1つ手前へ。
     手前も埋まって行き場が無くなった走者はアウト（実際の野球でもタッチアウト）。
     これをしないと、塁が重なった時に走者が消えてしまう。 */
  /* フライを捕られた時、離塁していた走者は元の塁を踏み直さないと進めない。
     踏み直していない走者が本塁まで走り抜けても得点にはならない。 */
  if(throwPlay.kind==='fly') runners.forEach(r=>{
    if(!r.out && r.mustReturn) r.goal=Math.min(r.goal, r.origin);
  });
  /* 第三アウトで攻撃が終わった場合、アウトより先に本塁を踏んでいた走者だけが得点になる。 */
  const timePlay = S.thirdOutScored;
  runners.filter(r=>!r.out).sort((a,b)=>b.goal-a.goal).forEach(r=>{
    let g=Math.round(r.goal);
    /* 本塁まで来た走者は行き先も本塁に直す。ここを直さないと、
       打ち切りで塁間(例 p=3.7)にいた走者が得点だけ記録され、
       画面では三塁と本塁の間で止まったままになる。 */
    if(g>=4){ r.goal=4; if(!timePlay || timePlay.includes(r)) runs++; return; }
    while(g>=1 && nb[g-1]) g--;
    if(g>=1){
      nb[g-1]={id:Math.random(), sp:r.sp};          // 走力は塁上でも保持する
      /* 行き先だけを決め、位置は走って合わせる。ここで p を直接書き換えると
         走者が塁の間から瞬間移動して見える（プレーが途中で切れたように見える）。
         表示時間は finishPlay が「全員が走り終わるまで」で取る。 */
      r.goal=g;
    }else if(baseOuts()+countOuts()>=3){
      /* すでに3アウト＝記録上この走者は関係ないが、位置は塁の上で終わらせる。
         r.goal=r.p にしていたため、走者が塁間に立ったままプレーが終わっていた。 */
      r.goal=Math.max(0, Math.floor(r.p+1e-9));
    }else{
      r.out=true; r.outKind='tag'; r.goal=r.p;      // 戻る塁が無い＝アウト
      (S.outOrder=S.outOrder||[]).push('tag');
    }
  });
  const outs=countOuts();
  /* 3アウト目が「封殺」か「打者走者が一塁に達する前のアウト（フライ捕球を含む）」なら、
     その回の得点は無効。挟殺などのタッチアウトが3アウト目の場合だけ、
     先に生還していた走者の得点が認められる。 */
  /* 得点が消えるのは「第三アウトが」封殺・フライ捕球・打者走者の一塁到達前アウトの時だけ。
     プレー中に封殺が1つでもあれば消す、という作りだと、最後がタッチアウトの複合プレーで
     先に生還していた走者の得点まで誤って消える。 */
  if(baseOuts()+outs>=3){
    const last=(S.outOrder||[]).slice(-1)[0];
    if(last==='force'||last==='fly') runs=0;
  }
  const hit = throwPlay.kind==='outfield' || (throwPlay.kind==='infield' && outs===0);
  const nm = throwPlay.thrower.n;
  /* 単打・二塁打・三塁打の呼び名は「打者走者が実際にどこまで行けたか」で決める。
     打球の回収にかかった秒数から先に決めてしまうと、走者がまだ走っている途中でも
     塁打数が確定してしまい、見えているプレーと言葉が食い違う。 */
  const brr = runners.find(r=>r.origin===0);
  const brBase = brr ? (brr.out ? Math.max(1,Math.floor(brr.p+1e-9)) : Math.round(brr.goal)) : 1;
  const HITNAME = {1:'ヒット',2:'ツーベース',3:'スリーベース',4:'ランニングホームラン'};
  let text, color;
  if(throwPlay.rdText){                      // 挟殺プレーの結末を優先して見せる
    /* 打球のプレーでなければ「◯◯ゴロ」と呼ばない。盗塁を刺した時に
       「捕ゴロ → タッチアウト！」と出ていた。 */
    const base = throwPlay.kind==='outfield' ? (HITNAME[brBase]||'ヒット')
      : (throwPlay.kind==='steal' ? '盗塁'
      : (throwPlay.kind==='pickoff' ? '牽制' : `${nm}ゴロ`));
    text = `${base} → ${throwPlay.rdText}`;
    color = throwPlay.rdColor;
  }else{
    if(throwPlay.kind==='fly'){
      const fk=(ball&&ball.flyKind)||'フライ';
      // 表示は「捕った野手」で作る（thrower は返球で投手などに変わっている）
      text=`${throwPlay.flyBy||nm}${fk} アウト`;
      if(throwPlay.flyText) text+=` → ${throwPlay.flyText}`;
      else if(runs>0) text='犠牲フライ！';
      color='#95a3b4';
    }
    else if(throwPlay.kind==='outfield'){
      text = (HITNAME[brBase]||'ヒット')+'！';
      if(outs>0) text += ` → ${outs>1?outs+'アウト':'アウト'}`;   // 走者が刺された時は隠さない
    }
    else if(outs>=2) text='ゲッツー！ ダブルプレー';
    else if(outs===1) text=`${nm}ゴロ アウト`;
    else text=`${nm}への内野安打！`;
    if(color===undefined) color = outs>0 ? '#95a3b4' : (runs>0?'#5aa9ff':'#3fd66a');
  }
  if(runs>0) text += ` ${runs}点`;
  throwPlay=null;
  finishPlay({out:outs, runs, bases:nb, hit, moves:null, throwTo:null, text, color});
}
function buildThrow(res){
  throwAnim=null;
  if(!ball || !ball.primary || res.throwTo==null) return;
  const dests = (Array.isArray(res.throwTo)?res.throwTo:[res.throwTo]);
  let cur=[ball.primary.cx, ball.primary.cy];
  const segs=[];
  dests.forEach(dst=>{
    const b=throwPoint(dst), len=Math.hypot(b[0]-cur[0], b[1]-cur[1]);
    segs.push({a:cur, b, len, dur: Math.max(0.18, len/125) + 0.16});
    cur=b;
    // 送球先の塁は、一番近い野手がベースカバーに入る
    let best=null, bd=1e9;
    fielders.forEach(f=>{
      if(f===ball.primary) return;
      const d=Math.hypot(b[0]-f.x, b[1]-f.y);
      if(d<bd){ bd=d; best=f; }
    });
    if(best) setTarget(best, b[0], b[1]);
  });
  throwAnim={segs, t:0, total:segs.reduce((s,x)=>s+x.dur,0)};
}
function updateThrow(dt){
  if(!throwAnim || !ball) return;
  throwAnim.t += dt;
  let t=throwAnim.t;
  for(const s of throwAnim.segs){
    if(t < s.dur){
      const u=t/s.dur;
      ball.x=lerp(s.a[0],s.b[0],u); ball.y=lerp(s.a[1],s.b[1],u);
      ball.z=4.2 + Math.sin(u*Math.PI)*Math.min(9, s.len*0.055);
      return;
    }
    t-=s.dur;
  }
  const last=throwAnim.segs[throwAnim.segs.length-1];
  ball.x=last.b[0]; ball.y=last.b[1]; ball.z=4.0;
}

function startFlight(c, powerMul, from){
  S.errorBy=null; S.playClock=0; S.throwCount=0;   // このプレーの記録をやり直す
  recStart(`打球 ${Math.round(c.exit)}mph ${Math.round(c.la)}° 方向${Math.round(c.spray)}° / ${S.outs}死 塁${S.bases.map(b=>b?1:0).join('')}`);
  fielders.forEach(f=>{ f.stun=0; f.fumbled=false; f.routeMissed=false; });
  const v=c.exit*1.467, la=c.la*RAD, sp=c.spray*RAD;
  ball={ x:from[0], y:from[2], z:from[1], t:0,
    vx:v*Math.cos(la)*Math.sin(sp), vy:v*Math.cos(la)*Math.cos(sp), vz:v*Math.sin(la),

       （引っ張りのファウルボールが曲がって出ていくのはこれ）。 */
    bs: clamp((c.la+6)/30, -0.4, 1.1),
    ss: clamp(-c.spray/38, -1.2, 1.2),
    exit:c.exit, la:c.la, spray:c.spray, maxZ:from[1], landed:false };

  ball.pred=plan.firstLand; ball.primary=plan.f; ball.canCatchAir=plan.air; ball.planT=plan.t;
  window.__contactGo=!plan.air;      // 空中で捕られない打球＝押し出される走者は打った瞬間に走る
  /* 打った瞬間に、捕る人以外は自分の受け持つ塁のカバーへ走る。
     これをしないと送球が届いた時にベースに誰もいない（受け手不在になる）。
     二塁は二塁手と遊撃手のうち、打球を捕りに行っていない方が入る。 */

  fielders.forEach(f=>{ f.primary=(f===plan.f); });

  const take = names => { for(const n of names){ const f=byName(n);
    if(f && !assigned.has(f)){ assigned.add(f); return f; } } return null; };
  fielders.forEach(f=>{ f.coverBase=null; });
  const put = (b, names) => { const f=take(names); if(f){ f.coverBase=b; const p=throwPoint(b); setTarget(f,p[0],p[1]); } };
  put(1, ['一','投','二']);          // 一塁手が捕りに出たら投手が入る
  put(3, ['三','遊','投']);          // 三塁手が捕りに出たら遊撃手が入る

     逆側の遊撃手が突っ立つ逆転が起きていた（録画212028、オーナー指摘）。 */
  put(2, (c.spray>5 ? ['遊','二','投','一'] : ['二','遊','投','一']));

  });

    if(!runners.some(r=>r.origin>0 && !r.out)){

        text:`${prim.n}${ball.flyKind||'フライ'} アウト`, color:'#95a3b4'});
