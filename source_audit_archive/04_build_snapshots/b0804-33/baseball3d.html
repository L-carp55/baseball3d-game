  /* ゴロの処理。速い打球ほど、捕球（能力）が低いほど後逸する。
     同じ野手が何度も弾いて終わらなくならないよう、後逸は1人1回まで。 */
  /* 弾んだ打球も、胸や頭の高さで捕れる（実際の内野手はショートバウンドもハーフバウンドも捕る）。
     以前は「高さ6ft未満」かつ「横の距離だけ」で見ていたため、大きく弾んだ打球が
     野手の上を素通りして後逸していた。飛びつく分もゴロに使える。 */
  const gz = Math.max(0, ball.z-4.2);
  const grounded = ball.landed && Math.hypot(d2,gz) < CATCH_R+diveReach(prim)*0.5
                   && ball.z<reach && ball.t>(ball.regrabT||0);
  /* 横っ跳びでやっと届いたゴロは、グラブの先をかすめて外野へ抜ける。 */
  /* ゴロは「届いたかどうか」を足の速さと距離だけで決める（確率で弾かない）。
     以前は捕球の瞬間に「間に合った見込み」の確率を引いていたが、その見積もりは
     定位置からの距離で計算しているため、実際に球の真上まで来ている野手にも当たり、
     足元のゴロが素通りして25ft後ろまで転がっていた（打球の25%で発生）。
     抜けるかどうかは、そもそも届くかどうかで決まるべき。
     取り損ねはこの下の「後逸(fumble)」だけが担当する＝その場に落ちるので不自然に見えない。 */
  if(grounded && !prim.fumbled && ball.t<6.5){
    /* ゴロも捕球圏の外縁で捕った時は横っ跳びの見た目を付ける */
    const stretch = Math.hypot(d2,gz)/Math.max(0.1, CATCH_R+diveReach(prim)*0.5);
    if(stretch>0.75){ prim.diveT=0.7; prim.diveAmt=clamp((stretch-0.75)*3,0.3,1); }
    const gsp=Math.hypot(ball.vx,ball.vy)/1.467;
    const pg=clamp(0.995 - 0.09*(1-(prim.cat||70)/100)
                   - clamp((gsp-40)/55,0,1)*0.11*(1.30-0.50*(prim.cat||70)/100), 0.60, 0.995);
    if(Math.random()>pg){ prim.fumbled=true; ball.regrabT=ball.t+0.55;
      deflectBall(prim, 0, true); return false; }
  }
  if(grounded || (ball.landed && ball.t>7) || ball.t>9){
    const fd=Math.hypot(prim.cx,prim.cy);
    if(fd<158 && ball.maxZ<26){ beginThrowPhase(prim,'infield',1); return true; }
    beginThrowPhase(prim,'outfield',1); return true;   // 塁打数は走者の到達で決まる
  }
  return false;
}

/* ========================= 結果判定（2D版と同一） ========================= */
/* 本塁打の飛距離。柵を越えた時点の状態から、そのまま飛ばして地面に着く所までを
   計算して測る（柵までの距離ではなく、実際に落ちる地点までの距離）。表示はメートル。 */
function homerDistance(){
  const b={x:ball.x,y:ball.y,z:ball.z,vx:ball.vx,vy:ball.vy,vz:ball.vz};
  for(let i=0;i<4000 && b.z>0.02; i++) stepBall(b, PHYS_H);
  return Math.round(Math.hypot(b.x,b.y)*0.3048);
}
function resolveHomer(){
  let runs=1, moves=[{from:0,to:4}], scored=0;
  for(let i=2;i>=0;i--) if(S.bases[i]){ scored++; moves.push({from:i+1,to:4}); }
  runs+=scored;
  const m=homerDistance();
  return {out:0, runs, bases:[null,null,null], hit:true, moves, throwTo:null, quick:1.6,
    sub:`飛距離 ${m}m  /  初速 ${Math.round(ball.exit)}mph`,
    text: runs>1?`${runs}ランホームラン！`:'ソロホームラン！', color:'#ffc23d'};
}
/* フライを捕られた時の処理（タッチアップ）。
   ・捕球の瞬間に自分の塁にいた走者は、そこから次の塁を狙える（タッチアップ）
   ・離塁していた走者は元の塁に戻らなければならない。戻る前に送球が届けばアウト（離塁アウト）
   打者はアウトなので、残りは走者の攻防として送球フェーズへ渡す。 */
function resolveCatch(){
  const dist=Math.hypot(ball.x,ball.y);
  /* 打球の呼び方は「実際にどれだけ上がったか」で決める。打ち出し角度で決めると、
     地を這うように飛んだ打球まで「ライナー」と呼んでしまう。 */
  const kind = ball.maxZ<7 ? 'ゴロ'
             : (ball.la>45 ? 'ポップフライ'
             : (dist>150 ? 'フライ' : (ball.maxZ<18 ? 'ライナー' : 'フライ')));
  const batter=runners.find(r=>r.origin===0);
  if(batter) markOut(batter,'fly');      // 捕った瞬間にアウトカウントを増やす

  let lead=null;
  runners.forEach(r=>{
    if(r.out || r.origin===0) return;
    if(r.p > r.origin+0.12){                 // 離塁していた → 戻る
      r.mustReturn=true; r.cmd=null; r.goal=r.origin;
      if(!lead || r.origin<lead.origin) lead=r;
    }else{                                   // 塁にいた → タッチアップで次を狙える
      r.p=r.origin;
      const deep = dist>225 && ball.t>3.0;
      /* Xを押している走者は自動タッチアップの対象から外す。
         「自動で判断」は指示が無い時のもので、戻ると指示した走者を走らせてはいけない。 */
      const wants = (r.cmd==='X') ? false
                  : ((r.cmd==='S') || r.tagUp || (deep && r.origin===3 && baseOuts()<2));
      r.goal = wants ? Math.min(4, r.origin+1) : r.origin;
      if(wants && !lead) lead=r;
    }
  });
  ball.flyKind=kind;
  /* アウトは捕った瞬間に出す。返球が終わるまで表示しないと、
     打者がアウトになったことが分かるのが遅れる（走者の攻防だけが後から続く）。 */
  setMsg(`${ball.primary.n}${kind} アウト`, '', '#95a3b4');
  S.lastPlay=`${ball.primary.n}${kind} アウト`;
  return {catchPlay:true, lead};
}
function resolveHit(ftime, fpos, entitled){
  const dist=Math.hypot(fpos.x,fpos.y);
  if(!entitled && dist<158 && ball.maxZ<26){
    const throwT = ftime+0.55+Math.hypot(fpos.x-63.64,fpos.y-63.64)/115;
    const batterT = 4.30+gauss(0.10);
    if(S.bases[0] && baseOuts()<2 && ftime<1.75 && throwT<batterT+0.4){
      const nb=[null,null,null], moves=[{from:1,to:2}];
      if(S.bases[2]) nb[2]=S.bases[2];
      if(S.bases[1]){ if(!nb[2]){ nb[2]=S.bases[1]; moves.push({from:2,to:3}); } else nb[1]=S.bases[1]; }
      return {out:2, runs:0, bases:nb, hit:false, moves, throwTo:[2,1],
        text:'ゲッツー！ ダブルプレー', color:'#95a3b4'};
    }
    if(throwT<batterT){
      const nb=[null,null,null], moves=[]; let runs=0;
      for(let i=2;i>=0;i--){
        if(!S.bases[i]) continue;
        if(i===2){ runs++; moves.push({from:3,to:4}); }
        else { nb[i+1]=S.bases[i]; moves.push({from:i+1,to:i+2}); }
      }
      return {out:1, runs, bases:nb, hit:false, moves, throwTo:1,
        text: runs>0?`${ball.primary.n}ゴロの間に1点`:`${ball.primary.n}ゴロ アウト`,
        color: runs>0?'#5aa9ff':'#95a3b4'};
    }
    return advanceOnHit(1, `${ball.primary.n}への内野安打！`, 1);
  }
  if(entitled) return advanceOnHit(2,'エンタイトルツーベース！', null);
  let b = ftime<3.45?1:(ftime<4.70?2:3);
  if(dist<150) b=1;
  if(b===3 && dist<265) b=2;
  if(Math.abs(Math.atan2(fpos.x,fpos.y)/RAD)>36 && b===1 && ftime>3.0) b=2;
  return advanceOnHit(b, {1:'ヒット！',2:'ツーベース！',3:'スリーベース！'}[b], false);
}
function advanceOnHit(b, text, throwOverride){
  let runs=0; const nb=[null,null,null], moves=[];
  const extra = (b===1 && ball && Math.hypot(ball.x,ball.y)>250)?1:0;
  for(let i=2;i>=0;i--){
    if(!S.bases[i]) continue;
    const to=i+1+b+(i>=1?extra:0);
    if(to>=4){ runs++; moves.push({from:i+1,to:4}); }
    else { nb[to-1]=S.bases[i]; moves.push({from:i+1,to:to}); }
  }
  nb[b-1]={id:Math.random(), sp:A.speed(ROSTER[battingTeam()][S.order[battingTeam()]].走)};
  moves.push({from:0,to:b});
  // 返球先: 得点が入れば本塁、そうでなければ走者の1つ先の塁へ中継
  const to = (throwOverride!==undefined) ? throwOverride : (runs>0 ? 0 : (b>=3 ? 0 : b+1));
  return {out:0, runs, bases:nb, hit:true, moves, throwTo:to,
    text: runs>0?`${text} ${runs}点`:text, color:'#3fd66a'};
}
/* ファウルは「打球が消えてすぐ表示」ではなく、飛んでいく所を見せてから確定させる。
   打った瞬間に消えていたため、どこへ飛んだのか分からなかった。
   1.1秒だけ見せる（打球が落ちたらそこで切り上げる）。 */
function foulFly(){
  ball.fouling = 0;
  setMsg('ファウル','','#95a3b4'); S.lastPlay='ファウル';
}
function foulBall(){
  S.stealing=false;
  if(S.strikes<2) S.strikes++;
  /* 走者を元の塁へ戻す。戻さないと、記録は元の塁のままなのに画面では
     塁間に立ったままになり、次の投球まで表示と記録が食い違う。 */
  runners.forEach(r=>{ r.p=r.origin; r.goal=r.origin; r.autoGoal=r.origin; r.cmd=null; r.v=0; r.mustReturn=false; r.tagUp=false; });
  runners=runners.filter(r=>r.origin>0);
  ball=null; resetFielders(); S.fieldView=false;
  setMsg('ファウル','','#95a3b4'); S.lastPlay='ファウル';
  S.phase='msg'; S.timer=0.9; snapCam(); ui();
}
function resetFielders(){
  /* 前進守備（セオリー準拠 2026-08-04導入）: 三塁走者あり・2死未満なら内野は前へ
     ＝ゴロで本塁へ投げて1点を防ぐ体勢。2死では取らない（どこでアウトを取っても
     攻撃終了なので、ヒットゾーンを広げる前進の損しかない）。
     深さは定位置の78%（約20ft前）。守備位置は本塁原点の座標なので半径方向の縮小でよい。 */
  const inField = (S && S.bases && S.bases[2] && baseOuts()<2) ? 0.78 : 1.0;
  fielders.forEach(f=>{
    const k = ('一二三遊'.includes(f.n)) ? inField : 1.0;
    f.cx=f.x*k; f.cy=f.y*k; f.tx=f.cx; f.ty=f.cy;
    f.primary=false; f.face=0; f.v=0; f.stun=0; f.fumbled=false; f.run=0;
  });
}
// 攻守交代で守備陣を入れ替える
function swapFielders(){ fielders = buildFielders(1-S.half); }

/* ========================= プレー確定 ========================= */
function finishPlay(res){
  /* 3アウト目の得点無効は concludePlay 側で「封殺・フライ捕球か、タッチアウトか」を
     見て判定している。ここで一律に消すと、その判定を上書きしてしまうため行わない
     （タッチアウトが3アウト目なら、先に生還していた走者の得点は認められる）。 */
  /* 野手がはじいて出塁したものは安打ではなくエラー（実際の記録と同じ）。
     表示も「ヒット！」ではなくエラーにする。 */
  if(S.errorBy && res.hit && !/エラー/.test(res.text)){
    res.text = `${S.errorBy}のエラー！`; res.hit = false; res.color = '#ffc23d';
  }
  // エラーは守備側チームの記録（スコアボードのE列）。1プレー1つまで
  if(S.errorBy && S.errors) S.errors[1-battingTeam()]++;
  /* 最後の歯止め。どの経路でプレーが終わっても、生きている走者の行き先は必ず塁にする。
     ここが抜けると「走者が塁間にいるままプレーが終わる」ように見える。
     行き先が塁の途中（挟殺の追い込みなど）なら、手前の塁に着かせて終える。 */
  runners.forEach(r=>{
    if(r.out) return;
    if(Math.abs(r.goal-Math.round(r.goal))>0.02) r.goal=Math.max(0,Math.floor(r.goal+1e-9));
  });
  S.hits[battingTeam()] += res.hit?1:0;
  addRuns(res.runs);
  S.outs = Math.min(3, S.outs + res.out - (S.preOuts||0)); S.preOuts=0;   // 1イニングは3アウトまで
  S.bases = res.bases;
  if(res.moves) applyRunnerResult(res);   // 送球判定を経たプレーは走者の行き先が確定済み
  buildThrow(res);
  setMsg(res.text,
    [res.sub||'', res.runs>0?`${res.runs}点が入りました`:''].filter(Boolean).join('  /  '),
    res.color);
  S.lastPlay=res.text;
  // 送球と走塁が終わるまで画面を保持する
  const need = (throwAnim?throwAnim.total:0) + 0.9;
  /* 走者が走り終わるまでの秒数。RUN_SPEED は「1ftあたりの塁の進み」なので、
     塁の差をそのまま割ると秒ではなくft換算になり、1塁ぶんで90秒待つことになっていた
     （守備陣とボールが固まって動かなく見えた原因）。ETAの関数で正しく求める。 */
  const runNeed = runners.reduce((m,r)=>{
    if(r.out) return m;
    return Math.max(m, r.p<r.goal ? runnerETA(r,r.goal) : runnerBackETA(r));
  },0);
  /* 走者が走り終わるまで表示を保持する。ただし本塁打や走者なしのフライのように
     結果が決まりきっているものは quick で短く切り上げる（待たされる時間を減らす）。 */
  S.quickPlay = !!res.quick;    // 本塁打などは走り終わるのを待たずに切り上げる
  /* 切り上げる場合は、走者を行き先に着かせてから見せる。
     走っている途中の姿のまま表示を終えると、塁間で固まって見える。
     本塁打なら全員が生還済みなので、本塁に着いた状態が正しい。 */
  if(res.quick) runners.forEach(r=>{ if(!r.out) r.p=r.goal; });
  S.phase='play'; S.timer = res.quick || Math.min(12, Math.max(2.2, need, runNeed+0.8));
  nextBatter(); ui();
}
function addRuns(n){
  if(!n) return;
  const arr=S.line[S.half]; while(arr.length<=S.inning-1) arr.push(0);
  arr[S.inning-1]+=n;
}
function ensureCell(){ const a=S.line[S.half]; while(a.length<S.inning) a.push(0); }
function total(t){ return S.line[t].reduce((a,b)=>a+b,0); }
function nextBatter(){ S.order[battingTeam()]=(S.order[battingTeam()]+1)%9; }

function afterPlay(){
  if(S.stealAfter!==null && S.stealAfter!==undefined){
    const k=S.stealAfter; S.stealAfter=null;
    resetFielders(); S.fieldView=false; snapCam();
    if(S.outs>=3){ endHalf(); return; }      // 盗塁死・牽制死が3アウト目
    if(k==='none'){ beginAtBatPhase(); return; }   // 牽制はカウントが動かない
    return callPitch(k);                     // 打席は続く（カウントだけ進む）
  }
  ball=null; runners=[]; trail=[]; throwAnim=null; throwPlay=null; resetFielders();
  manualThrow=null;
  S.balls=0; S.strikes=0; S.fieldView=false;
  if(S.outs>=3){ endHalf(); return; }
  if(S.half===1 && S.inning>=9 && total(1)>total(0)){ gameOver(); return; }
  snapCam();
  beginAtBatPhase();
}
function endHalf(){
  S.outs=0; S.bases=[null,null,null]; ensureCell();
  const before=S.half;
  if(S.half===0){
    S.half=1; swapFielders();      // 攻守交代は先に反映する（この後に試合終了しても守備陣が正しい）
    if(S.inning>=9 && total(1)>total(0)) return gameOver();
    ensureCell();
    setMsg('チェンジ', `${S.inning}回裏 CPUの攻撃 / あなたの守備`, '#5aa9ff');
  }else{
    if(S.inning>=9 && total(0)!==total(1)) return gameOver();
    if(S.inning>=12) return gameOver();
    S.half=0; S.inning++; swapFielders(); ensureCell();
    setMsg('チェンジ', `${S.inning}回表 あなたの攻撃`, '#5aa9ff');
  }
  S.phase='msg'; S.timer=1.8; snapCam(); ui();
}
function gameOver(){
  S.over=true;
  const a=total(0), b=total(1);
  setMsg('ゲームセット', `${a>b?'あなたの勝ち！':(a<b?'CPUの勝ち':'引き分け')}  ${a} - ${b}`,
    a>b?'#ffc23d':'#95a3b4');
  S.phase='over'; ui();
}

/* ========================= ボール／ストライク ========================= */
function callPitch(strike){
  // 盗塁中なら先に走者の決着をつけてから、ボール・ストライクを適用する
  if(S.stealing && runners.some(r=>!r.out && r.p>r.origin+0.02)) return beginStealThrow(strike);
  S.stealing=false;
  S.fieldView=false;
  if(strike){
    S.strikes++;
    if(S.strikes>=3){
      S.outs++; S.strikes=0; S.balls=0; S.lastPlay='三振';
      setMsg('三振！','','#95a3b4'); nextBatter();
      S.phase='play'; S.timer=1.4; ui(); return;
    }
    setMsg('ストライク','','#ff6b5e');
  }else{
    S.balls++;
    if(S.balls>=4){
      beginRunners(S.bases);                 // 押し出しの走塁を見せる
      if(S.bases.some(Boolean)) S.fieldView=true;
      const r=forcedWalk();
      applyRunnerResult({moves:r.moves});
      addRuns(r.runs); S.bases=r.nb;
      S.lastPlay='フォアボール';
      setMsg('フォアボール', r.runs?'押し出しで1点':'', '#5aa9ff');
      S.balls=0; S.strikes=0; nextBatter();
      /* 四球は誰も走って争わないので、歩き終わるのを待たない。
         走者を行き先に着かせて短く切り上げる（打者が一塁へ歩くのを毎回数秒見せていた）。 */
      runners.forEach(x=>{ if(!x.out) x.p=x.goal; });
      S.phase='play'; S.timer=0.9; ui(); return;
    }
    setMsg('ボール','','#5aa9ff');
  }
  S.phase='msg'; S.timer=0.8; ui();
}
/* 牽制。投球前に飛び出した走者を、投手が塁へ投げて刺しにくる。
   カウントは動かないので、決着したら同じ打者・同じカウントで再開する。 */
function beginPickoff(){
  S.jumpEarly=false;
  const pit = fielders.find(f=>f.n==='投') || fielders[0];
  const jump = runners.filter(r=>!r.out && r.jumped && r.origin<4)
                      .sort((a,b)=>(b.p-b.origin)-(a.p-a.origin))[0];
  if(!jump){ S.phase='windup'; S.timer=0.3; return; }
  runners.forEach(r=>{ if(r.jumped){ r.goal=r.origin; r.cmd=null; } });   // 戻るしかない
  fielders.forEach(f=>{ f.coverBase=null; });
  const map={1:'一',2:'遊',3:'三',4:'捕'};
  [1,2,3,4].forEach(b=>{ const f=fielders.find(x=>x.n===map[b]);
    if(f){ f.coverBase=b; const p=throwPoint(b); setTarget(f,p[0],p[1]); } });
  ball={x:pit.cx, y:pit.cy, z:4.4, t:0, vx:0, vy:0, vz:0, landed:false, maxZ:0};
  throwPlay={ stage:'transfer', t:0, transfer:0.18,
    thrower:pit, kind:'pickoff', award:0, target:jump.origin, relayed:false, fieldT:0 };
  S.phase='throwing'; S.fieldView=true; trail=[];
  setMsg('牽制！','','#ffc23d'); ui();
}
/* 捕手から盗塁を刺しに行く送球。打球のプレーとは別に、投球結果の適用を保留して先に決着させる。 */
function beginStealThrow(pendingStrike){
  S.pendingStrike = pendingStrike;
  const cat = fielders.find(f=>f.n==='捕') || fielders[0];
  const lead = runners.filter(r=>!r.out && r.p<r.goal).sort((a,b)=>b.p-a.p)[0];
  if(!lead){ S.stealing=false; S.pendingStrike=null; return callPitch(pendingStrike); }
  // カバーは走られた瞬間に入っている（updateStealCommands）
  const tgt = Math.round(lead.goal);
  ball={x:cat.cx, y:cat.cy, z:4.4, t:0, vx:0, vy:0, vz:0, landed:false, maxZ:0};
  throwPlay={ stage:'transfer', t:0,
    /* 捕手の捕ってから投げるまで（ポップタイム）は毎回ぶれる。
       実際も1.9〜2.1秒の幅があり、この揺らぎが盗塁の成否を分ける。 */
    /* 捕手がグラブに入れてから投げ離すまで。実際は0.65〜0.80秒で、
       これに送球の飛行を足したものがポップタイム（実測の平均2.0秒）。 */
    transfer: 0.88 + 0.22*(1-cat.cat/100) + rnd(0,0.20),
    thrower:cat, kind:'steal', award:0, target:tgt, relayed:false, fieldT:0 };
  S.phase='throwing'; S.fieldView=true; trail=[];
  setMsg('走った！','','#ffc23d'); ui();
}
/* 盗塁の結末。打者は変わらないので、通常のプレー確定(finishPlay)は通さない。 */
function concludeSteal(){
  const throwKind = throwPlay ? throwPlay.kind : 'steal';
  const nb=[null,null,null]; let runs=0;
  runners.filter(r=>!r.out).sort((a,b)=>b.goal-a.goal).forEach(r=>{
    let g=Math.round(r.goal);
    if(g>=4){ runs++; return; }
    while(g>=1 && nb[g-1]) g--;
    if(g>=1){ nb[g-1]={id:Math.random(), sp:r.sp}; r.goal=g; }   // 位置は走って合わせる
    else { r.out=true; r.outKind='tag'; }
  });
  const text = throwPlay && throwPlay.stealText ? throwPlay.stealText : '盗塁成功！';
  S.bases=nb; addRuns(runs);
  S.preOuts=0;                       // markOut で S.outs に加算済み
  throwPlay=null; ball=null; S.stealing=false;   // 走者は残して走り切らせる（次の打席で作り直す）
  setMsg(text + (runs?` ${runs}点`:''), '', /失敗/.test(text)?'#95a3b4':'#3fd66a');
  S.lastPlay=text;
  S.stealAfter = (throwKind==='pickoff') ? 'none' : S.pendingStrike; S.pendingStrike=null;
  S.playWait=0; S.quickPlay=false;   // 盗塁は走者が塁に着くまで見せる
  S.phase='play'; S.timer=1.3; ui();
}
function forcedWalk(){
  const nb=S.bases.slice(); let runs=0; const moves=[{from:0,to:1}];
  if(nb[0]){
    if(nb[1]){ if(nb[2]){ runs=1; moves.push({from:3,to:4}); } nb[2]=nb[1]; moves.push({from:2,to:3}); }
    nb[1]=nb[0]; moves.push({from:1,to:2});
  }
  nb[0]={id:Math.random(), sp:A.speed(ROSTER[battingTeam()][S.order[battingTeam()]].走)};
  return {nb, runs, moves};
}

/* ========================= 更新 ========================= */
function update(dt){
  anim.t+=dt;
  recTick(dt);                 // プレー記録（不具合の報告用）
  updateRunnerCommands();      // 押されている走塁キーを毎フレーム反映する
  updateStealCommands();       // 投球中のSは盗塁
  if(S.phase==='windup'||S.phase==='pitch') updateRunners(dt);
  if(anim.swing>=0){ anim.swing+=dt; if(anim.swing>0.45) anim.swing=-1; }
  if(anim.wind>=0){ anim.wind+=dt; if(anim.wind>1.1) anim.wind=-1; }
  switch(S.phase){
    case 'msg': S.timer-=dt; if(S.timer<=0){ setMsg(''); beginAtBatPhase(); } break;
    case 'windup': S.timer-=dt;
      if(S.jumpEarly) return beginPickoff();          // 投球前に飛び出した＝牽制で刺しにくる
      if(S.timer<=0){ const c=cpuChoosePitch(); launchPitch(c.type,c.nx,c.ny); } break;
    case 'pitch': updatePitch(dt); break;
    case 'flight': updateFlight(dt); break;
    case 'throwing': updateThrowPhase(dt); break;
    case 'play':
      updateRunners(dt); updateThrow(dt); moveFielders(dt, true);
      /* プレー確定後もボールが動いている間は飛ばし続ける。返球が空中にあるまま
         早期打ち切りすると、ボールが空中で凍結して見えていた（録画205336）。
         速度を持つボールだけが対象＝野手の手の中のボール(速度0)は動かない。
         投手のそばまで来たら手に収める。 */
      if(ball && !throwAnim && Math.hypot(ball.vx||0, ball.vy||0, ball.vz||0)>3){
        stepBall(ball, dt); ball.t+=dt;
        const pit=fielders.find(f=>f.n==='投');
        if(pit && Math.hypot(ball.x-pit.cx, ball.y-pit.cy)<6 && ball.z<7){
          ball.x=pit.cx; ball.y=pit.cy; ball.z=4.4; ball.vx=ball.vy=ball.vz=0;
        }
      }
      S.timer-=dt;
      if(S.timer<=0){
        /* まだ塁間を走っている走者がいるなら、着くまで待ってから次へ進む。
           時間で切って位置を書き換えると、走者が塁の間から瞬間移動して
           「プレーが途中で打ち切られた」ように見える。
           待つのは最大3秒まで（何かの理由で到達できない時に止まらないように）。 */
        const moving = runners.some(r=>!r.out && Math.abs(r.p-r.goal)>0.03);
        S.playWait = (S.playWait||0) + dt;
        if(moving && !S.quickPlay && S.playWait < 5.0) break;
        runners.forEach(r=>{ if(!r.out) r.p=r.goal; });   // 最後の保険（通常は既に到達済み）
        S.playWait = 0;
        setMsg(''); afterPlay();
      }
      break;
  }
  updateCam(dt);
}
function updatePitch(dt){
  pitch.t += dt/pitch.dur;
  const p=pitchPos(clamp(pitch.t,0,1.25));
  trail.push([p[0],p[1],p[2]]); if(trail.length>16) trail.shift();
  if(pitch.cpuSwingT!==null && !pitch.swung && pitch.t>=pitch.cpuSwingT){
    doSwing(pitch.tx + pitch.cpuOff.dx/PX_FT, pitch.ty - pitch.cpuOff.dy/PX_FT,
            (pitch.t-1)*pitch.dur*1000);
    return;
  }
  /* バントはクリック不要。バットを出して待つ動作なので、球が来たら自動で当てる。
     当たるか・転がるか・上がるかは、その瞬間のカーソルの位置だけで決まる。 */
  if(isPlayerBatting() && batMode===2 && !pitch.swung && pitch.t>=1.0 && !pitch.done){
    doSwing(aim.x, aim.y, 0);
    return;
  }
  if(pitch.t>=1.28 && !pitch.done){ pitch.done=true; callPitch(inZone(pitch.tx,pitch.ty)); }
}
// aimX,aimY は実寸ft。dtMsは早い=負
function doSwing(aimX, aimY, dtMs){
  pitch.swung=true; anim.swing=0;
  const dx=(aimX-pitch.tx)*PX_FT;
  const dy=(pitch.ty-aimY)*PX_FT;          // 狙いが球より下＝正＝フライ方向
  const bat=ROSTER[battingTeam()][S.order[battingTeam()]];
  const mt=A.meet(bat.ミ);
  const D0=isPlayerBatting()?DIFF[DIFF_I]:CPU_WIN;
  const M = isPlayerBatting() ? BATMODE[batMode] : CPU_MODE;
  /* バントは振らずに当てる。タイミングは大きく外れなければ当たり、
     打球は弱いゴロになる。方向は狙いの左右で決まる（三塁線・一塁線へ転がす）。 */
  if(isPlayerBatting() && batMode===2){
    /* バントはバットを出して待つ動作なので、タイミングを合わせて振る必要はない。
       当たるかどうかは「カーソルが球に届いているか」だけで決まる。
       結果は当て方で変わる：球の上を捉えれば転がり、下を捉えれば上がる（＝小フライで危険）。
       方向はカーソルの左右がそのまま出る（三塁線・一塁線へ転がす）。 */
    const aimDist=Math.hypot(dx*0.60, dy*1.30);   // バントも同じ横長楕円判定
    if(aimDist > D0.aw*mt*2.6){
      S.lastPlay='空振り'; ball=null; callPitch(true); return;
    }
    const off = clamp(dy/(D0.aw*mt*1.3), -1, 1);      // 正＝球の下を捉えた＝上がる
    const c={ exit: 20+14*Math.abs(off)+rnd(-3,3),
              la: 2 + 26*off + gauss(3),
              spray: clamp(dx*0.40 + gauss(3), -46, 46), q:0.5 };
    if(Math.abs(c.spray)>45){
      // 2ストライクからのバント失敗は三振（実際の規則と同じ）
      if(S.strikes>=2){ S.lastPlay='バント失敗'; ball=null; callPitch(true); return; }
      return foulBall();
    }
    return startFlight(c, 1, [pitch.tx, Math.max(1.2,pitch.ty), 1.4]);
  }
  const D={tw:D0.tw*mt*M.tw, aw:D0.aw*mt*M.aw, whiff:D0.whiff*M.whiff};
  const c=evalContact(dtMs,dx,dy,A.power(bat.パ)*M.pow, D, A.loft(bat.弾)+M.loft, pitch.tx);
  if(!c){ S.lastPlay='空振り'; ball=null; callPitch(true); return; }
  if(Math.abs(c.spray)>45 || (c.q<0.40 && Math.random()<0.55)) return foulBall();
  startFlight(c, A.power(bat.パ)*M.pow, [pitch.tx, Math.max(1.2,pitch.ty), 1.4]);
}

/* ========================= カメラ ========================= */
/* 打席カメラ: 望遠寄り（中継カメラに近い）。本塁から45ft後方・高さ8ft。
   画角は「投手の頭が上端から50px」「ゾーン下端が下端から60px」に収まる角度で決めてある
   （どちらかを欲張ると必ずもう一方が見切れるため、実測して両立する値を選んだ）。 */
const DUEL_EYE=[0,8.0,-45], DUEL_AT=[0,-0.22,55], DUEL_FOV=8.6;
/* 中継のカメラ。打球の行方に合わせて、寄り・高さ・回り込みを変える。
   ・浅い打球は低い位置から寄って、内野の攻防が見えるように
   ・深い打球は高く引いて、打球とフェンスの関係が分かるように
   ・打球が左右に大きく寄ったら、その方向へカメラも回り込む（正面固定だと奥行きが読めない）
   ・打球が上がっている間は少し上を向く（打球を画面内に保つ）
   以前は着地点を機械的に追うだけで、どんな打球でも同じ絵になっていた。 */
function camTargets(){
  if(S.fieldView){
    const b = ball || {x:0, y:70, z:2};        // 打球が無い場面（押し出しの走塁など）は内野を映す
    const d = Math.hypot(b.x, b.y);
    const far = clamp((d-90)/210, 0, 1);        // 0=内野 1=フェンス際
    const side = clamp(b.x/230, -1, 1);         // 打球の左右の寄り
    /* 線際の打球ほど大きく回り込み、高い位置から見る。
       正面寄りのままだと、ポールや観客席が手前に来て打球が隠れる
       （レフト線の打球が見えないという指摘の原因）。 */
    const lineHug = Math.pow(Math.abs(side), 1.5);
    const ang = side*(0.42+0.55*lineHug)*(0.35+0.65*far);
    const dist = 52 + 118*far;                  // 打球からどれだけ引くか
    const hgt  = 21 + 46*far + clamp(b.z,0,120)*0.16 + 26*lineHug;
    const cx = b.x*0.55, cz = b.y*0.62;         // 注視点（打球と内野の中間）
    return {
      eye:[cx - Math.sin(ang)*dist*0.55 - 6, hgt, cz - Math.cos(ang)*dist],
      at:[b.x*0.68, Math.max(2, b.z*0.42+3), b.y*0.90]
    };
  }
  return {eye:DUEL_EYE.slice(), at:DUEL_AT.slice()};
}
function snapCam(){ const t=camTargets(); cam.eye=t.eye.slice(); cam.at=t.at.slice(); }
function updateCam(dt){
  const t=camTargets(), k=1-Math.exp(-4.2*dt);
  for(let i=0;i<3;i++){ cam.eye[i]=lerp(cam.eye[i],t.eye[i],k); cam.at[i]=lerp(cam.at[i],t.at[i],k); }
}

/* ========================= 描画 ========================= */
const hud = document.getElementById('hud').getContext('2d');
let PROJ, VIEW, VP;

let duel=true;
function draw(){
  gl.viewport(0,0,VW,VH);
  gl.clearColor(SKY[0],SKY[1],SKY[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);

  duel = !(S.fieldView && ball);
  PROJ = M4.mul(M4.persp((duel?DUEL_FOV:38)*RAD, VW/VH, 0.5, 2200), MIRROR);
  VIEW = M4.lookAt(cam.eye, cam.at, [0,1,0]);
  VP = M4.mul(PROJ, VIEW);
  gl.uniformMatrix4fv(U.uP,false,PROJ);
  gl.uniformMatrix4fv(U.uV,false,VIEW);

  // 空を先に、奥行きを書かずに描く（何より奥にあるものとして扱う）
  gl.depthMask(false);
  drawMesh(MESH.sky, IDM, {unlit:true});
  gl.depthMask(true);
  drawMesh(MESH.field, IDM);
  drawGround();                        // 地面テクスチャ（芝の刈り縞・土・ライン）を上に貼る
  /* バックネットは本塁の後方に建っている（向きの誤りは修正済み）。
     打席カメラ(z=-45)はネット(z=-62)より内側なので、常時描いても視界に入らない。 */
  drawMesh(MESH.backstop, IDM);

  // 守備位置の選手
  const defKit = (S.half===0)? 'home' : 'away';   // 表=CPUが守備(白) / 裏=あなたが守備(青)
  fielders.forEach(f=>{
    if(f.n==='捕') return;                                // 捕手は別途
    const pose = (f.n==='投') ? (pitcherPose()||fielderPose(f)) : fielderPose(f);
    // 投手は本塁を向いて投げる。それ以外は進行方向を向く
    const face = (f.n==='投' && pose && pose.stride!==undefined) ? Math.PI : f.face;
    // 投球中は本塁側（-z）へ踏み出す
    const sz = (pose && pose.stride) ? f.cy - pose.stride : f.cy;
    drawFigure(defKit, f.cx, sz, face, f.run, 1, (f.v||0)/Math.max(1,f.sp), pose);
    shadowAt(f.cx, sz, 1.15);
  });

  // 捕手（打席カメラでは低めのゾーンに重なって邪魔になるので描かない）
  const catcher = fielders.find(f=>f.n==='捕') || fielders[0];
  if(!duel){
    // 捕手はしゃがんでミットを構える
    drawFigure(defKit, catcher.cx, catcher.cy, Math.PI, 0, 1.0, 0,
      {crouch:1.05, lean:0.32, legL:1.25, legR:-1.25, kneeL:2.1, kneeR:2.1,
       armL:-0.95, armLZ:-0.25, armR:0.45, elbowL:0.9, elbowR:1.1});
    shadowAt(catcher.cx, catcher.cy, 1.15);
  }
  drawBatter();

  // 走者（プレー中は走っている走者を、それ以外は塁上の走者を描く）
  const runKit = (S.half===0)?'away':'home';
  if(runners.length){
    runners.forEach(r=>{
      if(r.p>=3.999) return;                       // 生還した走者は消す
      const q=runnerPos(r);
      const moving = Math.abs(r.goal-r.p)>0.01;
      drawFigure(runKit, q.x, q.z, q.face, moving ? r.p*90 : 0, 1, moving ? (r.v||0)/Math.max(1,r.sp||24) : 0);
      shadowAt(q.x,q.z,1.15);
    });
  }else{
    S.bases.forEach((b,i)=>{
      if(!b) return;
      drawFigure(runKit, BASEPOS[i+1].x, BASEPOS[i+1].z, 0, 0, 1, 0);
      shadowAt(BASEPOS[i+1].x, BASEPOS[i+1].z, 1.15);
    });
  }

  // ボール
  if(S.phase==='pitch' && pitch){
    const p=pitchPos(clamp(pitch.t,0,1.25));
    drawTrail();
    drawBallAt(p[0],p[1],p[2],0.155);
    shadowAt(p[0], p[2], 0.5+p[1]*0.05);      // 地面の影＝高さの手がかり
  }else if(ball){
    drawTrail();
    drawBallAt(ball.x, ball.z, ball.y, 0.28);   // 引きの画面では実寸だと見えないので大きめに描く
    shadowAt(ball.x, ball.y, 0.42*(1+ball.z*0.012));
  }

  // ストライクゾーン + 狙い
  if(duel && !S.over && (S.phase==='pitch'||S.phase==='windup'||S.phase==='aimPitch'||S.phase==='msg')){
    gl.enable(gl.BLEND); gl.depthMask(false);
    drawMesh(MESH.zone, M4.trans(0,0,0.3), {alpha:0.42, unlit:true, tint:[1,1,1]});
    // 投球の到達点マーク（打席のときだけ・難易度で出る早さが変わる）
    if(S.phase==='pitch' && pitch && isPlayerBatting()){
      const mk=DIFF[DIFF_I].mark;
      if(pitch.t>=mk){
        const a=clamp((pitch.t-mk)/0.16,0,1)*0.9;
        drawMesh(MESH.ring, M4.mul(M4.trans(pitch.tx,pitch.ty,0.32), M4.scale(1.9)),
          {alpha:a, unlit:true, tint:[0.40,0.95,1.0]});
      }
    }
    /* ミートカーソルの大きさは打ち方に連動させる。
       ミート打ちは輪が大きく（当てやすい）、強振は小さい（狭いが飛ぶ）。 */
    const ringK = isPlayerBatting() ? 1.35*BATMODE[batMode].aw : 0.85;
    /* カーソルは判定と同じ横長楕円（横=aw/0.60・縦=aw/1.30 ≈ 2.2:1）。
       バットは横に長いのに真円のカーソルはおかしい（オーナー指摘）。 */
    const rm = M4.mul(M4.trans(aim.x,aim.y,0.34), M4.scale(ringK));
    drawMesh(MESH.oval, rm, {alpha:0.95, unlit:true,
      tint: isPlayerBatting()?[1,0.76,0.24]:[0.35,0.72,1]});
    gl.depthMask(true); gl.disable(gl.BLEND);
  }
  drawHUD();
}
/* 選手を描く。走った距離(runDist)から歩幅の位相を作り、脚と腕を前後に振る。
   走っていない時は静かに構える。speed01=0〜1で、速いほど大きく振る。 */
/* 選手を描く。走った距離(runDist)から歩幅の位相を作り、脚と腕を前後に振る。
   pose を渡すと、走り以外の動き（投球・送球・捕球・守備の構え）に差し替わる。
   pose の中身: {armL,armR}=腕の前後角 / {armLZ,armRZ}=腕の横開き
                lean=前傾 / crouch=沈み込み / legL,legR=脚の角度 / turn=上体のひねり */
function drawFigure(kit, fx, fz, face, runDist, scale, speed01, pose){
  const s = scale||1;
  const sp = clamp(speed01===undefined?1:speed01, 0, 1);
  const ph = (runDist||0)*0.62;                    // 歩幅の位相
  const sw = Math.sin(ph) * (0.55+0.65*sp);        // 脚の振り
  const aw = -Math.sin(ph) * (0.42+0.50*sp);       // 腕は脚と逆
  const P = pose||{};
  /* rise=体全体の上下オフセット(ft)。跳び上がり(正)・飛び込みで地面へ沈む(負)に使う */
  const bob = (P.rise||0) + (P.crouch!==undefined ? -P.crouch : (sp>0.02 ? Math.abs(Math.cos(ph))*0.13*sp : 0));
  const lean = P.lean!==undefined ? P.lean : 0.16*sp;
  let base = M4.mul(M4.trans(fx,bob,fz), M4.rotY((face||0) + (P.turn||0)));
  if(s!==1) base = M4.mul(base, M4.scale(s));
  const body = M4.mul(base, M4.rotX(lean));
  drawMesh(MESH[kit], body);
  const hipY=2.08, shY=3.48, KNEE=-1.0, ELB=-0.74;
  /* 走りの既定関節（棒腕・棒脚が人形っぽさの主因だった）:
     ・膝は後ろへ振れている脚が畳まれる（蹴り戻し）
     ・肘は約90度に曲げて振る（腕のポンプ）
     ポーズ側は kneeL/kneeR/elbowL/elbowR（正=曲げる）で上書きできる。 */
  const kneeDefL = 0.10 + Math.max(0, -Math.sin(ph))*1.15*sp;
  const kneeDefR = 0.10 + Math.max(0,  Math.sin(ph))*1.15*sp;
  const elbDef   = 0.25 + 0.80*sp;
  const seg=(up,lo, x,y, ang, zang, bendSigned, joint)=>{
    let m = M4.mul(body, M4.trans(x,y,0));
    if(zang) m = M4.mul(m, M4.rotZ(zang));
    m = M4.mul(m, M4.rotX(ang));
    drawMesh(up, m);
    let m2 = M4.mul(m, M4.trans(0,joint,0));
    m2 = M4.mul(m2, M4.rotX(bendSigned));
    drawMesh(lo, m2);
    return m2;
  };
  const kL = P.kneeL!==undefined?P.kneeL:kneeDefL;
  const kR = P.kneeR!==undefined?P.kneeR:kneeDefR;
  const eL = P.elbowL!==undefined?P.elbowL:elbDef;
  const eR = P.elbowR!==undefined?P.elbowR:elbDef;
  // 膝は後ろへ（-rotX）、肘は前へ（+rotX）曲がる
  seg(MESH[kit+'Thigh'], MESH[kit+'Shin'], -0.22, hipY, P.legL!==undefined?P.legL: sw, 0, -kL, KNEE);
  seg(MESH[kit+'Thigh'], MESH[kit+'Shin'],  0.22, hipY, P.legR!==undefined?P.legR:-sw, 0, -kR, KNEE);
  const fmL = seg(MESH[kit+'UpArm'], MESH[kit+'FoArm'], -0.62, shY, P.armL!==undefined?P.armL: aw, P.armLZ, eL, ELB);
  seg(MESH[kit+'UpArm'], MESH[kit+'FoArm'],  0.62, shY, P.armR!==undefined?P.armR:-aw, P.armRZ, eR, ELB);
  // グラブ（左前腕の先＝手の位置）
  if(P.glove!==false){
    drawMesh(MESH.glove, M4.mul(fmL, M4.trans(0,-0.72,0)));
  }
  return body;                       // バットなどを手に付けるために体の行列を返す
}
/* 守備の姿勢を状況から決める。
   ・ボールを持って投げようとしている → テイクバックから振り下ろし
   ・打球を捕りに行っている（近い）   → グラブを出す
   ・投球前・プレー中                 → 膝を割って構える
   これが無いと、投げる瞬間も捕る瞬間も棒立ちのまま値だけが変わる。 */
function fielderPose(f){
  /* 飛び込み・跳び上がりの見た目（オーナー要望 2026-08-04。判定は既存の
     dive01・跳びのreachをそのまま使い、見た目だけを付ける）。
     diveT: 体を倒して腕を伸ばし、地面すれすれ→起き上がり。
     jumpT: 山なりに浮き上がり、グラブを頭上いっぱいに伸ばす。 */
  if(f.diveT>0){
    const u=clamp(f.diveT/0.9, 0, 1);              // 1=飛び込んだ瞬間 → 0=起き上がり
    const flat=0.85+0.55*(f.diveAmt||0.5);
    return {lean:flat*u+0.15, crouch:1.5*u, rise:-0.35*u,
            armL:-2.85, armLZ:-0.12, armR:-2.35, armRZ:0.12, elbowL:0.08, elbowR:0.15,
            legL:-0.35*u, legR:0.35*u, kneeL:0.5*u, kneeR:0.7*u};
  }
  if(f.jumpT>0){
    const u=Math.sin(Math.PI*clamp(1-f.jumpT/0.55, 0, 1));   // 上がって降りる山なり
    return {rise:2.1*u, armL:-3.05, armLZ:-0.08, armR:0.5, elbowL:0.05, elbowR:0.8, crouch:0.15,
            legL:0.85*u, legR:-0.45*u, kneeL:1.3*u, kneeR:0.8*u, lean:-0.05};   // 脚をたたんで跳ぶ
  }
  const T = throwPlay;
  if(T && (T.thrower===f||T.receiver===f) && ball){
    if(T.thrower===f && (T.stage==='transfer'||T.stage==='step')){
      const k = clamp(T.t/Math.max(0.15,T.transfer), 0, 1);   // 0=捕った直後 1=離す寸前
      /* 送球: テイクバックで肘を深くたたみ(1.6)、離す寸前に伸ばす(0.2)＝腕のしなり */
      return {armR:-2.5+0.7*k, armL:0.9-0.5*k, elbowR:1.6-1.4*k, elbowL:0.7,
              lean:0.10, turn:0.5-0.5*k, crouch:0.05};
    }
    if(T.receiver===f && T.stage==='catch')
      return {armL:-2.2, armLZ:-0.35, armR:0.3, elbowL:0.15, elbowR:0.6, lean:-0.05};
  }
  if(ball && f.primary && S.phase==='flight'){
    const d = Math.hypot(ball.x-f.cx, ball.y-f.cy);
    if(d<9){                                   // 捕球体勢
      const high = ball.z>4.0;
      return high ? {armL:-2.4, armLZ:-0.30, armR:-0.5, elbowL:0.12, elbowR:0.5, lean:-0.08}
                  : {armL:-0.35, armR:0.25, elbowL:0.20, elbowR:0.4, lean:0.55, crouch:0.55,
                     kneeL:0.85, kneeR:0.85};   // 低い球は膝を折って腰を落とす
    }
  }
  if(S.phase==='pitch'||S.phase==='windup'||S.phase==='flight')
    return {armL:0.55, armR:0.45, elbowL:0.95, elbowR:0.95,
            lean:0.30, crouch:0.30, legL:0.28, legR:-0.28, kneeL:0.5, kneeR:0.5};   // 膝を割った構え
  return null;
}
/* 投手の投球動作。振りかぶり→踏み出し→リリース→フォロースルー。
   遠くから見て「投げている」と分かるかどうかは、腕の角度より
   ①体が本塁側へ踏み出すこと ②体が横を向いてから正面へ回ること で決まる。
   その場に立ったまま腕だけ動かしていたので、不自然に見えていた。
   stride=本塁側へ出る量(ft) / turn=上体のひねり */
function pitcherPose(){
  let k=null;
  if(anim.wind>=0 && S.phase==='windup') k = clamp(anim.wind/0.85,0,1)*0.55;
  else if(S.phase==='pitch' && pitch) k = 0.55 + 0.45*clamp(pitch.t*2.4,0,1);
  if(k===null) return null;
  if(k<0.35){                                   // 振りかぶり（軸足に乗り、体を横に向けて足を上げる）
    const u=k/0.35;
    /* 上げた足は膝を深くたたむ（棒のまま上げると人形になる）。グラブ側の肘も軽く曲げる */
    return {armL:0.5-1.5*u, armR:0.4-1.1*u, elbowL:0.4+0.5*u, elbowR:0.5+0.6*u,
            legL:-1.7*u, legR:0.15*u, kneeL:1.5*u, kneeR:0.15,
            lean:-0.12*u, crouch:0.12*u, turn:-0.55*u, stride:0};
  }
  if(k<0.62){                                   // 踏み出し（前へ出ながら腕を後ろへ引く）
    const u=(k-0.35)/0.27;
    /* コッキング: 投げ腕の肘を90度以上にたたんで担ぐ（しなりの見た目の主役） */
    return {armL:-1.0+0.7*u, armR:-0.7-2.0*u, elbowL:0.9-0.4*u, elbowR:1.1+0.7*u,
            legL:-1.7+2.5*u, legR:0.15+0.40*u, kneeL:1.5-1.2*u, kneeR:0.15+0.25*u,
            lean:-0.12+0.42*u, crouch:0.12+0.30*u, turn:-0.55+0.45*u, stride:3.4*u};
  }
  const u=clamp((k-0.62)/0.38,0,1);             // リリース〜フォロースルー（体を正面へ回し切る）
  /* リリースで肘が伸び切り(1.8→0.1)、フォローで軽く戻る */
  return {armL:-0.3+1.0*u, armR:-2.7+3.6*u, elbowL:0.5, elbowR:Math.max(0.1, 1.8-3.2*u),
          legL:0.8+0.4*u, legR:0.55-1.0*u, kneeL:0.3, kneeR:0.4+0.5*u,
          lean:0.30+0.30*u, crouch:0.42-0.16*u, turn:-0.10+0.55*u, stride:3.4+2.0*u};
}
/* 影は太陽の方向へ伸ばして落とす。真下に丸い円を置くと、
   どの選手も同じ位置に同じ形の影を持つことになり、貼り絵のように見える。
   太陽の向き(0.42,0.80,-0.43)から、影は逆向きに約0.52倍の長さで伸びる。 */
const SHADOW_DX = -0.42/0.80, SHADOW_DZ = 0.43/0.80;
function shadowAt(fx,fz,r,h){
  const hh = (h===undefined?4.6:h);          // 影を落とす物の高さ
  const ox = SHADOW_DX*hh*0.5, oz = SHADOW_DZ*hh*0.5;
  gl.enable(gl.BLEND); gl.depthMask(false);
  let m = M4.mul(M4.trans(fx+ox,0.15,fz+oz), M4.rotY(Math.atan2(SHADOW_DX,SHADOW_DZ)));   // 地面テクスチャ(0.08)より上
  m = M4.mul(m, M4.scaleXYZ(r*0.85, r, r*1.55));
  drawMesh(MESH.shadow, m, {alpha:0.34, unlit:true});
  gl.depthMask(true); gl.disable(gl.BLEND);
}
function drawBallAt(x,y,z,r){
  drawMesh(MESH.ball, M4.mul(M4.trans(x,y,z), M4.scale(r)), {tint:[1,1,1]});
}
function drawTrail(){
  gl.enable(gl.BLEND); gl.depthMask(false);
  for(let i=0;i<trail.length;i++){
    const t=trail[i], a=(i/trail.length);
    drawMesh(MESH.ball, M4.mul(M4.trans(t[0],t[1],t[2]), M4.scale(0.055+0.06*a)),
      {alpha:0.13+0.30*a, unlit:true, tint:[1,1,1]});
  }
  gl.depthMask(true); gl.disable(gl.BLEND);
}
function drawBatter(){
  const batKit = (S.half===0)? 'away' : 'home';
  const side=-1;                                  // 右打者＝三塁側
  let sw=0;
  if(anim.swing>=0){
    const p=clamp(anim.swing/0.28,0,1);
    sw = Math.sin(p*Math.PI)* (p<0.5? p*2 : 1) * 2.0;
  }
  // 打者は見た目だけの存在。実寸どおり(-2.9ft)に置くと望遠の画角では画面の1/3を塞ぐので、
  // 画面端に寄せて配置している（当たり判定には一切関与しない）
  const bx=side*4.6, bz=-0.5;
  /* 打者の姿勢。構えでは膝を割って上体をひねり、スイングで腕を振り出して体を回す。
     棒立ちのままバットだけが動いていたので、当たった瞬間の迫力が出ていなかった。 */
  const armA = -0.55 - sw*0.95;                // 両腕の前後角（バットもこれに合わせる）
  const elbow = 1.05 - sw*0.85;                // 構えは肘をたたみ、スイングで伸ばし切る
  const body = drawFigure(batKit, bx, bz, Math.PI/2 + sw*0.50, 0, 1, 0, {
    crouch: 0.34 - sw*0.10, lean: 0.16 + sw*0.10, turn: -0.30 + sw*0.85,
    legL: 0.30 - sw*0.15, legR: -0.34 + sw*0.30,
    kneeL: 0.45 - sw*0.25, kneeR: 0.55 - sw*0.15,          // 膝を割って構え、回転で伸びる
    armL: armA, armR: armA + 0.10,
    elbowL: elbow, elbowR: elbow,
    armLZ: -0.22 + sw*0.16, armRZ: 0.20 - sw*0.16, glove:false
  });
  shadowAt(bx,bz,1.15);
  /* バットは「手の先」から生やす。肘の関節を通した同じ連鎖で手の位置を出す
     （直腕前提のままだと、肘をたたんだ構えでバットが手から浮く）。 */
  let bat = M4.mul(body, M4.trans(0.62, 3.48, 0));        // 右肩
  bat = M4.mul(bat, M4.rotZ(0.20 - sw*0.16));
  bat = M4.mul(bat, M4.rotX(armA + 0.10));                 // 上腕の向き
  bat = M4.mul(bat, M4.trans(0,-0.74,0));                  // 肘まで
  bat = M4.mul(bat, M4.rotX(elbow));                       // 前腕の曲げ
  bat = M4.mul(bat, M4.trans(0,-0.70,0));                  // 手の位置まで
  bat = M4.mul(bat, M4.rotZ(-1.05 + sw*1.35));             // 構えは立て、スイングで寝かせる
  drawMesh(MESH.bat, bat);
}

      hud.fillStyle = i===0 ? '#3a4757' : (onBase ? '#5aa9ff' : '#2b3542');
      hud.fillRect(-7,-7,14,14); hud.restore();
    });
    // 走っている走者
    runners.forEach(r=>{
      if(r.out) return;
      const i=Math.floor(Math.min(r.p,3.999)), f2=r.p-i;
      const a=bp[i%4], b2=bp[(i+1)%4];
      const x=a[0]+(b2[0]-a[0])*f2, y=a[1]+(b2[1]-a[1])*f2;
      hud.beginPath(); hud.arc(x,y,6,0,7);
      hud.fillStyle = r.p>=3.999 ? '#3fd66a' : '#ffc23d';
      hud.fill(); hud.strokeStyle='#0b0f16'; hud.lineWidth=2; hud.stroke();
    });
    hud.textAlign='center'; hud.font='11px sans-serif'; hud.fillStyle='#8a97a8';
    hud.fillText('走者', cx, cy+sz+26);

  // プレー中の操作案内
  if(!S.over && !isPaused() && (S.phase==='flight'||S.phase==='throwing')){
    const lines=[];
    const bn={1:'一塁',2:'二塁',3:'三塁',4:'本塁'};
    if(isPlayerBatting()){
      lines.push('S = 進塁（打者と詰まっている走者）　Z = 全員強行　X = 帰塁');
      const risky=runners.filter(r=>!r.out && r.goal>(r.safeGoal!==undefined?r.safeGoal:99));
      const where=runners.filter(r=>!r.out).map(r=>bn[Math.min(4,Math.ceil(r.goal))]||'本塁').join(' ');
      if(where) lines.push(`▶ 走者の狙い: ${where}${risky.length?'（無理な進塁は刺されます）':''}`);
    }else{
      lines.push('送球先  S=二塁  Z=三塁  C=一塁  X=本塁  0=投手へ返球');
      lines.push(manualThrow!=null
        ? `▶ 送球先を「${manualThrow==='P'?'投手':bn[manualThrow]}」に指定`
        : '（無指定なら自動で最適な塁へ投げます）');
    }
    hud.textAlign='center'; hud.font='13px sans-serif';
    lines.forEach((t,i)=>{
      const y=VH-58+i*20;
      hud.lineWidth=4; hud.strokeStyle='rgba(11,15,22,.85)'; hud.strokeText(t,VW/2,y);
      hud.fillStyle=i===0?'#cfd8e3':'#ffc23d'; hud.fillText(t,VW/2,y);
    });
  }
  if(isPaused()){
    hud.fillStyle='rgba(8,11,17,.55)'; hud.fillRect(0,0,VW,VH);
    hud.textAlign='center'; hud.font='bold 38px sans-serif';
    hud.fillStyle='#ffc23d';
    hud.fillText(rosterOpen?'選手能力を表示中':'ポーズ中', VW/2, VH/2);
    hud.font='14px sans-serif'; hud.fillStyle='#cfd8e3';
    hud.fillText(rosterOpen?'Escで閉じると再開します':'Pキーかボタンで再開', VW/2, VH/2+28);
  }
  hud.textBaseline='alphabetic';
}
function rr(c,x,y,w,h,r,fill){
  c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  c.fillStyle=fill; c.fill();
}

/* ========================= 入力 ========================= */
const stage=document.getElementById('stage');
function screenToZone(e){
  if(!VP) return null;                          // 初回描画前はまだ行列が無い
  const r=glc.getBoundingClientRect();
  const nx=((e.clientX-r.left)/r.width)*2-1;
  const ny=1-((e.clientY-r.top)/r.height)*2;
  const inv=M4.invert(VP);
  const un=(z)=>{
    const x=inv[0]*nx+inv[4]*ny+inv[8]*z+inv[12];
    const y=inv[1]*nx+inv[5]*ny+inv[9]*z+inv[13];
    const zz=inv[2]*nx+inv[6]*ny+inv[10]*z+inv[14];
    const w=inv[3]*nx+inv[7]*ny+inv[11]*z+inv[15];
    return [x/w,y/w,zz/w];
  };
  const a=un(-1), b=un(1);
  const dz=b[2]-a[2];
  if(Math.abs(dz)<1e-6) return null;
  const t=(0.3-a[2])/dz;                      // ゾーン面 z=0.3
  return {x: clamp(a[0]+(b[0]-a[0])*t, -2.0, 2.0),
          y: clamp(a[1]+(b[1]-a[1])*t,  0.3, 5.2)};
}
stage.addEventListener('mousemove', e=>{ if(S.over||isPaused()) return;   // ポーズ中は狙いを動かさない
  const p=screenToZone(e); if(p){ aim.x=p.x; aim.y=p.y; } });
stage.addEventListener('mousedown', e=>{
  if(S.over || isPaused()) return;
  const p=screenToZone(e); if(p){ aim.x=p.x; aim.y=p.y; }
  if(S.phase==='aimPitch'){
    launchPitch(S.pitchSel, aim.x/ZX, (aim.y-(ZY0+ZY1)/2)/((ZY1-ZY0)/2));
    return;
  }
  if(S.phase==='pitch' && isPlayerBatting() && !pitch.swung)
    doSwing(aim.x, aim.y, (pitch.t-1)*pitch.dur*1000);
});
/* 走塁は「今キーが押されているか」で判定する。押している間だけ走り、離した塁で止まる。
   押した回数で数えると、キーの連続発火（オートリピート）で意図せず進み続けてしまう。 */
const held = {};
window.addEventListener('keyup', e=>{ held[e.key.toLowerCase()]=false; });
window.addEventListener('blur', ()=>{ for(const k in held) held[k]=false; });
/* 盗塁。投球中にSを押している間、塁上の走者が一斉に次の塁へ走る（重盗も可）。
   一度走り出したら止まらない（実際の盗塁と同じで、戻るのは牽制の話）。 */
function updateStealCommands(){
  if(!isPlayerBatting() || S.over || isPaused()) return;
  /* 投球動作が始まる前（前の打球の後や球種を選んでいる間）からSを押していると、
     走者は投手を見ずに飛び出す＝牽制で刺される。押しっぱなしで確実に盗塁できる抜け道を塞ぐ。 */
  if(S.phase==='msg'||S.phase==='play'){ S.earlyHold = !!(held['s']||held['z']); return; }
  if(S.phase==='windup'){
    if(S.earlyHold && (held['s']||held['z']) && runners.some(r=>!r.out)){
      S.jumpEarly=true;
      runners.forEach(r=>{ if(r.out||r.origin>=4) return;
        r.goal=Math.min(4, r.origin+1); r.jumped=true;
        r.p=Math.max(r.p, r.origin+0.16); r.v=Math.max(r.v||0,(r.sp||23)*0.5); });
    }
  }
  if(!(S.phase==='windup'||S.phase==='pitch')) return;
  /* 実際の走者は投手の始動を見て走り出し、そこから捕手がボールを受けるまでが約1.3秒。
     このゲームは投球動作も球の飛行もプレイヤーに合わせて長くしてあるので、
     「捕手が受ける1.3秒前」に揃える。ここがずれると盗塁成功率が0%にも100%にもなる。 */
  const untilCatch = (S.phase==='windup') ? (S.timer + 0.78) : (1-pitch.t)*pitch.dur;
  if(untilCatch > 1.15) return;
  /* 投球中の走塁操作は打球処理中と同じ（S=進塁 / X=帰塁、前の走者を追い越さない・
     後ろの走者が入る塁へは戻れない）。一三塁の重盗や、途中で戻す判断ができる。 */
  applyRunnerKeys();
  // 走り出した走者に「スタートを切った」勢いを与え、盗塁として扱う
  runners.forEach(r=>{
    if(r.out || r.stole) return;
    if(r.goal < r.origin+0.9) return;
    r.stole=true; S.stealing=true;
    /* スタートを切った時点で、走者はリードを大きく取って体重も移している。
       二塁走者は投手から見えにくいぶん大きく離れられる（三盗が現実的な賭けになる）。 */
    /* リード（約11ft）＋投手の始動を見て動き出すぶん。実際の走者は投球が離れる前から
       動いており、これが盗塁成功率8割の主因。二塁走者は投手から見えにくいぶん大きく取れる。 */
    /* リードは約12ft。走り出しは静止からで、体重移動のぶんだけ初速がある
       （ここを大きくすると誰でも盗塁できてしまう）。 */
    r.p=Math.max(r.p, r.origin + (r.origin===2 ? 0.17 : 0.13));
    r.v=Math.max(r.v||0, (r.sp||23)*(r.origin===2 ? 0.26 : 0.20));
  });
  /* 走られた瞬間に内野手がベースカバーへ入る。送球を投げる時に走り出したのでは
     カバーが間に合わず、アウトのタイミングでもセーフになってしまう。 */
  if(S.stealing && !S.stealCover){
    S.stealCover=true;
    fielders.forEach(f=>{ f.coverBase=null; });
    const map={1:'一',2:'遊',3:'三',4:'投'};
    [1,2,3,4].forEach(b=>{ const f=fielders.find(x=>x.n===map[b]);
      if(f){ f.coverBase=b; const p=throwPoint(b); setTarget(f,p[0],p[1]);
        /* 内野手は投手が投げる動作の間に塁側へ寄っている。完全な静止から走り出すのではない。
           ここを止まった状態にすると、カバーが塁に着く前に送球が届いてしまい、
           足の遅い走者でも盗塁が成功する。 */
        f.v=Math.max(f.v||0, f.sp*0.55); } });
  }
}
function updateRunnerCommands(){
  if(!isPlayerBatting() || S.over || isPaused()) return;
  if(!(S.phase==='flight'||S.phase==='throwing')) return;   // 結果が確定した後は走塁指示を受けない
  /* 送球が終わって投手に返る段階でも、走者はまだ次の塁を狙える（守備の隙を突く走塁）。
     ここで受け付けを止めていたため、押していた進塁の指示が無視されていた。 */
  applyRunnerKeys();
}
/* 走塁キーの中身。打球処理中・投球中・盗塁の送球中で同じ規則を使う。
   S=進塁（前の走者を追い越さない） / X=帰塁（後ろの走者が入る塁へは戻れない）。 */
function applyRunnerKeys(){
  const go = held['s']||held['z'], back = held['x'];
  if(!go && !back) return;
  // 後ろの走者（打者走者）から前の走者の順に並べる
  const live = runners.filter(r=>!r.out).sort((a,b)=>a.origin-b.origin);
  /* Zは「先頭の走者だけ」を走らせる。二塁走者を本塁へ返したいだけなのに
     Sだと打者走者まで一塁を回ってしまい、挟まれる、という事故を避ける。 */
  const leadOnly = held['z'] && !held['s'];
  const lead = live.filter(r=>r.p<4).sort((a,b)=>b.p-a.p)[0];
  /* 塁を指定して1人だけ動かす。1〜3キーがその塁の走者に対応する（1=一塁走者…）。
     「先頭だけ(Z)」しかなかったため、一三塁で一塁走者だけを走らせることができなかった。
     指定中は S/X もその走者にだけ効く。 */
  const pickBase = ['1','2','3'].findIndex(k=>held[k])+1;
  const picked = pickBase ? live.find(r=>Math.floor(r.p+1e-9)===pickBase || r.origin===pickBase) : null;
  /* 高く上がって捕られそうな打球が飛んでいる間、Sは「タッチアップの構え」を意味する。
     ここで毎フレーム進塁を命じ続けていたため、塁へ戻す処理が打ち消され、
     Sを押しっぱなしにした走者は離塁したまま捕球を迎えてタッチアップできなかった。 */
  /* 2アウトではタッチアップ・ハーフウェイは存在しない（捕られた瞬間に攻撃終了なので、
     待つ意味が無い＝打った瞬間から全力で走るのが実際の野球）。ここを見ていなかったため、
     2死でSを押していても二塁走者が塁間で1.5秒止まっていた（録画183631）。 */
  const tagPhase = ball && !ball.landed && ball.canCatchAir && ball.maxZ>15 && S.phase==='flight'
                   && baseOuts()<2;
  if(go && tagPhase){
    /* 打球が上がっている間のSの意味は、走者の塁で変わる（実際の走塁と同じ）。
       ・三塁走者＝タッチアップ。塁を踏んだまま待ち、捕られた瞬間に走る（犠牲フライ）
       ・一塁・二塁走者＝ハーフウェイ。塁間の半分まで出て打球を見る
         捕られたら戻り、落ちたらそこから走る
       全員を塁上で待たせていたため、左線に落ちる当たりでもSを押した走者が
       打球が落ちるまで動かず、1.5秒ぶん出遅れていた（録画で確認）。 */
    live.forEach(r=>{
      if(r.origin>=4) return;
      /* 打者走者にタッチアップは無い（アウトになるのは自分の捕球）。フライの間も
         Sで普通に先の塁を狙える。ハーフウェイ処理が打者を無視して早期returnしていたため、
         フライ中はSを押しても一塁から先へ進めなかった（オーナー指摘）。 */
      if(r.origin===0){
        const i=live.indexOf(r), ahead=live[i+1];
        const here=Math.floor(r.p+1e-9);
        /* 上限は塁単位で数える。前走者がハーフウェイ(goal=2.45等)だと
           goal-1がそのまま1.45になり、打者が塁間の変な位置を目標にしてしまう。 */
        const max=(ahead && ahead.goal<4) ? Math.ceil(ahead.goal-1e-9)-1 : 4;
        r.goal=Math.max(here, Math.min(here+1, max, 4)); r.cmd='S';
        return;
      }
      if(leadOnly && r!==lead) return;            // Zは先頭の走者だけ
      if(picked && r!==picked) return;            // 塁を指定した時はその走者だけ
      r.tagUp=true;
      if(r.origin<3) setAutoGoal(r, r.origin+0.45, true);   // ハーフウェイ
    });
    return;
  }
  /* Xを押したらタッチアップの構えは取り消す。取り消せないままだと、
     一度Sを押した走者は捕球後に必ず走り出し、Xを押しても戻れなくなる。 */
  if(back) live.forEach(r=>{ r.tagUp=false; });
  if(go){
    /* 進塁は前の走者から決める。前の走者が行く塁より前には出られない（追い越せない）。 */
    for(let i=live.length-1;i>=0;i--){
      const r=live[i], ahead=live[i+1];
      /* フライ捕球後に戻っている最中は進めない（離塁アウトになる）。
         ただし塁に戻り着いたら踏み直したことになるので、そこからは走ってよい。
         ここを一律で止めていたため、Sを押しっぱなしにしていた走者は
         塁に戻った後もタッチアップできなかった。 */
      if(r.mustReturn){
        if(Math.abs(r.p-r.origin)>0.02) continue;
        r.mustReturn=false;
      }
      if(leadOnly && r!==lead) continue;   // Zは先頭の走者だけ
      if(picked && r!==picked) continue;   // 1〜3キーで塁を指定した時はその走者だけ
      const here=Math.floor(r.p+1e-9);
      /* 前の走者が本塁へ向かっている（または生還済み）なら塁は空くので塞がれない。
         本塁は何人でも入れる。ここを一律に「前の走者の1つ手前まで」にしていたため、
         1人が生還した瞬間に後ろの走者が三塁で止まっていた。 */
      const max = (ahead && ahead.goal<4) ? ahead.goal-1 : 4;
      r.goal = Math.max(here, Math.min(here+1, max, 4));
      r.cmd='S';
    }
  }else{
    /* 帰塁は後ろの走者から決める。後ろの走者が入る塁へは戻れないので、
       戻り先が塞がっている走者はそのまま次の塁へ押し出される（実際の野球と同じ）。
       打者走者は本塁へは戻れないが、一塁を回っていれば一塁へ戻れる。 */
    for(let i=0;i<live.length;i++){
      const r=live[i], behind=live[i-1];
      if(picked && r!==picked) continue;   // 塁を指定した時はその走者だけ戻す
      const here=Math.floor(r.p+1e-9);
      const min = behind ? behind.goal+1 : (r.origin===0 ? 1 : 0);
      r.goal = Math.min(4, Math.max(here, min));
      r.cmd='X';
    }
  }
}

window.addEventListener('keydown', e=>{
  held[e.key.toLowerCase()]=true;
  if(e.repeat) return;      // 送球先の指定など「1回押したら1回」の操作用
  if(e.key==='Escape'){ if(rosterOpen) setRoster(false); return; }
  if(e.key==='r'||e.key==='R'){ setRoster(!rosterOpen); return; }
  if(e.key==='p'||e.key==='P'){ togglePause(); return; }
  // F=直前のプレーを保存 / G=たまっている全プレーを保存（不具合の報告用）
  if(e.key==='f'||e.key==='F'){ recSave(false); return; }
  if(e.key==='g'||e.key==='G'){ recSave(true);  return; }
  if(isPaused()) return;                       // ポーズ中は操作を受け付けない
  /* 打球が飛んでいる間の操作は S / Z / X / C。キーの並びがそのまま塁の位置になる。
         S = 二塁
     Z=三塁  X=本塁  C=一塁
     走塁も同じ指の位置で S=進塁 / X=帰塁。矢印キーは投球の狙い用に残してある。 */
  const inPlay = (S.phase==='flight'||S.phase==='throwing');   // 結果演出中(play)は受け付けない
  const k = e.key.toLowerCase();
  if(inPlay && !isPlayerBatting()){
    if(k==='s'){ setManualThrow(2); return; }
    if(k==='z'){ setManualThrow(3); return; }
    if(k==='c'){ setManualThrow(1); return; }
    if(k==='x'){ setManualThrow(4); return; }
    if(k==='0'){ setManualThrow('P'); return; }
  }
  // 走塁(S/Z/X)は「押されている間ずっと」で判定するので、ここでは扱わない（下の held を見る）
  if(e.code==='Space'){
    e.preventDefault();
    if(S.phase==='pitch' && isPlayerBatting() && !pitch.swung)
      doSwing(aim.x, aim.y, (pitch.t-1)*pitch.dur*1000);
    else if(S.phase==='msg'||S.phase==='play') S.timer=0;
    return;
  }
  if(['1','2','3','4'].includes(e.key)){
    if(isPlayerBatting()){ if(e.key!=='4'){ batMode=+e.key-1; ui(); } }   // 1=ミート 2=強振 3=バント
    else { S.pitchSel=+e.key-1; ui(); }
  }
  const st=0.10;
  if(e.key==='ArrowLeft') aim.x=clamp(aim.x-st,-2,2);
  if(e.key==='ArrowRight') aim.x=clamp(aim.x+st,-2,2);
  if(e.key==='ArrowUp') aim.y=clamp(aim.y+st,0.3,5.2);
  if(e.key==='ArrowDown') aim.y=clamp(aim.y-st,0.3,5.2);
});

/* ========================= HTML UI ========================= */
function ui(){
  const maxI=Math.max(9,S.inning);
  let h='<tr><th></th>';
  for(let i=1;i<=maxI;i++) h+=`<th>${i}</th>`;
  h+='<th>計</th><th>H</th><th>E</th></tr>';
  [0,1].forEach(t=>{
    h+=`<tr class="${S.half===t&&!S.over?'act':''}"><td>${t===0?'あなた':'CPU'}</td>`;
    for(let i=0;i<maxI;i++){ const v=S.line[t][i]; h+=`<td>${v===undefined?'':v}</td>`; }
    h+=`<td class="tot">${total(t)}</td><td class="tot">${S.hits[t]}</td><td class="tot">${(S.errors||[0,0])[t]}</td></tr>`;
  });
  document.getElementById('score').innerHTML=h;

  document.getElementById('info').innerHTML =
    `<div><b>${S.inning}回${S.half===0?'表':'裏'}</b> ／ ${S.half===0?'あなたの攻撃':'あなたの守備'}</div>
     <div>カウント <b>${S.balls}</b>-<b>${S.strikes}</b> ／ アウト <b>${S.outs}</b></div>
     <div>打者 <b>${LINEUP[battingTeam()][S.order[battingTeam()]]}</b></div>
     <div class="muted">直前: ${S.lastPlay}</div>`;

  let c='';
  if(S.over){
    c=`<div><b>試合終了</b>　${total(0)} - ${total(1)}</div>
       <div class="row"><button id="restart">もう1試合</button></div>`;
  }else if(isPlayerBatting()){
    const inPlay = (S.phase==='flight'||S.phase==='throwing');
    const mb=(i,lab,key)=>`<button class="bm ${batMode===i?'on':''}" data-bm="${i}">${lab} <span class="k">${key}</span></button>`;
    c=`<div><b>攻撃中</b> — 飛んでくる球にタイミングを合わせる</div>
       <div>マウス＝バットの狙い（黄色い輪） ／ クリック か <span class="k">Space</span> ＝ スイング</div>

         ${mb(0,'ミート打ち','1')}${mb(1,'強振','2')}${mb(2,'バント','3')}</div>
       <div class="muted">ミート打ち＝当たる範囲が広いかわりに飛ばない／強振＝狭いが飛ぶ／バントは狙いの左右で転がす方向が決まります（2ストライクからのバント失敗は三振）。</div>
       <div class="muted">投球中に <span class="k">S</span> を押すと<b>盗塁</b>。走者が複数いれば全員が一斉に走ります（重盗）。</div>
       <div class="muted">輪の中心が球に近く、ミートの瞬間がそろうほど強い当たり。球の下を狙えばフライ、上ならゴロ。早く振れば引っ張り、遅ければ流し打ち。</div>
       <div class="row" style="margin-top:6px">
         <button id="pushBtn" ${inPlay?'':'disabled style="opacity:.45"'}>進塁 <span class="k">S</span></button>
         <button id="forceBtn" ${inPlay?'':'disabled style="opacity:.45"'}>先頭だけ <span class="k">Z</span></button>
         <button id="holdBtn" ${inPlay?'':'disabled style="opacity:.45"'}>帰塁 <span class="k">X</span></button>
       </div>
       <div class="muted"><span class="k">S</span>＝全員が次の塁へ／<span class="k">Z</span>＝<b>先頭の走者だけ</b>次の塁へ（打者走者を巻き込まずに前の走者だけ返せます）／<span class="k">X</span>＝手前の塁へ戻る。
         押していない間は自動で判断します。どこまで行けるかは足と送球の勝負で決まり、間に合わなければ刺されます。</div>`;
  }else{
    const inPlay = (S.phase==='flight'||S.phase==='throwing');
    const btn=(v,lab)=>`<button class="thr ${manualThrow===v?'on':''}" data-t="${v}" ${inPlay?'':'disabled style="opacity:.45"'}>${lab}</button>`;

       <div class="row" style="margin-top:6px">送球先:
         ${btn(2,'二塁 <span class="k">S</span>')}${btn(3,'三塁 <span class="k">Z</span>')}

         ${btn('P','投手 <span class="k">0</span>')}</div>
       <div class="muted">打球が飛んでいる間から指定できます。無指定なら自動で最適な塁へ投げます。</div>`;

      <button id="pauseBtn" style="margin-left:auto">${paused?'▶ 再開':'⏸ ポーズ'} <span class="k">P</span></button>
      <button id="rosterBtn">選手能力 <span class="k">R</span></button></div>
    <div class="row" style="padding-top:6px">
      <button id="recBtn">直前のプレーを保存 <span class="k">F</span></button>
      <button id="recAllBtn">全部保存 <span class="k">G</span></button>
      <span class="muted" style="align-self:center">おかしい場面が出たらすぐ押してください。出たJSONを渡せば、説明なしで何が起きたか追えます。</span></div>`;

    b.onclick=()=>{ DIFF_I=i; ui();};          // ポーズ中に見直せるようにする
    db.appendChild(b);
  });
  if(!S.over && !isPlayerBatting()){
    const box2=document.getElementById('pitches');
    PITCHES.forEach((p,i)=>{
      const b=document.createElement('button'); b.textContent=`${i+1}. ${p.name}`;
      if(i===S.pitchSel) b.className='on';
      b.onclick=()=>{ S.pitchSel=i; ui();};      // ポーズ中に見直せるようにする
      box2.appendChild(b);
    });
  }
  const rb=document.getElementById('restart'); if(rb) rb.onclick=()=>newGame();
  ctrl.querySelectorAll('button.thr').forEach(b=>{

  });
  ctrl.querySelectorAll('button.bm').forEach(b=>{

  });
  const pushB=document.getElementById('pushBtn'); if(pushB) pushB.onclick=function(){advanceRunners(false);};
  const forceB=document.getElementById('forceBtn'); if(forceB) forceB.onclick=function(){pressRunnerKey('z');};
  const holdB=document.getElementById('holdBtn'); if(holdB) holdB.onclick=retreatRunners;
  const pb=document.getElementById('pauseBtn'); if(pb) pb.onclick=togglePause;
  const rsb=document.getElementById('rosterBtn'); if(rsb) rsb.onclick=()=>setRoster(true);
  const rcb=document.getElementById('recBtn');    if(rcb) rcb.onclick=()=>recSave(false);
  const rab=document.getElementById('recAllBtn'); if(rab) rab.onclick=()=>recSave(true);
}
// 能力値の表示（パワプロ式のランク）
function rank(v){
  const r = v>=90?'S':v>=80?'A':v>=70?'B':v>=60?'C':v>=50?'D':v>=40?'E':v>=25?'F':'G';
  return `<span class="rk rk${r}">${r}</span> <span class="muted">${v}</span>`;
}
function drawRoster(){
  const el=document.getElementById('roster'); if(!el) return;
  let h='';
  [0,1].forEach(t=>{
    h+=`<div style="margin-bottom:14px"><b style="color:${t===0?'#ffc23d':'#e8eef5'}">${t===0?'あなた':'CPU'}</b>
      <table><tr><th>打順</th><th>選手</th><th>守備</th><th>弾道</th><th>ミート</th><th>パワー</th>
      <th>走力</th><th>肩力</th><th>守備力</th><th>捕球</th><th>送球</th></tr>`;
    ROSTER[t].forEach((p,i)=>{
      h+=`<tr><td>${i+1}</td><td class="nm">${p.n}</td><td>${p.pos}</td>
          <td>${'●'.repeat(p.弾)}<span class="muted">${'○'.repeat(4-p.弾)}</span></td>
          <td>${rank(p.ミ)}</td><td>${rank(p.パ)}</td><td>${rank(p.走)}</td>
          <td>${rank(p.肩)}</td><td>${rank(p.守)}</td><td>${rank(p.捕)}</td><td>${rank(p.送!=null?p.送:60)}</td></tr>`;
    });
    h+='</table></div>';
  });
  h+=`<div class="muted" style="font-size:12px;line-height:1.8">
    <b style="color:#ffc23d">能力値の効き方</b><br>
    弾道…打球の上がりやすさ（1〜4）　ミート…芯に当たる範囲の広さ　パワー…打球の初速<br>
    走力…塁間を走る速さと守備の足　肩力…送球の初速<br>
    守備力…守備範囲の広さ＋捕ってから投げるまでの動作の速さ<br>
    捕球…握り直しの速さと、捕り損ねる確率　送球…送球のそれにくさ（低いと悪送球が増える）<br>
    <span style="color:#e8eef5">持ち替え時間は守備力と捕球の両方で決まります</span>
    （両方Sで約0.42秒、両方Gだと約0.96秒。さらに捕球が低いと一定確率で捕り損ねて0.5〜1.1秒余計にかかります）</div>`;
  el.innerHTML=h;
}
/* ポーズ。能力値画面を開いている間は自動でポーズする */
/* ===== 自操作 =====
   守備: 矢印キーで送球先を選ぶ（ダイヤモンドの向きと同じ ↑二塁 →一塁 ←三塁 ↓本塁）
   走塁: ↑で進塁、↓で帰塁。自動で行く塁より先を狙った走者だけ、送球と競争して刺されうる */
let manualThrow = null;      // 守備側が指定した送球先（1,2,3,4=本塁,'P'=投手）
function setManualThrow(t){
  if(isPlayerBatting() || S.over) return;
  manualThrow = t;
  if(throwPlay && throwPlay.stage==='transfer') throwPlay.target = (t==='P') ? 1 : t;
  ui();
}
/* 走者の行き先は「自動で行ける塁(autoGoal) ＋ 自分で押した回数(extra)」で決まる。
   打球が飛んでいる最中はまだ自動の到達塁が確定していないので、押した回数だけを覚えておき、
   確定したときに足し合わせる（そうしないと自動判定に上書きされて操作が効かない）。 */
/* 自動の到達塁(autoGoal)は目安。プレイヤーがS/Xを押したらその指示が優先される。
   S = 今いる（or 向かっている）塁の次へ / X = 塁間にいるなら手前の塁へ戻る */
/* 自動の到達塁。ただし自分でS/Xを押した走者は、その指示のとおりに止まる
   （自動の追加進塁を上乗せしない）。1回押したら1つだけ、が分かりやすいため。
   指示は塁に着いた時点で消えるので、その後はまた自動に従う。 */
function setAutoGoal(r,g,force){
  r.autoGoal=g;
  // force=無条件に与えられる進塁（本塁打・四球・フライ後の帰塁）は手動指示より優先する
  if(!force && r.cmd) return;
  r.goal=g;
}
/* 進塁。1回押したら1つだけ進む「一発の指示」で、塁に着いたら指示は消える
   （押しっぱなしのように次々進んでしまわないようにするため）。
   既定(S)は打者走者と押し出される走者だけ。三塁走者のような自由な走者まで一律に
   走らせると、内野ゴロで本塁へ突っ込んで刺される事故になる。全員突っ込ませたい時はZ。 */
/* 画面のボタンからの進塁・帰塁。キー操作(S/X)と同じ規則を使う（挙動を1か所にまとめる）。
   ボタンは押しっぱなしにできないので、1回ぶんの指示として同じ処理を1度だけ走らせる。 */
function advanceRunners(){ pressRunnerKey('s'); }
function retreatRunners(){ pressRunnerKey('x'); }
function pressRunnerKey(k){
  if(!isPlayerBatting() || S.over) return;
  const save=held[k]; held[k]=true; updateRunnerCommands(); held[k]=save;
  ui();
}

let paused=false, rosterOpen=false;
function setRoster(open){
  rosterOpen=open;
  document.getElementById('modal').classList.toggle('on', open);
  if(open) drawRoster();
  ui();
}
function togglePause(){ paused=!paused; ui(); }
const isPaused = ()=> paused || rosterOpen;

/* ========================= ループ（コマ送りが止まる環境でも動く） ========================= */
let last=performance.now(), lastTick=performance.now(), useTimer=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!isPaused()) update(dt);      // ポーズ中は時間を止めるが描画は続ける
  draw();
}
function loop(now){
  if(useTimer) return;
  lastTick=performance.now();
  frame(now||performance.now());
  requestAnimationFrame(loop);
}
setInterval(()=>{
  const now=performance.now();
  if(useTimer){ frame(now); return; }
  if(now-lastTick>250){ useTimer=true; last=now; }
},16);

document.getElementById('closeRoster').onclick=()=>setRoster(false);
document.getElementById('modal').addEventListener('mousedown', e=>{
  if(e.target.id==='modal') setRoster(false);
});
initMeshes();
buildGroundTex();
newGame();
document.title += ' ['+BUILD+']';   // 今どのビルドで遊んでいるかタブ名で確認できる
requestAnimationFrame(loop);
</script>
